name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # The W09 launcher script is a zsh script; its tests need zsh on PATH.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Apply local migrations
        run: uv run python scripts/apply_migrations.py

      - name: Import sanity check
        run: uv run python -c "import scouting"

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src/scouting

      - name: import-linter
        run: uv run lint-imports

      - name: bandit
        run: uv run bandit -q -r src/scouting

      # tests/contracts, tests/integration, tests/security and tests/e2e are
      # written against a fully provisioned research environment: the real
      # licensed Wyscout archive plus its derived working artifacts, neither
      # of which is (or should be) committed to git. They pass locally once
      # that data is in place; this lightweight CI runs the portable subset
      # (tests/unit, tests/governance) that exercises real code paths against
      # synthetic fixtures instead. Two unit files are excluded for reasons
      # of their own:
      #  - test_w04_wyscout_runtime_control.py: a machine-attestation launcher
      #    intentionally pinned to the original developer's exact Homebrew/
      #    macOS toolchain; it isn't meant to pass on other machines.
      #  - test_w05_m0_models.py: pinned model-training output differs by
      #    platform BLAS backend, a real cross-platform reproducibility gap.
      - name: pytest
        run: >
          uv run pytest -q tests/unit tests/governance
          --ignore=tests/unit/test_w04_wyscout_runtime_control.py
          --ignore=tests/unit/test_w05_m0_models.py
