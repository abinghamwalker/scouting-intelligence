name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # The W09 launcher script is a zsh script; its tests need zsh on PATH.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Apply local migrations
        run: uv run python scripts/apply_migrations.py

      - name: Import sanity check
        run: uv run python -c "import scouting"

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src/scouting

      - name: import-linter
        run: uv run lint-imports

      - name: bandit
        run: uv run bandit -q -r src/scouting

      # Excluded, each for a reason unrelated to code correctness:
      #  - test_w04_wyscout_vertical_slice_context.py,
      #    test_wyscout_source_completion_index.py,
      #    test_wyscout_source_manifest.py: need the raw licensed Wyscout
      #    archive, which is intentionally not committed to git.
      #  - test_w10_expert_evidence_v2.py: needs the built research feature
      #    matrix, an artifact derived from that same licensed archive.
      #  - test_w04_wyscout_runtime_control.py: exercises a machine-attestation
      #    launcher pinned to the original developer's exact Homebrew/macOS
      #    toolchain by design; it isn't meant to pass on other machines.
      #  - test_w05_m0_models.py: pinned model-training output differs by
      #    platform BLAS backend; a real cross-platform reproducibility gap,
      #    not a regression.
      #  - tests/e2e: needs installed Playwright browsers, a running server
      #    with real data, and assumes a macOS Chrome install path.
      - name: pytest
        run: >
          uv run pytest -q
          --ignore=tests/unit/test_w04_wyscout_vertical_slice_context.py
          --ignore=tests/unit/test_wyscout_source_completion_index.py
          --ignore=tests/unit/test_wyscout_source_manifest.py
          --ignore=tests/unit/test_w10_expert_evidence_v2.py
          --ignore=tests/unit/test_w04_wyscout_runtime_control.py
          --ignore=tests/unit/test_w05_m0_models.py
          --ignore=tests/e2e
