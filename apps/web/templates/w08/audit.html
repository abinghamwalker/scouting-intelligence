{% extends "base.html" %}{% block body %}<h1>Append-only audit receipts</h1><table><caption>Material actions retained locally</caption><thead><tr><th scope="col">Sequence</th><th scope="col">Action</th><th scope="col">Target</th><th scope="col">Receipt</th></tr></thead><tbody>{% for row in rows %}<tr><th scope="row">{{ row.sequence }}</th><td>{{ row.action }}</td><td>{{ row.target_type }}</td><td><code>{{ row.receipt_digest }}</code></td></tr>{% else %}<tr><td colspan="4">No receipt visible.</td></tr>{% endfor %}</tbody></table>{% endblock %}
