archive_admission:
  matches:
    - matches_England.json
    - matches_France.json
    - matches_Germany.json
    - matches_Italy.json
    - matches_Spain.json
  events:
    - events_England.json
    - events_France.json
    - events_Germany.json
    - events_Italy.json
    - events_Spain.json
  known_scope_excluded:
    matches:
      - matches_European_Championship.json
      - matches_World_Cup.json
    events:
      - events_European_Championship.json
      - events_World_Cup.json
  excluded_member_handling: verify_directory_entry_but_do_not_extract_or_admit_payload
  reject_unknown_members: true
  reject_links: true
  reject_absolute_or_parent_paths: true

temporal_semantics:
  match_observed_at: matches.dateutc
  event_observed_at: match_start_plus_match_period_and_event_sec
  source_available_at: "2020-01-28T14:24:27Z"
  source_available_at_basis: frozen_collection_release_time
  generated_at_is_evidence: false
  historical_replay_before_collection_release: forbidden
  correction_policy: frozen_v5_no_record_level_correction_channel
  late_data_policy: no_inference_before_collection_release
  research_only_when_availability_missing: true

acquisition:
  method: unauthenticated_https_file_download
  credentials_required: false
  account_required: false
  redirect_authority:
    status_code: 302
    maximum_hops: 1
    destination_scheme: https
    destination_host: s3-eu-west-1.amazonaws.com
    destination_path_template: pfigshare-u-files/{file_id}/{name}
    exact_query_keys:
      - X-Amz-Algorithm
      - X-Amz-Credential
      - X-Amz-Date
      - X-Amz-Expires
      - X-Amz-SignedHeaders
      - X-Amz-Signature
    algorithm: AWS4-HMAC-SHA256
    credential_scope_suffix: eu-west-1/s3/aws4_request
    credential_separator_encoding: literal_slash
    signed_headers: host
    maximum_expiry_seconds: 60
  destination_root: data/source/wyscout/v5
  working_root: data/working/wyscout/v5
  tracked_payloads: false
  verify_before_admission:
    - exact_url_allowlist
    - exact_file_name
    - exact_size_bytes
    - expected_md5
    - computed_sha256
    - safe_archive_members
  immutable_manifest: true
  retries_bounded: true
  resume_supported: true
