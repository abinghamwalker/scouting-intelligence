schema_version: 1
task_id: W03-VERTICAL-01
phase_id: W03
revision: R5
state: DISPATCHED
supersedes: orchestration/task_packets/W03-VERTICAL-01-R4.yaml
objective: >-
  Correct the master-imposed explanation-template constraint without changing
  any retrieval, eligibility, profile provenance or result behavior.
depends_on:
  - REVIEW-W03-VERTICAL-01-R4:REWORK
assigned_role: vertical_journey_implementer
risk: high
read_first:
  - AGENTS.md
  - orchestration/task_packets/W03-VERTICAL-01-R5.yaml
  - orchestration/reviews/REVIEW-W03-VERTICAL-01-R4.yaml
  - src/scouting/serving/synthetic.py
  - tests/e2e/test_w03_vertical_journey.py
allowed_paths:
  - src/scouting/serving/synthetic.py
  - tests/e2e/test_w03_vertical_journey.py
  - reports/reviews/W03/returns/W03-VERTICAL-01-R5.md
forbidden_paths:
  - .git/**
  - pyproject.toml
  - uv.lock
  - orchestration/**
  - scripts/**
  - reports/verification/W03/**
  - src/scouting/contracts/**
  - tests/fixtures/synthetic/protected/**
  - tests/fixtures/synthetic/protected/expected_retrieval.json
  - tests/fixtures/synthetic/expected_retrieval.json
deliverables:
  - Static and single-candidate-placeholder explanation support.
  - Focused validation/rendering regressions.
  - Complete R5 mandatory return.
definition_of_done:
  - A bounded non-empty static explanation with no format field is accepted and renders unchanged.
  - Exactly one plain candidate_display_name field is accepted and safely populated.
  - Unknown/multiple fields, traversal, conversion, format specifications and malformed braces reject.
  - Development oracle, alternate profile, selection, result, lineage and unavailable behavior remain unchanged.
  - No protected fixture or expected output is accessed.
acceptance_checks:
  - uv run pytest -q tests/e2e/test_w03_vertical_journey.py
  - uv run ruff format --check src/scouting/serving tests/e2e/test_w03_vertical_journey.py
  - uv run ruff check src/scouting/serving tests/e2e/test_w03_vertical_journey.py
  - uv run mypy src/scouting/serving
  - uv run bandit -q -r src/scouting/serving
  - "! rg -n \"expected_retrieval\\\\.json\" src/scouting/serving"
stop_conditions:
  - A protected fixture or protected expected output has been accessed.
  - Any path outside allowed_paths must change.
  - A Git, Docker, dependency, external service, public bind or destructive action appears necessary.
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
