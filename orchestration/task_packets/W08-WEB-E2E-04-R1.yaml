schema_version: 1
task_id: W08-WEB-E2E-04
phase_id: W08
revision: R1
state: DISPATCHED
objective: >-
  Compose the accepted W08 services into a secure loopback-only, accessible local
  workflow and automate every browser-testable core, denial, conflict and recovery journey.
depends_on:
  - W08-WORKFLOW-02:MASTER_ACCEPTED
  - W08-EXPORT-03:MASTER_ACCEPTED
assigned_role: routine_producer_gpt-5.6-terra_medium
risk: high
read_first:
  - AGENTS.md
  - ../scouting-ml-production-blueprint.html
  - ../scouting-ml-agent-implementation-workflow.html
  - docs/architecture/workflow-state-machines.md
  - docs/architecture/threat-model.md
  - docs/architecture/product-claim.md
