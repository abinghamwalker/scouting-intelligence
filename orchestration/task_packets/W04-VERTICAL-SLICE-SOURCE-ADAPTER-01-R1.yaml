fixed_bindings:
  source_manifest_id: 4e16bdb5-afe7-5601-88ad-adc124cfce3b
  source_manifest_sha256: 8fb6eb54ccca7656d66f53affb79e38abfef88d449d6903593ede4bf34fd89bd
  index_sha256: 46a22423d5a32122429e7bf15d79dc892fa8177b19d9672b61303bc6e1df87df
  member_path: archive-members/events_England.json
  member_sha256: 301599543aa1a7fa457bb8ef33c9fe860bf81dca65d418d618d68abcda3defad
  member_size_bytes: 188888614
  member_row_count: 643150
  match_source_id: 2499719
