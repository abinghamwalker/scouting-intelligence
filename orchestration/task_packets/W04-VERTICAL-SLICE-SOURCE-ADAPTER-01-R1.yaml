requirements:
  - >-
    Expose an immutable result type and public loader with explicit source root,
    manifest root, accepted index digest, admitted member path and strict positive
    match source ID. Do not expose or return any result before all verification passes.
  - >-
    Resolve only one exact admitted EventMemberSpec; verify source-manifest bytes;
    load and validate the content-addressed index; nofollow-read the entire member;
    require exact stable size, digest and decoded row count; enumerate before match
    filtering so physical ordinals cannot shift.
  - >-
    Strictly project the selected rows with completion_action_evidence, canonical-sort
    them, validate exact full-match equality against every indexed period, and bind
    each returned raw record to exactly its projected evidence/raw digest. Return no
    Boolean/count/digest-only completeness witness.
  - >-
    Fail closed for wrong index/member/path/match, non-strict IDs, missing match,
    truncated/additional member rows, malformed raw rows, reordered/omitted/duplicate
    selected actions and any source mutation. Do not import tests or product modules.
  - >-
    Preserve all R20/R21 bytes, accepted index bytes, R4 checked APIs and behavior,
    strict integer-only subevents, equal-clock ordering and local-only boundary.
definition_of_done:
  - Public product code can consume verified raw/evidence pairs without importing private source functions.
  - Exact real match 2499719 returns 1768 pairs and still validates 901 plus 867 periods.
  - Existing R4 suite and new focused adversarial adapter tests pass.
acceptance_checks:
  - uv run ruff format --check src/scouting/sources/wyscout_completion_index.py tests/unit/test_wyscout_source_completion_index.py
  - uv run ruff check src/scouting/sources/wyscout_completion_index.py tests/unit/test_wyscout_source_completion_index.py
  - uv run mypy src/scouting/sources/wyscout_completion_index.py tests/unit/test_wyscout_source_completion_index.py
  - uv run lint-imports
  - uv run pytest -q tests/unit/test_wyscout_source_completion_index.py tests/contracts/test_wyscout_data_contracts.py
  - uv run bandit -q -r src/scouting/sources/wyscout_completion_index.py
  - uv run python scripts/verify_local_only.py
master_only_checks:
  - shasum -a 256 data/manifests/wyscout/v5/source-completion/46a22423d5a32122429e7bf15d79dc892fa8177b19d9672b61303bc6e1df87df.source-completion-index.json reports/reviews/W04/wyscout-schema-design-R20.md reports/reviews/W04/wyscout-schema-design-R21.md
  - git diff --check
  - git remote
stop_conditions:
  - The adapter requires a contract/preimage/index change, dependency, provider access, architecture revision or product byte.
  - Safe post-EOF verification cannot be exposed without leaking private authority or broadening source scope.
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
self_approval: forbidden
