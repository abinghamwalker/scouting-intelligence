objective: >-
  Add one narrow public source-owned adapter that returns the exact verified raw
  records and completion evidence for one accepted match only after whole-member
  source verification, exact member row-count reconciliation and full indexed
  match-population equality. This packet creates no Bronze, Silver, Gold, manifest,
