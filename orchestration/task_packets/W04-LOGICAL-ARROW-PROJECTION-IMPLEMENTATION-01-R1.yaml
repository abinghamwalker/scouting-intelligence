implementation_requirements:
  - Verify every fixed hash before editing and stop on drift.
  - >-
    Implement the design report's exact frozen slot dataclasses/enums for scalar,
    struct, list, field and projection descriptor content. Validate exact runtime
    types recursively before schema construction. Descriptor content contains no
    callback, Arrow schema, row, fixture, digest, Boolean proof or alternate
    authority object.
  - >-
    Provide `arrow_schema_from_w04_projection` and make both encoder and semantic
    hash descriptor-led. Remove caller `schema` and `schema_role` authority from
    those public APIs. Derive the physical schema and existing
    WyscoutParquetSchemaDescriptor only from the exact projection descriptor.
  - >-
    Generate no schema from a table, row, fixture, observed value or empty
    sequence. The supplied Arrow table is only a readback witness and its complete
    recursive schema and metadata must exactly equal the generated schema.
  - >-
    Implement exact recursive identity, object-struct, positional-tuple-struct and
    homogeneous-list projection. Positional structs restore logical arrays by
    exact zero-based contiguous logical position; child names never become tuple
    logical keys. List child schema and fixed cardinality are descriptor-owned.
  - >-
    Encode a present CanonicalJsonValue as exact canonical tagged logical JSON in
    strict Arrow UTF-8 without LF. Validate the exact discriminated union before
    encoding. Present tagged null must remain a non-null UTF-8 scalar.
  - >-
    Decode in the accepted exact order: strict UTF-8 bytes, duplicate-key and
    invalid-constant/float-token rejection, Unicode scalar/NFC checks, exact typed
    validation, canonical re-encoding without LF, and byte-for-byte equality.
    Any failure is FormatError before semantic hashing or Parquet writing.
  - >-
    Preserve outer optionality exactly: only a descriptor-nullable outer field or
    child accepts Arrow null; a present canonical JSON null can never be encoded
    as Arrow null.
  - >-
    Validate descriptor, generated schema, table/schema equality, contract rows,
    parents, keys, recursive inverse, contract-row equality and primary-key
    equality before semantic hashing and before exactly one Parquet write. Every
    malformed family must cause zero calls to `pq.write_table`.
  - >-
    Preserve WyscoutParquetSchemaDescriptor bytes and the sole exact
    `w04-wyscout-parquet-semantic-v1` framing. Do not insert projection bytes,
    projection kind, a projection digest, a field, version, formula or second
    derivation into the semantic preimage.
  - >-
    Preserve the accepted identity fixture physical SHA-256
    889b525bcda3e11ff710112fd4095089935d8274c375cf3d6bed9636c8b63d2b
    and semantic SHA-256
    6ac5879732257cb40bfd6480c7605ddddd1df430e44fc41cc642d3874c0205e7.
  - >-
    Adapt the build-contract call site and tests only mechanically for the new
    descriptor-led API. Do not synthesize GOLD_PLAYER_WINDOW authority from its
    row, fixture, Arrow schema or equivalent object. The runtime build remains
    fail-closed with GoldSchemaAuthorityUnavailableError until the later exact
    root descriptor is independently accepted.
  - >-
    Add the design report's complete focused adversarial matrix, including all
    seven tagged variants, nested mixed values, present-null/outer-null
    distinction, strict malformed encodings, tuple/list descriptor and schema
    drift, empty/nonempty sequence schema identity, fixed sizes, recursive
    metadata, API-unrepresentable caller authority substitutes, and zero-write
    tripwires.
  - >-
    Do not create an accepted root descriptor, root schema, schema bundle, product
    byte, manifest, receipt, build, aggregate, feature, population, dependency,
    provider access, publication, deployment or external state.
definition_of_done:
