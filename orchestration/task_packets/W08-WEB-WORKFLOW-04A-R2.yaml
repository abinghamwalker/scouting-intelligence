schema_version: 1
task_id: W08-WEB-WORKFLOW-04A
phase_id: W08
revision: R2
state: DISPATCHED
objective: >-
  Complete the shortlist/observation presentation and missing web-security witnesses
  without changing the accepted workflow services.
depends_on:
  - W08-WEB-WORKFLOW-04A:R1_MASTER_REPRODUCED
assigned_role: routine_producer_gpt-5.6-terra_medium
risk: high
invariant: >-
  A rendered history must expose every decision/reason/confidence/provenance field needed
  to interpret and reverse the workflow, while controls and private content are shown
  only to principals who may use or read them.
read_first:
  - AGENTS.md
  - orchestration/task_packets/W08-WEB-WORKFLOW-04A-R1.yaml
  - reports/reviews/W08/returns/W08-WEB-WORKFLOW-04A-R1.md
  - reports/verification/W08/moderated-study-protocol.md
  - configs/policies/w08-authorization.yaml
  - src/scouting/contracts/workflow.py
  - src/scouting/policy/r1.py
  - src/scouting/workflow/r1.py
  - src/scouting/observations/r1.py
  - src/scouting/web/w08.py
  - apps/web/templates/w08/shortlist.html
  - apps/web/templates/w08/entry.html
  - tests/integration/test_w08_local_workflow_app.py
  - tests/security/test_w08_web_security.py
allowed_paths:
  - src/scouting/web/w08.py
  - apps/web/templates/w08/shortlist.html
  - apps/web/templates/w08/entry.html
  - apps/web/static/w08/app.css
  - tests/integration/test_w08_local_workflow_app.py
  - tests/security/test_w08_web_security.py
  - reports/reviews/W08/returns/W08-WEB-WORKFLOW-04A-R2.md
forbidden_paths:
  - .git/**
  - pyproject.toml
  - uv.lock
  - configs/**
  - migrations/**
  - orchestration/**
  - src/scouting/contracts/**
  - src/scouting/policy/**
  - src/scouting/audit/**
  - src/scouting/workflow/**
  - src/scouting/observations/**
  - src/scouting/operations/**
  - services/**
  - scripts/**
  - tests/e2e/**
  - tests/fixtures/synthetic/protected/**
  - reports/evaluation/W06/**
deliverables:
  - Entry revision history displays state, transition reason, controlled rejection/hold reason and note, assignment, next action/owner, actor and timestamp for every immutable revision.
  - Observation history displays every version's author, dimensions/ratings/notes, per-dimension and overall confidence, local evidence references, summary, disagreement/reason, recommended next action, visibility, origin and timestamp.
  - Comment history displays author, body, visibility, origin and timestamp after policy filtering.
  - Mutation controls expose only service-permitted target transitions for the current state and role; no analyst approve/hold or illegal transition option, no other-author/stale observation amendment control.
  - Dense journey appends hold with controlled reason/next owner, rejection with controlled reason, then rejected-to-longlist reconsideration on the same entry; rendered history proves every prior value remains.
  - Web-security witnesses create a second same-tenant scout and prove unassigned/other-role/foreign-object denial, TEAM visibility as granted, OWNER_ONLY hiding from approver/other scout, own/latest amendment only, and generic 404 with no object text.
  - Test explicit local evidence-reference rejection for empty, absolute, traversal and URL inputs with no observation/audit partial row.
definition_of_done:
  - Moderated tasks T3/T4 can be interpreted and reversed from the rendered page, and the missing visibility/reconsideration witnesses pass.
  - No route, policy, workflow, observation, contract, migration or dependency boundary is widened.
focused_checks:
  - Full hold/reject/reconsider history and state-specific role controls.
  - TEAM/OWNER_ONLY observation and comment visibility across owner, approver, assigned scout and second unassigned scout.
  - Latest-author amendment control and local-reference input rejection/atomicity.
acceptance_checks:
  - uv run ruff format --check src/scouting/web/w08.py tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py
  - uv run ruff check src/scouting/web/w08.py tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py
  - uv run mypy src/scouting/web/w08.py
  - uv run pytest -q tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py tests/integration/test_w08_workflow.py tests/security/test_w08_workflow_access.py
stop_conditions:
  - A required witness needs a shared service/contract/policy/migration/dependency change.
  - A network/external service, model call, Node/npm, container, protected-output access, destructive action or Git operation is required.
  - Passing would require exposing private content/controls or inventing user/model evidence.
mandatory_return:
  - task ID/revision and exact invariant
  - exact changed-file list
  - rendered history/control and visibility rules
  - exact commands, exit statuses and test counts
  - reconsideration, privacy, local-reference and rollback results
  - residual risks/follow-ups
  - confirmations of no Git, dependency/lock, protected-output or out-of-scope edits
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
