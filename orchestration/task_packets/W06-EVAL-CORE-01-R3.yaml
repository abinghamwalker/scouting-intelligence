deliverables:
  - One simplified relational contract implementation closing the exact P0 and four P1 survivors.
  - Corrected protocol-bound metric/comparison/pair/agreement/bootstrap core.
  - Focused regression matrix with at least one rejecting/exact-value test per retained R2 counterexample and executable fixture digest/path coverage.
  - Complete mandatory return at reports/reviews/W06/returns/W06-EVAL-CORE-01-R3.md.
definition_of_done:
  - The exact R2 P0 constructor chain cannot construct ACCEPT_CLAIM at any step.
  - Every R2 P1 counterexample rejects or returns the exact corrected bounded result.
  - No caller boolean or unrelated digest can assert protected use/consumption/claim eligibility.
  - Public fixture is implementation-only, content-addressed and executed through the metric path.
  - Focused tests cover all five material defect families, not only happy paths.
  - Static/import checks pass without dependency or accepted-baseline changes.
  - No protected execution/result, external evidence, threshold tuning or W07 work occurs.
acceptance_checks:
  - uv run pytest -q tests/contracts/test_w06_evaluation_contracts.py tests/unit/test_w06_evaluation_metrics.py
  - uv run ruff check src/scouting/contracts/evaluation.py src/scouting/evaluation tests/contracts/test_w06_evaluation_contracts.py tests/unit/test_w06_evaluation_metrics.py
  - uv run mypy src/scouting/contracts/evaluation.py src/scouting/evaluation
  - uv run lint-imports
stop_conditions:
  - Correction requires a new dependency, protected expected-output access, external/provider access or a credential.
  - Correction requires inventing expert evidence, a protected population/result, threshold or positive claim.
  - Correction requires an edit outside allowed_paths or accepted W03/W04/W05 bytes.
  - Unexpected user-owned work overlaps an allowed path.
  - A secret, restricted datum or destructive action is encountered.
mandatory_return_requirements:
  - task ID and one-sentence objective
  - exact changed-file list
  - exact correction mapped to all five R2 open rows
  - exact commands, exit statuses and concise results
  - exact fixture, protocol, bundle, result, interval, run and gate digest identities from public tests only
  - residual leakage, schema, interval, applicability and claim risks
  - concrete follow-ups or none
  - confirmation of no Git operations, dependency changes, protected expected-output access or edits outside allowed_paths
return_template: orchestration/templates/subagent_return.md
