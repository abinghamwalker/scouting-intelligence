defects:
  - severity: P0
    evidence: reports/reviews/W06/evaluation-core-independent-review-R2.md#P0--W06-EC-R1-01-remains-open-protected-access-run-protocol-and-gate-identity-are-not-relationally-bound
    affected_definition_of_done: Protected claim construction is relationally fail-closed.
    required_fix: >-
      Replace opaque claim assembly with actual nested validated relations. Access must
      bind protocol_digest, bundle_digest, exact candidate_manifest_digest, partition,
      one_use=true and consumed_by_run_id. EvaluationRun must embed the actual protocol
      and access record, carry the same bundle/candidate identities and partition, and
      require a canonical non-empty result roster (an explicit unavailable result is
      allowed for a negative run). GateDecision must embed the actual run and bundle for
      ACCEPT_CLAIM/NARROW_APPLICABILITY, require identical identities and PROTECTED_TEST,
      and for ACCEPT_CLAIM require governed-human eligible evidence plus every primary
      result/interval computed. NO_GO may retain no run for a missing population. Bundle
      must reject query.feature_cutoff_ts later than protocol.decision_cutoff_ts.
  - severity: P1
    evidence: reports/reviews/W06/evaluation-core-independent-review-R2.md#P1--W06-EC-R1-02-remains-open-aggregate-row-identity-and-canonical-content-are-incomplete
    affected_definition_of_done: Evidence aggregate has one canonical semantic identity.
    required_fix: >-
      Recompute candidate_universe_digest from canonical candidate_ids. Introduce or
      embed a strict rubric authority and bind protocol.rubric_digest. Add reviewer
      authority class. Require canonical order and uniqueness by both ID and semantic
      key for relevance, unordered pair preference, hard negative and adjudication.
      Every preference/evidence must bind rostered reviewer/rubric; adjudication must
      reference an actual same-query/same-candidate/same-rubric disagreement and a
      rostered governed adjudicator. Bundle digest must be invariant to rejected reorder
      because only canonical order is admitted.
  - severity: P1
    evidence: reports/reviews/W06/evaluation-core-independent-review-R2.md#P1--W06-EC-R1-03-remains-open-partial-label-arithmetic-and-ranking-order-are-not-safe
    affected_definition_of_done: Metric inputs and partial/missing/tie policies are exact.
    required_fix: >-
      Reject non-finite/negative-zero RankedItem scores in __post_init__. Use partial gain
      in Precision/Recall numerator only when partial_counts_for_precision_recall=true;
      otherwise partial is zero for P/R while retaining declared NDCG gain. Return
      explicit unavailable on zero eligible denominator. Replace inert missingness enum
      with one exact executable policy or mechanically distinguish every retained value.
      Freeze canonical score-desc/candidate-ID tie policy in protocol and enforce it.
  - severity: P1
    evidence: reports/reviews/W06/evaluation-core-independent-review-R2.md#P1--W06-EC-R1-04-remains-open-low-intersection-comparison-and-relational-pairagreement-identity-are-incomplete
    affected_definition_of_done: Set/correlation/pair/agreement outputs are valid and traceable.
    required_fix: >-
      Compute overlap count/rate, Jaccard, bounded churn and disagreements before any
      Spearman insufficiency return; only rho becomes unavailable for fewer than two
      shared candidates. Pair metric must consume canonical unique pair IDs/candidates,
      predicted member, governed preference/reviewer identity and abstention. Agreement
      must consume canonical unique query/candidate/reviewer-labelled rows and implement
      a protocol-declared method (exact percent agreement is acceptable if named), with
      explicit exclusions/insufficiency and result identity.
  - severity: P1
    evidence: reports/reviews/W06/evaluation-core-independent-review-R2.md#P1--W06-EC-R1-05-remains-open-result-interval-run-and-bootstrap-contracts-do-not-enforce-arithmetic-or-protocol-links
    affected_definition_of_done: Persisted metric/interval/run values prove their formula and protocol.
    required_fix: >-
      Make MetricResult.metric a MetricName and use finite numeric sufficient statistics
      supporting fractional gains. Enforce protocol metric/k membership at run validation,
      exact value=numerator/denominator and metric range (unit metrics [0,1], correlation
      [-1,1]). BootstrapInterval must carry point_value, resample_digest and typed method,
      require protocol seed/count/confidence/method, lower<=point<=upper, and no bounds for
      unavailable status. Run must link every interval to a present result, enforce
      canonical unique ordering and reject unsupported resampling_unit/metric capability.
      Gate must verify required primary roster/intervals from its nested run.
