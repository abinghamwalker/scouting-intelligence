implementation_requirements:
  - Verify every fixed hash before editing and stop on drift.
  - >-
    Export exactly 23 canonical content objects and exactly 23 six-key rows in the
    frozen order. Keep the earlier-only dependency graph exactly as listed by the
    readiness audit, converting role references to the corresponding exact
    canonical schema IDs in each row.
  - >-
    Each definitions closure must be deterministic, structured and complete for
    the owning runtime model and its transitive support types: exact serialized
    field order; required presence including defaulted fields; additional-field
    prohibition; JSON types; literals/enums; unions; nullability; integer and
    decimal bounds; UTC timestamp and NFC/digest/path grammars; homogeneous list
    and heterogeneous fixed-tuple cardinality/order; and named support objects.
    It must not use Python symbol names, source hashes, serializer hashes or prose
    alone as substitutes for contract constraints.
  - >-
    Represent every applicable model/field/whole-object validator as a stable
    declarative predicate object with exact operation, operands and constants.
    Cover the readiness audit predicate roster, including exact one-lineup-row
    semantics, rejected-field traversal, action/possession/player-match population
    completeness, lineage/manifest/receipt equality, identifiers, clocks, cutoff,
    censoring, per-90 suppression, ordering, uniqueness and aggregate
    reconciliation. Do not invent product semantics or a new logical field.
  - >-
    For each of roots 1-12, include a complete WyscoutParquetProjectionDescriptor
    equivalent descriptor in parquet_projection and export the runtime descriptor
    and Arrow schema only from that accepted content. Reuse exactly the accepted
    scalar/list/positional-struct/CanonicalJsonValue rules. Never infer from a row,
    fixture, observed value or caller schema. Roots 13-23 carry the exact string
    NOT_APPLICABLE_JSON_ONLY.
  - >-
    The public exporter must validate its own exact roster, key order, dependency
    order, unique IDs, content canonicality, digest reproduction and descriptor
    closure. Mutation, caller schema/digest/callback, 24th root, omitted root,
    reorder, duplicate, forward edge, cycle, placeholder, metadata, width,
    nullability, projection-kind or unrecognized-type substitution fails closed.
  - >-
    Gold must obtain its concrete Arrow schema only from the GOLD_PLAYER_WINDOW
    content owned here. Do not edit or make the build receipt success path
    executable yet; aggregate acceptance and later composition remain downstream.
  - >-
    Preserve all existing bytes outside allowed paths. Do not materialize a v2
    aggregate or accepted bundle/product digest; do not create product/control/data
    bytes, provider access, dependencies, cloud, containers, CI, deployment or
    publication.
focused_acceptance:
  - Exact 23 role/order/row-key/content-key/ID/version/surface assertions.
  - Every transitive definition reference resolves and every dependency is unique and strictly earlier.
  - Every runtime serialized field appears exactly once in exact order for all 23 roots.
  - Every runtime cross-field validator is represented by structured declarative predicates.
  - Exact descriptor-generated Arrow schema for all twelve Parquet roots; metadata absent recursively.
  - Two materially different values for every variant-bearing root yield the same descriptor/schema.
  - CanonicalJsonValue and heterogeneous tuple/list nested round-trip tests use only the accepted projection path.
  - Width/nullability/metadata/position/fixture-inference/caller-authority mutations fail closed.
  - JSON-only roots reject null/omission/placeholder/projection descriptor substitution.
  - Gold alternative schema input and any second schema authority fail closed.
definition_of_done:
  - Exact in-memory 23-root content and row export exists with no downstream bytes.
  - Focused and frozen adjacent checks pass with zero warnings or unexpected writes.
acceptance_checks:
  - uv run ruff format --check src/scouting/contracts/wyscout_schema.py tests/contracts/test_w04_wyscout_schema_closure.py
  - uv run ruff check src/scouting/contracts/wyscout_schema.py tests/contracts/test_w04_wyscout_schema_closure.py
  - uv run mypy src/scouting/contracts/wyscout_schema.py tests/contracts/test_w04_wyscout_schema_closure.py
  - uv run pytest -q tests/contracts/test_w04_wyscout_schema_closure.py tests/contracts/test_w04_wyscout_build_contract.py tests/contracts/test_wyscout_data_contracts.py tests/unit/test_w04_wyscout_product_formats.py
