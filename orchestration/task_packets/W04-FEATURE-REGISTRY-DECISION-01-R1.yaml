requirements:
  - >-
    Materialize a canonical eight-key decision with authority_class exactly
    SUPPORTED_FEATURE, the exact ten bound inputs, truthful fresh decided_at
    strictly after both accepted-v2 clocks, the fixed UUIDv5 actor, fixed IDs
    and schema, exact policies, and the fifteen exact R21 Section 9.3 rows.
  - >-
    Materialize a strict deterministic YAML candidate with exactly seven
    top-level keys: bound_inputs, decision_id, decision_sha256, features,
    policies, registry_id, registry_schema_version. It must exactly restate the
    decision and bind the decision physical digest.
  - >-
    Every feature row has exactly aggregation, applicability, denominator,
    feature_name, input_fields, output_type, reason, state. Preserve exact R21
    strings, order, types, and input-field order. No sixteenth row is allowed.
  - >-
    Exactly the four packet-listed features are SUPPORTED. All others are
    exactly R21's SUPPRESSED_UNSUPPORTED_DENOMINATOR or UNAVAILABLE states with
    empty inputs, NONE/NEVER, and null output as specified.
  - >-
    `resolved_possession_action_count` has only the three listed canonical
    selector fields as input_fields and additionally requires accepted
    possession_eligibility_state == ELIGIBLE_RESOLVED through applicability;
    do not add that state as a fourth input field.
  - >-
    The focused test must independently enforce canonical JSON/YAML, exact
    keysets/roster/policies/bindings, accepted field/possession/preimage
    digests, strict state unions, forbidden input/feature support, review and
    acceptance schemas/digests/UUIDv5/clocks, progression blocking, no
    feature_schema_hash before acceptance, and absence of every cross-authority
    or product path.
  - >-
    Add negative cases for missing/duplicate/sixteenth features, unknown row
    fields, wrong sort, wrong state/type/aggregation/denominator/applicability,
    unsupported rows with inputs/output, supported rows with empty/unaccepted
    inputs, v1 or physical-digest substitution, preimage swap, name-only or
    possession-internal inputs, and any fifth supported feature.
  - >-
    Before Python take a fresh shell-only pyc/__pycache__ inventory. Use only
    root uv with --locked --no-sync, bytecode disabled, helper Python with -B,
    and reproduce the exact inventory after the return. Do not sync, install,
    clean, or repair.
  - >-
    Use apply_patch only for the four exact absolute allowed paths. Do not run
    Git, delegate, self-approve, edit any predecessor/preimage, create review
    or acceptance, access provider/network data, or begin cross-authority,
    identity, Bronze, Silver, Gold, build, model, product, cloud, container,
    endpoint, hosted CI, or deployment work.
