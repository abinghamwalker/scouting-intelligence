schema_version: 1
task_id: W06-EVAL-ROBUSTNESS-REVIEW-04
phase_id: W06
revision: R4
state: DISPATCHED
supersedes: orchestration/task_packets/W06-EVAL-ROBUSTNESS-REVIEW-04-R3.yaml
objective: >-
  Independently review the surgical R4 robustness implementation and adjudicate only
  defects capable of changing persisted stress/control values, populations,
  applicability or the later protected gate.
depends_on:
  - W06-EVAL-ROBUSTNESS-04-R4:IMPLEMENTED
assigned_role: independent_verifier
risk: high
read_first:
  - AGENTS.md
  - orchestration/task_packets/W06-EVAL-ROBUSTNESS-04-R4.yaml
  - orchestration/reviews/REVIEW-W06-EVAL-ROBUSTNESS-04-R4.yaml
  - reports/reviews/W06/evaluation-robustness-independent-review-R3.md
  - reports/reviews/W06/returns/W06-EVAL-ROBUSTNESS-04-R4.md
  - src/scouting/contracts/evaluation.py
  - src/scouting/contracts/__init__.py
  - src/scouting/evaluation/core.py
  - src/scouting/evaluation/robustness.py
  - src/scouting/evaluation/__init__.py
  - tests/contracts/test_w06_evaluation_contracts.py
  - tests/unit/test_w06_evaluation_metrics.py
  - tests/contracts/test_w06_robustness_contracts.py
  - tests/unit/test_w06_robustness.py
  - tests/fixtures/w06/public-evaluation-v1.json
  - tests/fixtures/w06/public-robustness-v1.json
  - orchestration/templates/subagent_return.md
allowed_paths:
  - reports/reviews/W06/evaluation-robustness-independent-review-R4.md
  - reports/reviews/W06/returns/W06-EVAL-ROBUSTNESS-REVIEW-04-R4.md
forbidden_paths:
  - tests/fixtures/synthetic/protected/**
  - reports/verification/W03/protected-gate-attempt-*.json
  - .git/**
  - .venv/**
  - pyproject.toml
  - uv.lock
  - orchestration/**
  - configs/**
  - data/**
  - runs/**
  - docs/**
  - src/**
  - tests/**
  - reports/readiness/**
  - reports/phase-gates/**
  - reports/verification/**
master_counterexamples:
  - >-
    R3 stress witness 013da049ef32c63d7bf5d40e825b7d377000cca70fe8b6c86fb2becb05797598
    and control witness 75b2bc182bbd1e72816de51ce7516e1cf1ee2475328aa49cbabca80485699e1b
    must reject under normal construction.
  - >-
    R4 metadata control comparison witness
    fa8bea37b980b8761427695e18840789f6ea4da26f63fc73d581d42e8776a8fb
    changes only the comparison Spearman value, retains the exact row-derived input
    digests, is re-signed, and currently accepts. Reproduce and classify whether it can
    change retained robustness/null evidence.
review_questions:
  - Do stress rows, metric input identities and comparison endpoints derive from exact named observations/cohorts?
  - Do control authority, exact rows, null rows and metric children derive from one persisted input?
  - Are rank-comparison values themselves exactly reproducible from persisted rows, or can the master witness substitute them?
  - Does the fixture drive computed, unsupported, pair-absence and literal identity paths?
  - Do typed incoherent/common-candidate deficits return exact unsupported evidence?
  - Are applicability and failure retention evidence-honest without fabricated human evidence?
deliverables:
  - One report-only ACCEPT or REWORK verdict with exact P0/P1 counts and witness outcomes.
  - Mandatory return at reports/reviews/W06/returns/W06-EVAL-ROBUSTNESS-REVIEW-04-R4.md.
definition_of_done:
  - Every R3/R4 material witness is independently reproduced and classified.
  - Additional findings are limited to values, populations, leakage, applicability or protected-decision effects.
  - Review remains public-only and does not access protected expected outputs.
acceptance_checks:
  - uv run --no-sync pytest -p no:cacheprovider -q tests/contracts/test_w06_evaluation_contracts.py tests/unit/test_w06_evaluation_metrics.py tests/contracts/test_w06_robustness_contracts.py tests/unit/test_w06_robustness.py
  - uv run --no-sync ruff check src/scouting/contracts/evaluation.py src/scouting/contracts/__init__.py src/scouting/evaluation tests/contracts/test_w06_evaluation_contracts.py tests/unit/test_w06_evaluation_metrics.py tests/contracts/test_w06_robustness_contracts.py tests/unit/test_w06_robustness.py
  - uv run --no-sync mypy src/scouting/contracts/evaluation.py src/scouting/evaluation
  - uv run --no-sync lint-imports
  - shasum -a 256 tests/fixtures/w06/public-robustness-v1.json
stop_conditions:
  - A required check needs protected expected-output, external/provider, credential or new-dependency access.
  - A required write falls outside allowed_paths or overlaps unexpected user work.
  - A secret, restricted datum or destructive action is encountered.
mandatory_return_requirements:
  - task ID and exact changed-file list
  - final verdict and exact severity counts
  - exact master-witness outcomes and narrow constructor/fixture matrix
  - exact commands, statuses and results
  - remaining P0/P1 risks and smallest correction or none
  - no Git/dependency/protected/external/out-of-scope confirmation
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
self_approval: forbidden
