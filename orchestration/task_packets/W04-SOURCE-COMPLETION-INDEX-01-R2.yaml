requirements:
  - >-
    `validate_index` must reject every otherwise internally valid index whose computed
    and stored SHA-256 is not exactly the accepted index SHA-256.
  - >-
    `load_source_completion_index` must reject a requested digest other than the
    accepted digest before opening any file, then still recompute the loaded payload
    digest and canonical structure.
  - >-
    Materialization and all population validators/factories must inherit the exact pin;
    no caller-selected lookalike content address may become authority.
  - >-
    Add a named regression that mutates a period membership digest, recomputes a
    self-consistent canonical index and address, and proves rejection because the
    address is not accepted. Also prove an unaccepted load argument fails before open.
  - >-
    Preserve the exact accepted index artifact, Wyscout contracts and contract tests,
    every frozen authority/source/preimage byte, dependency/lock state, four-feature
    scope, local-only boundary and all R1 closures.
definition_of_done:
