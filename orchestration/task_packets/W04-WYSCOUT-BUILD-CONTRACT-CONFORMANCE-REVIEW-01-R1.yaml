review_requirements:
  - Verify every fixed hash before analysis and stop on drift.
  - >-
    Reproduce the two R1 nonconformances against R3: invalid locally shaped
    manifests and claim-only product/proof digests must both be rejected.
  - >-
    Confirm that each supplied manifest is accepted from its exact canonical byte
    stream by LayerManifest and that the typed readback equals the supplied bytes.
  - >-
    Confirm GoldProductReadback derives the physical bytes, row count, size,
    semantic digest and temporal-proof digest from typed content.
  - >-
    Run a deterministic schema-substitution matrix that keeps the exact authorized
    Gold row but varies one supported Arrow schema property at a time, including
    nullability. Re-encode the supplied table using the accepted encoder and update
    all dependent digests consistently. Record whether receipt closure accepts a
    schema identity other than the exact authorized schema.
  - >-
    If more than one schema identity is accepted, return REWORK with the smallest
    correction boundary. State explicitly whether that correction can be expressed
    using existing authorized inputs or must wait for the already-planned canonical
    schema-bundle authority. Do not invent a schema digest or edit implementation.
  - >-
    Confirm the exact one-match, one-Gold-row, four-feature, season and lineup
    bindings remain unchanged, and confirm no product/data/run write or external
    action occurs.
definition_of_done:
  - PASS with P0/P1/P2 equal 0/0/0, or bounded REWORK with executable evidence.
acceptance_checks:
