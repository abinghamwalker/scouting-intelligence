schema_version: 1
task_id: W05-SERVING-01
phase_id: W05
revision: R1
state: DISPATCHED
objective: >-
  Implement one read-only deterministic M0 retrieval/explanation serving core used
  identically by batch and request entry points, with truthful evidence states,
  separate data confidence and stable result bytes.
depends_on:
  - REVIEW-W05-MODEL-01-R6:ACCEPT
  - W05-MODEL-REVIEW-01-R2:PASS
assigned_role: m0_serving_implementer
risk: high
read_first:
