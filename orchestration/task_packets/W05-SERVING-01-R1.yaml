  - tests/e2e/test_w05_m0_retrieval.py
  - reports/reviews/W05/returns/W05-SERVING-01-R1.md
forbidden_paths:
  - .git/**
  - .gitignore
  - .venv/**
  - pyproject.toml
  - uv.lock
  - AGENTS.md
  - orchestration/**
  - configs/**
  - data/**
