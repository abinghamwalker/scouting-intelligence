deliverables:
  - Accessible analyst form for a version-1 draft with named template, one or more responsibility codes, bounded hard constraints, transparent preference dimensions/weights and optional exemplar player IDs from the local synthetic-development catalogue.
  - Immutable version history displaying template/taxonomy, responsibilities, constraints, weights, exemplars, submission/decision attribution, controlled rejection reason/note and timestamps.
  - Analyst submit and rejected-to-draft correction/version routes plus approver approve/reject routes; every status-only transition preserves exact prior content and original submitted_at where the contract requires it.
  - Replace random retrieval request/result/run IDs and placeholder digests with the exact output of the accepted local W05 M0 serving core used by W07, constructed for the approved W08 brief/tenant and replayed without fitting, external/model calls, W06 protected-output access or protected W06 rerun.
  - Persist link model/index/data/taxonomy versions, exact result digest and dependency-lineage digest from that replay, and prove a repeat of the same pinned request returns the same IDs and digests.
  - Display replay identity and the full NO_GO/MISSING_EXPERT_RELEVANCE_EVIDENCE, resemblance_only, synthetic_development_only, LIMITED and no_recommendation_evidence boundary without validated/recommended/transfer/value/production claims.
  - Generic denial for unknown/foreign brief, invalid role, invalid constraint/exemplar, stale status version and failed serving replay; no partial link or audit row on failure.
definition_of_done:
  - Moderated tasks T1 and T2 plus the brief-to-retrieval portion of T3 are mechanically reachable with genuine deterministic local replay metadata.
  - Tests prove historical interpretation, controlled rejection/correction and exact replay rather than placeholder evidence.
focused_checks:
  - Full analyst/approver version chain with constraints, weights and exemplars retained byte-for-byte through submit/approve or reject/correct/resubmit.
  - Exact local serving replay identity and digest equality, plus no link/audit row after invalid/failed replay.
  - Role/tenant/object/CSRF/stale-write denial and evidence-honest rendered wording.
acceptance_checks:
  - uv run ruff format --check src/scouting/web/w08.py tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py
  - uv run ruff check src/scouting/web/w08.py tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py
  - uv run mypy src/scouting/web/w08.py
  - uv run pytest -q tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py tests/e2e/test_w05_m0_retrieval.py
stop_conditions:
  - Exact replay requires any protected W06 output, reconstructing protected outputs, fitting/training, a shared-service/contract/policy/migration/dependency change or a network/external/model provider.
  - Node/npm, container, destructive action, Git operation or out-of-scope mutation would be required.
  - Correctness would require inventing identifiers/digests or widening the W06/product claim boundary.
mandatory_return:
  - task ID and exact invariant
  - exact changed-file list
  - role-brief version/transition map and local-serving replay map
  - exact commands, exit statuses and test counts
  - exact replay identity/digest witness without protected outputs
  - residual risks/follow-ups
  - confirmations of no Git, dependency/lock, W06 protected-output or out-of-scope edits
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
