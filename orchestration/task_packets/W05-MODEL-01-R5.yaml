requirements:
  - >-
    Do not edit either fixture byte. Do not change any feature vector, metadata, role,
    dependency, query, label, candidate, k, seed, PCA count, weight, threshold, array
    payload or score. No tuning, selection retry, subset or control change is allowed.
  - >-
    Replace M0Configuration.values with explicit frozen typed fields for every config
    value, including tuple weights and immutable six-family digest map, plus one
    canonical_mapping method used only internally. load_m0_configuration requires
    exact canonical bytes, exact keys and strict non-boolean scalar/list/mapping/digest
    types; validates every frozen value and full accepted ID/version/digest. No public
    fit/load/check API accepts Mapping: each requires an M0Configuration instance and
    revalidates it against the accepted source-pinned identity.
  - >-
    Compute candidate_population_projection_digest over the exact full ordered
    candidate-universe candidate projection derived from the frozen fixture: UUID,
    family-appropriate feature values, metadata, context, exact role distribution,
    cutoff, full dependency identity and lineage hash. The selected config pins that
    full selected-family projection; metadata family derives and validates its exact
    family projection separately without weakening selected-population trust.
  - >-
    Add immutable typed M0DevelopmentCandidates and M0DevelopmentQueries authorities.
    Loaders require the frozen physical/logical digests, exact canonical bytes plus
    newline, exact root/row/nested keys/types/count/order and accepted registry/schema/
    taxonomy/claim/cross pins. Reproduce features, roles, dependency identities and
    query projection. fit/check APIs take these authorities, not loose rows, roles,
    labels or peer-group mappings.
  - >-
    Candidate-universe root keys and every candidate/nested object are exact. Validate
    all fixture/query/full-population pins, taxonomy, registry/family/schema, claim
    flags, candidate feature values, metadata, role probabilities, cutoff and complete
    dependency observed/available/lineage evidence against accepted config and
    authorities. A re-signed universe with unchanged arrays must fail.
  - >-
    Manifest loading recomputes the family-specific expected feature names/schema hash,
    exact fitting/candidate/full-population and lineage digests, canonical model/index
    IDs/versions and deterministic artifact UUID derived from accepted family, config,
    registry/schema, taxonomy, population, lineage and array payload. Re-signed field
    or manifest substitutions fail even with valid self digests.
  - >-
    Metadata family uses the exact accepted metadata-control schema hash and numeric
    encoded three-value feature/universe projection. Five six-feature families retain
    the synthetic schema. Runtime loader chooses the expected schema by family and all
    manifest/array/universe lengths agree.
  - >-
    PCA scoring returns exactly six original-feature contributions. Use a documented
    deterministic symmetric projection of the PCA-space cosine bilinear form through
    components so contributions sum to the negative similarity term and distance is
    1+sum(contributions), within exact deterministic floating behavior. Indexed and
    exemplar-mean modes use the same implementation.
  - >-
    _population admits exactly every ordered candidate from the typed authority and
    fails on any feature/role/materialization/numeric/duplicate/order/cutoff error; no
    continue/drop path remains. Preserve fitting/scaler population count/order/digest.
  - >-
    Before resolve, reject a root that is a symlink or whose absolute path differs from
    its resolved path; reject every unsafe entry. Validate ZIP members before np.load:
    exact names/order, no directories/encryption/extra/comment, stored compression,
    fixed timestamp and expected safe file attributes/size. Retain allow_pickle=false,
    exact dtype/shape/order/byte digests and read-only arrays.
  - >-
    Deep-freeze all nested loaded config/universe/membership state. Validate exclusions
    and exemplars as unique UUID tuples, reject query/exemplar overlap with explicit
    exclusions, and validate exact taxonomy role order/set with strict non-boolean
    finite [0,1] probabilities and exact sum. Indexed/exemplar scoring remains one path.
  - >-
    Replace the two smoke tests with a complete dedicated adversarial suite. It must
    directly prove typed authority rejection, frozen fixture reproduction, all six
    builds, expected schemas/populations/arrays/scores/ranking digests, two-build exact
    file bytes, reload distances/contributions/ties, PCA sign/tie/six contributions,
    zero-IQR/norm, exemplar permutation, role restriction, temporal cutoff, symlink/
    deep immutability, ZIP/object/dtype/shape/order/digest and fully re-signed config/
    taxonomy/schema/universe/manifest/model attacks. Tests use production APIs and the
    one runtime scorer, not a duplicate distance implementation.
  - >-
    Stage every R5 build in bounded temporary directories until config/source pins are
    frozen. The master will move the current unaccepted R4 selected directory aside.
    Then write the selected path once. R5 return lists exact fixture/config/all-family
    artifact/ranking identities, exact commands and both R1 negative and R3/R5 positive
    development-only evidence with every claim limitation.
deliverables:
  - Mandatory typed config/candidate/query authorities with no Mapping bypass.
  - Fully validated family-specific artifacts, metadata schema and PCA explanations.
  - Comprehensive adversarial model suite and byte-identical selected role-aware artifact.
  - Complete mandatory R5 return with exact evidence and development-only boundary.
definition_of_done:
  - Frozen fixture/array/score facts remain exact and all R4 P1 attacks fail closed.
  - Dedicated tests substantively exercise every family, parity, safety and substitution claim.
  - Focused quality/import/local-only gates pass with no predecessor or dependency change.
acceptance_checks:
