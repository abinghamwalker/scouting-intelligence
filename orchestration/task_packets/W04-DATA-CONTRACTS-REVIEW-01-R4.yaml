requirements:
  - >-
    Read every listed input fully, recompute every fixed digest, inspect the
    complete implementation/test candidate, and reproduce every packet check.
  - >-
    Reproduce all three R3 probes at both Fact and Gold boundaries: six-dimension
    2/2 forgery; out-of-bounds/mixed/three-position accepted-feature drift; and
    singleton contested possession promotion.
  - >-
    Independently challenge the claimed period completeness by removing one
    source action, lowering period_action_count to the remaining tuple, and
    attempting a consistent SilverAction, SilverPossession,
    SilverPlayerMatchFact, and GoldPlayerWindow chain while the lineage still
    contains the omitted physical action row. A literal complete flag and a
    caller-mirrored count are not source completeness evidence.
  - >-
    Challenge the frozen equal-clock cross-team rule with two CONTROL actions
    at the same period-relative clock but different teams. Verify
    UNCERTAIN_BOUNDARY_UNASSIGNED does not leave either simultaneous action
    resolved merely because source ordinal imposes a serialization order.
  - >-
    Challenge fact coverage population completeness, other-player sequence
    entries, possession source-row closure, predicate/action identity binding,
    period omission, and any route where internally derived coverage merely
    derives from a caller-selected subset.
  - >-
    Verify exactly four supported features remain and no serializer, product
    byte, manifest, receipt, runtime, build, dependency, architecture revision,
    provider access, or external service was created.
  - >-
    Write only the two allowed review artifacts, with exact byte identities,
    commands/results, all new P0-P2 findings, recommendation, and scope
    confirmation. PASS requires zero open P0-P2.
