  - test -s reports/verification/W06/limitations.md
  - test -s reports/reviews/W06/returns/W06-CARDS-06-R1.md
stop_conditions:
  - A source conflict can change the retained gate decision, protected-access truth, partition identity, metric meaning, interval meaning or claim boundary.
  - Work would require protected expected outputs, external/provider access, a new dependency, W05 mutation, orchestration mutation or any write outside allowed_paths.
mandatory_return_requirements:
  - exact files written
  - exact protected decision, sole reason and retained output identities
  - exact evidence/claim boundaries and unsupported populations recorded
  - acceptance-check results
  - remaining P0/P1 evidence risk or none
  - no Git/dependency/protected-output/external/orchestration/out-of-scope confirmation
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
self_approval: forbidden
