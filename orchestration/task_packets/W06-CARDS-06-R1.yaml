deliverables:
  - Evaluation protocol card describing the frozen roster, rubric/evidence boundary, partitions, supported k, metrics, intervals, baselines, nulls and exact stop algorithm.
  - Missing-evidence card that records zero governed human reviewers, judgements, pairs and protected queries and names the evidence needed for a future rerun.
  - Updated M0 evaluation card preserving the accepted W05 identity and resemblance_only, synthetic_development_only, LIMITED claim ceiling.
  - Baseline comparison report that states the preregistered metadata/raw-Euclidean comparisons were not computed because the protected population was absent.
  - Robustness/transfer and null-control reports separating deterministic fixture implementation evidence from unavailable empirical evidence and retaining every exact unsupported population.
  - Failure-case register retaining all available materially limited examples and explicitly recording any shortfall from ten without inventing cases.
  - Protected access and comparison reports bound to the exact one-use output identities and NO_GO reason.
  - Applicability contract and limitations that keep W07 PLANNED and unauthorised and name only the smallest governed-evidence follow-up.
definition_of_done:
  - Every claim is traceable to a read_first source and no expert, protected, transfer, calibration, prospective, production, recommendation, outcome or value evidence is invented.
  - Public deterministic fixtures are described only as implementation/rejection witnesses, never empirical relevance evidence.
  - The protected result is exactly NO_GO with sole reason MISSING_EXPERT_RELEVANCE_EVIDENCE, bundle/run absent and protected expected labels/results unopened; the three retained broker result files are authorised read-only closure evidence.
  - All three retained output file hashes plus their object digests and frozen candidate/protocol/inventory/preregistration identities are transcribed exactly.
  - Unsupported k=25 and unavailable group/time/provider/competition/team populations remain explicit.
acceptance_checks:
  - test -s reports/evaluation/W06/evaluation-protocol-card.md
  - test -s reports/evaluation/W06/evaluation-evidence-card.md
  - test -s reports/evaluation/W06/m0-model-evaluation-card.md
