deliverables:
  - Code- and evidence-grounded P0/P1/P2/P3 findings with exact file/line references, exploit or failure preconditions, and required corrections.
  - Independent adversarial review of IDOR/cross-object access, role/privilege escalation, session expiry/revocation/fixation/CSRF, private/team visibility and privileged export.
  - Independent review of audit-chain integrity, transactional atomicity, tampering, replay/idempotency, optimistic concurrency, partial-failure recovery, sensitive-data leakage and path/file handling.
  - Independent adversarial review of form media-type/body-size/UTF-8 handling, exact exemplar replay fidelity, candidate allowlisting and rejection/correction history.
  - Independent review of semantic/keyboard/responsive accessibility evidence and every evidence-honest W06 boundary string.
  - Explicit verdict PASS or FAIL; any P0/P1 in security, confidentiality, authorisation, accessibility, evidence honesty or audit integrity requires FAIL.
  - Explicit statement that synthetic automation is not representative-user evidence and whether five genuine reviewed participant records exist.
focused_checks:
  - uv run pytest -q tests/contracts/test_w08_workflow_contracts.py tests/security/test_w08_auth_audit.py tests/security/test_w08_workflow_access.py tests/security/test_w08_export_boundaries.py tests/security/test_w08_web_security.py tests/integration/test_w08_workflow.py tests/integration/test_w08_evidence_export.py tests/integration/test_w08_local_workflow_app.py tests/integration/test_w08_study_harness.py tests/e2e/test_w08_local_workflow_playwright.py
  - uv run bandit -q -r src/scouting/policy/r1.py src/scouting/audit/ledger.py src/scouting/workflow/r1.py src/scouting/observations/r1.py src/scouting/operations/evidence_export.py src/scouting/web/w08.py scripts/run_w08_study.py
stop_conditions:
  - A protected W06 expected output would need to be opened or reconstructed.
  - A review step would mutate product code, tests, shared configuration, dependency state, Git or an external system.
  - A network service, remote, public endpoint, external identity/model/provider or destructive action would be required.
mandatory_return:
  - review ID and exact reviewed implementation/packet paths
  - exact commands, exit statuses and concise results
  - findings ordered P0 through P3 with precise evidence
  - separate authn/authz, confidentiality/export, audit/concurrency/recovery, browser/accessibility and claim-boundary outcomes
  - representative-user evidence status
  - final PASS or FAIL verdict and required rework
  - confirmations of no Git operations, no product/test edits and no protected-output access
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
