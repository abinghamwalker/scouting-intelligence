    Correct resolution requires changing candidate bytes, R20 architecture,
    project root, dependency/lock policy, provider/rights authority, storage, or
    local-only boundary.
  - A frozen candidate digest differs.
  - Work requires a third output path.
  - Any preflight/postflight pyc or unexpected filesystem drift occurs.
