requirements:
  - >-
    Resolve exactly R1-P1-01. Do not revise any of the 119 semantic choices,
    transforms, rationales, source shapes, candidate bytes, actor, clock,
    policies, inputs, IDs, or digests.
  - >-
    Remove the permanent requirement that the future review and acceptance
    files never exist. Instead implement strict, progression-safe parsing and
    validation for the R20 field review and acceptance states when their exact
    paths are present. Their absence remains valid before their separately
    owned packets execute.
  - >-
    A present review must contain arbitrary prose outside exactly one
    `w04-authority-review-v1` fenced block and no second fenced block. The block
    must contain exactly one canonical JSON record plus one LF with the exact
    R20 keys, types, IDs, candidate decision/registry physical and canonical
    digests, strict independent ActorId, truthful canonical clock at or after
    `decided_at`, and PASS/empty-findings or REWORK/nonempty-findings
    consistency. It must reject malformed/second blocks, candidate mutation,
    self-review, false/backdated clocks, unknown keys, and digest mismatch.
  - >-
    A present acceptance must require a present valid PASS review and must be
    strict canonical JSON with the exact R20 fields, IDs, actors, clocks,
    unchanged candidate decision/registry digests, canonical review-record
    digest, complete physical review digest, `review_recommendation: PASS`, and
    `supersedes_acceptance_id: null`. Reject acceptance without PASS,
    self-acceptance by the reviewer, clock inversion, candidate/review digest
    mismatch, physical/canonical substitution, unknown keys, or noncanonical
    bytes.
  - >-
    Bronze/product/runtime paths must be absent whenever no fully valid field
    acceptance exists. A mere acceptance pathname, malformed bytes, REWORK
    review, wrong actor, or wrong digest must never lift the block. Once an
    exact valid acceptance exists, this field-authority test must not
    permanently forbid later separately authorized Bronze paths.
  - >-
    Preserve the existing rejection of premature review, acceptance,
    dependency, or Bronze claims embedded in the decision or registry
    candidate. Add focused in-memory mutation tests for every newly implemented
    review/acceptance authority edge without creating the actual future review
    or acceptance artifact.
  - >-
    At R2 completion the actual review and acceptance paths must still be
    absent, every Bronze/product/runtime path must still be absent, and the
    frozen candidate digests above must be unchanged. Record these as
    execution-time evidence in the R2 return, not as a permanent prohibition
    against the later exact packets.
  - >-
    Use only root uv. Every Python command must start with
    PYTHONDONTWRITEBYTECODE=1 and run through
    `uv run --locked --no-sync python -B`; use `-S -B` when installed packages
    are unnecessary. Do not sync. Take the exact shell-only complete pyc
    inventory before Python and reproduce it identically at terminal
    postflight. Do not clean, repair, or mutate pycs.
  - >-
    Change exactly the two owned paths. Do not run Git, delegate, self-approve,
    access network/provider data, or begin review, acceptance, dependency,
    possession, identity, feature, Bronze, Silver, Gold, quality,
    runtime-entrypoint, cloud, container, endpoint, or deployment work.
definition_of_done:
  - R1-P1-01 is closed with a fail-closed progression-safe authority-state test.
  - Frozen decision and registry bytes and digests are unchanged.
  - Review, acceptance, and Bronze remain absent at R2 completion.
  - Complete focused positive and mutation suites pass.
acceptance_checks:
  - >-
    PYTHONDONTWRITEBYTECODE=1 uv run --locked --no-sync python -B -m pytest -q
    tests/contracts/test_wyscout_field_registry_authority.py
  - >-
    uv run --locked --no-sync ruff format --check
    tests/contracts/test_wyscout_field_registry_authority.py
  - >-
    uv run --locked --no-sync ruff check
    tests/contracts/test_wyscout_field_registry_authority.py
  - >-
    PYTHONDONTWRITEBYTECODE=1 uv run --locked --no-sync python -B
    scripts/verify_local_only.py
stop_conditions:
