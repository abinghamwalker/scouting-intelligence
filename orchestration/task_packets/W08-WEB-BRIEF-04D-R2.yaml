deliverables:
  - Analyst-only accessible role-brief form with fixed local template/taxonomy, supported responsibility codes, transparent replay-context weights, supported hard-constraint field/operator/value and a real selectable local synthetic-development exemplar ID.
  - Complete immutable history for template, taxonomy, responsibilities, constraints, preferences/weights, exemplars, status, transition/rejection reason/note, submitted/decided timestamps and attributable actors.
  - Role-correct submit, approve, controlled reject and rejected-to-draft corrected-version controls; status-only transitions retain identical content and submitted_at while correction appends changed content without rewriting rejected history.
  - Build the retrieval request with requested_at no earlier than the approved brief creation, the brief's exact tenant/ID/version/trace, exact responsibilities/weights/constraints/exemplars and deterministic request identity; final PinnedM0ServingRequest normal validation and the accepted local W05 core remain authoritative.
  - Persist exact exemplar query mode; retrieval_result_id from replay.retrieval_result.retrieval_result_id, not wrapper ID; exact request/run/result IDs, wrapper result digest, dependency lineage digest, model/index/taxonomy version and candidate-universe data version.
  - Repeat the identical pinned replay and assert IDs/digests/candidate order match before persisting; repeated POST is idempotent and never creates duplicate link/audit rows.
  - Render query mode, exemplar IDs, versions, exact IDs/digests, candidates, applicability and limitations. State explicitly that weights are retained replay context but are not applied by W05 scoring, and that this is not validated/recommended/transfer/value/production evidence.
  - Longlist form offers only candidate IDs from the exact replay result for the selected link; POST replays and rejects any player outside that candidate set without entry/audit partial state.
  - Generic denied/failed replay, invalid constraints/weights/exemplars, role/tenant/object/CSRF/stale paths with no partial brief/link/audit state.
definition_of_done:
  - Moderated T1/T2 and brief-to-longlist selection are mechanically reachable with exact deterministic replay metadata and complete historical interpretation.
  - No protected W06 output/rerun, fitting/training, external/model-provider call, dependency or shared-service change occurs.
focused_checks:
  - Full reject/correct/resubmit/approve chain retaining old and new exact values.
  - Two identical local replays match every request/result/run/wrapper digest, lineage and candidate identity; persisted row/export fields agree.
  - Candidate allowlist and all negative role/CSRF/stale/invalid inputs fail atomically.
acceptance_checks:
  - uv run ruff format --check src/scouting/web/w08.py tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py
  - uv run ruff check src/scouting/web/w08.py tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py
  - uv run mypy src/scouting/web/w08.py
  - uv run pytest -q tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py tests/e2e/test_w05_m0_retrieval.py
stop_conditions:
  - Exact replay still requires a shared contract/service/policy/migration/dependency change or any protected W06 output/reconstruction.
  - A network/external/model provider, fitting/training, Node/npm, container, destructive action or Git operation is required.
  - Correctness would require substituting query identity, inventing metadata, accepting a non-result candidate or widening evidence claims.
mandatory_return:
  - task ID/revision and exact invariant
  - exact changed-file list
  - role version/control and replay field maps
  - exact commands, exit statuses and test counts
  - exact double-replay/candidate and negative atomicity witnesses
  - residual risks/follow-ups
  - confirmations of no Git, dependency/lock, protected-output or out-of-scope edits
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
