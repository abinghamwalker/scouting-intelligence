      Emit the complete accepted `completion_index_binding` object, including its
      exact 13-key shape, eight ordered reader verification/rejection requirements,
      exact scope, source paths/IDs/digests/counts and both period rows. Additional
      index-manifest facts may remain separately exact but cannot replace this object.
    - >-
      Emit complete exact structured build/product authority subobjects for
      `build_identity`, `window_authority`, `layer_manifest_authority` and
      `receipt_contracts`. Tests must load the accepted authority JSON, select each
      subobject and require deep equality; counts, prose and label lists do not pass.
    - >-
      Emit exact ordered component-key and admission/rebuild argv constants from the
      frozen build contract, including bounds, digest/preimage and inverse rules used
      by the owning validators. Tests must reproduce them from the contract owner.
  predicate_closure:
    - >-
      Retain mechanically resolvable runtime operands, but expand each summarized
      build predicate so every cross-field operation performed by its validator has
      exact operands/constants. In particular close WindowIdentity,
      PreBuildProjection, RebuildInvocation, EntrypointSourceResult,
      PreBuildAdmissionResult, PostBuildIdRebuildResult, TemporalBoundaryReceipt,
      RebuildInvocationReceipt and ChildResultEnvelope.
    - >-
      Export the eight separate external/composed authority predicates E1-E8 from
      the independent oracle: source completion, season/lineup, checked-product
      issuance, 25-key build composition, sole complete-manifest semantic closure,
      parent/Gold population closure, receipt clocks/results, and schema acceptance.
      Every predicate must cite exact frozen source artifacts and carry exact
      operands/constants; do not collapse distinct gates into one descriptive label.
    - >-
      Add independent expected-ledger assertions for owner, validator,
      classification, operation, operands and material constant corpus. Counting and
      resolving only the candidate's own emitted records remains insufficient.
  valid_serialization_evidence:
    - >-
      Replace descriptor-generated pseudo-logical values as acceptance evidence with
      the oracle's minimum 29-row valid variant matrix. Each row must be an accepted
      instance of its owning one of twelve Pydantic root models, survive a fresh
      strict `model_validate` of its Python/logical dump, be projected mechanically
