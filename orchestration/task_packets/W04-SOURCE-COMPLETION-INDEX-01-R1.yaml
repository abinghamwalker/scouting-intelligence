    src/scouting/contracts/wyscout_data.py tests/unit/test_wyscout_source_completion_index.py
    tests/contracts/test_wyscout_data_contracts.py
  - >-
    uv run mypy src/scouting/sources/wyscout_completion_index.py
    src/scouting/contracts/wyscout_data.py tests/unit/test_wyscout_source_completion_index.py
    tests/contracts/test_wyscout_data_contracts.py
  - uv run lint-imports
  - >-
    uv run pytest -q tests/unit/test_wyscout_source_completion_index.py
    tests/unit/test_wyscout_source_manifest.py tests/contracts/test_wyscout_data_contracts.py
    tests/contracts/test_foundation_contracts.py
    tests/contracts/test_w04_identity_ruleset_authority.py
    tests/contracts/test_w04_r21_cross_authority_composability.py
