requirements:
  - >-
    Before deriving any index member, invoke or exactly reproduce the accepted source
    bridge verification so the completion document, source-manifest identity, every
    authorized event member's whole-file SHA-256/size and top-level row count are
    verified against frozen evidence. Do not discover paths or read excluded members.
  - >-
    Derive one deterministic canonical index with exact source-manifest ID/digest and
    exact five-member scope bindings. For every source match-period, commit its exact
    count and an ordered membership digest whose framed preimage covers physical
    ordinal, strict provider event identity, strict provider match identity, exact
    period and clock/order fields, strict integer-or-null player/team, strict integer
    event and integer-or-null subevent, exact raw tags plus strict-integer possession
    tag projection, and canonical raw-record SHA-256. Strings remain unmapped or fail;
    no integer coercion is allowed.
  - >-
    Canonical index ordering, member/period uniqueness, per-member and aggregate count
    reconciliation are mandatory. Write only canonical immutable bytes under
    data/manifests/wyscout/v5/source-completion/ with a filename or containing directory
    whose address is the exact SHA-256 of the canonical payload. Re-running must be
    byte-idempotent; conflicting existing bytes fail closed.
  - >-
    Provide a public completion-reader validation boundary that loads only that exact
    local content-addressed index, independently verifies its payload address, source
    bindings, ordering, uniqueness and reconciliations, and compares an entire supplied
    match-period Bronze/source action population in its supplied order with the indexed
    count and membership digest. Missing, extra, duplicate, reordered, stale,
    cross-member, cross-match and cross-period evidence must fail closed. A submitted
    Boolean/count/witness/subset-only digest must never establish completeness.
  - >-
    Bind the accepted index SHA-256 through Silver possession, Silver player-match fact,
    Gold player-window provenance and dependency-lineage hashing. Preserve causal
    other-player/ineligible source rows. Do not use RETRIEVAL_INDEX as a semantic alias
    for this source control. Keep contract-module import direction compliant.
  - >-
    Apply group-first equal-clock CONTROL/RESTART resolution: a same-clock multi-team
    group and dependent contested buffer are wholly unassigned, while deterministic
    possessions completed strictly earlier remain. Source ordinal/event ID cannot pick
    a team within an ambiguous clock.
  - >-
    Add named adversarial tests for source/index digest drift, count drift, canonical
    order/uniqueness/aggregate drift, truncation through Gold, whole-period omission,
    missing/additional/duplicate/reordered/stale/cross-period input, all six R20 coverage
    omissions, other-player causal provenance, and both equal-clock cases. Existing R1-
    R4 closures and the exact four-feature roster must remain.
definition_of_done:
  - The actual frozen five-member source derives exactly one content-addressed index.
  - The accepted index reconciles exactly 3071395 source action rows.
  - Every required adversarial case fails at the public completion-reader boundary.
  - Silver/Gold provenance and dependency lineage bind the accepted index digest.
  - All focused checks pass without product writes or unauthorized byte changes.
