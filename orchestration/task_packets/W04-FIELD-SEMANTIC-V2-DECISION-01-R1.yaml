preflight_postflight:
  - >-
    Before invoking Python, create and retain a shell-only inventory of every
    existing repository/site pyc and __pycache__ directory with path, size,
    mode, link, mtime, first bytes, and full SHA. Do not clean or repair.
  - >-
    All Python/test commands set PYTHONDONTWRITEBYTECODE=1 before uv and use
    `--locked --no-sync`; helpers invoke `python -B`, or `-S -B` when packages
    are unnecessary. Do not sync or install.
  - >-
    After the final return edit and checks, repeat the identical inventory.
    Any difference invalidates the return and must be reported without cleanup.
requirements:
  - >-
    Verify every frozen input before editing. Preserve every v1 authority,
    candidate, review, acceptance, test, profile, taxonomy, and source byte.
  - >-
    Write the v2 decision as strict canonical UTF-8 JSON with sorted keys,
    NFC strings, no insignificant whitespace, and exactly one terminal LF.
    Its exact ten top-level keys, ten bound-input keys, IDs, schema, actor,
    truthful canonical UTC clock, source ID, policies, and immutable
    seventeen-key field-v1 prior_authority are those fixed by R21 Sections
    2, 3.1, and 5.
  - >-
    Write the v2 YAML candidate so its strict parsed value has exactly the nine
    R21 keys and byte-semantically repeats decision bound_inputs, decisions as
    fields, policies, prior_authority, and source_id. Bind the decision's
    physical/canonical SHA-256 without circular or future authority edges.
  - >-
    Produce exactly 119 unique rows in the R20 source-profile sequence:
    competition, team, player, match, action, event-taxonomy, tag-taxonomy,
    preserving each kind's declared order. Exactly 118 rows must be
    semantically equal to v1. The sole changed row is
    (action, $.subEventId), exactly as R21 Section 5.3.
  - >-
    The sole changed row emits action_subevent_taxonomy_id only when the raw
    JSON value is a strict integer excluding bool and the exact already-
    canonical event/integer-subevent pair exists in the frozen taxonomy.
    Strings, bools, null, noninteger numbers, arrays, objects, absent canonical
    events, and unknown integer pairs emit nothing and preserve exact typed raw
    rejected-field evidence without coercion, lookup, inference, or loss.
  - >-
    Implement the complete seven-condition reason-code table from R21 Section
    5.4. Pin the measured integer:3063574/string:7821 shape and prove strings
    including "10", " 10", "+10", and "010" are never parsed or canonicalized.
  - >-
    The focused test must independently reconstruct canonical decision bytes,
    strict YAML parsing, physical/canonical hashes, closed keys, prior authority,
    preimage bindings, source roster/shapes, exact taxonomy-pair behavior, and
    v1 immutability. Include positive and in-memory mutation cases; do not rely
    only on pinned whole-file hashes.
  - >-
    Make future review/acceptance state validation progression-safe: absence is
    valid during this producer packet; if later present, only the exact R21 IDs,
    digest edges, independent actor, truthful clock order, PASS consistency,
    v1 supersession, and closed R20 review/acceptance schemas may validate.
    Do not create those future files or grant product authority.
  - >-
    At completion, future field-v2 review/acceptance, all possession-v2,
    feature, cross-authority, Bronze, Silver, Gold, manifest, receipt, build,
    serializer, and product paths remain absent. No source/provider access,
    runtime build, model, cloud, container, endpoint, hosted CI, deployment,
    dependency/lock edit, Git operation, delegation, or self-approval.
definition_of_done:
  - Exactly the four allowed paths are created.
  - Decision and candidate satisfy the complete closed R21 field-v2 contract.
  - The 119 rows differ semantically from v1 at exactly one required row.
  - Strict-integer mapping and every preserve-unmapped reason are mutation-tested.
  - Focused v2, immutable v1, Ruff, and local-only checks pass.
  - Preflight and terminal pyc/__pycache__ inventories are byte-identical.
acceptance_checks:
  - >-
    PYTHONDONTWRITEBYTECODE=1 uv run --locked --no-sync pytest -q
    tests/contracts/test_w04_field_semantic_v2_authority.py
    tests/contracts/test_wyscout_field_registry_authority.py
  - >-
    PYTHONDONTWRITEBYTECODE=1 uv run --locked --no-sync ruff format --check
    tests/contracts/test_w04_field_semantic_v2_authority.py
  - >-
    PYTHONDONTWRITEBYTECODE=1 uv run --locked --no-sync ruff check
    tests/contracts/test_w04_field_semantic_v2_authority.py
  - >-
    PYTHONDONTWRITEBYTECODE=1 uv run --locked --no-sync python -B
    scripts/verify_local_only.py
stop_conditions:
  - Any frozen input differs, a mandatory source is missing, or v1 bytes change.
  - A future/downstream/product path already exists unexpectedly.
  - Any check or preflight/postflight inventory comparison fails.
  - >-
    Correct implementation requires an architecture, product, provider/right,
    root, dependency/lock, storage, network, cloud, container, endpoint,
    hosted-CI, deployment, or broader-scope change.
  - Work requires a fifth output path.
