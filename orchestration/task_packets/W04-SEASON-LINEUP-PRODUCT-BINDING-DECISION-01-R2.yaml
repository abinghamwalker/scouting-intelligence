requirements:
  - Verify every fixed binding before editing and stop on drift.
  - >-
    Modify no authority, review, config, runtime, data or product byte. Preserve
    the live REWORK review so the authority lifecycle continues to parse it.
  - >-
    In both authority test modules, replace the unconditional assertion that all
    repository Bronze/Silver/Gold/manifest/rebuild paths are absent with a test
    that snapshots destination state, loads/validates the exact authority, and
    proves the read changes no destination state whether paths are absent or
    already exist. Include an isolated tmp_path progression case with at least
    one pre-existing simulated product root. Never create a real product root.
  - >-
    In test_w04_r21_control_preimages.py, replace the unconditional repository
    destination-absence assertion with equivalent side-effect-free preimage-load
    checks for both absent and pre-existing simulated destinations.
  - >-
    Retain and test the semantic claims that each authority/preimage remains
    control-plane-only, grants no product permission itself, performs no writer
    call, and cannot create, delete or alter a destination. Do not make authority
    lifecycle state depend on product existence.
  - >-
    Product existence after a separately accepted downstream gate must not cause
    any of the three permanent modules to fail. Do not introduce a placeholder
    gate path, future task ID, environment flag, skip, xfail or conditional that
    silently disables validation.
  - >-
    Retain pre-implementation no-product evidence in the existing producer,
    master-verification and failed-review reports; do not rewrite those reports.
  - Add no dependency and perform no Git, provider, network or external action.
