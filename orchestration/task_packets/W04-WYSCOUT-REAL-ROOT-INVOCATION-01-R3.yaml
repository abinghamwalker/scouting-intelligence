requirements:
  - >-
    Keep every accepted source/code/product/manifest/receipt and every retained
    failed or successful prefix read-only except for the accepted launcher's
    content-addressed/idempotent creation of new run families. Perform no cleanup,
    overwrite, rename, reuse, Git operation or code change.
  - >-
    Classify R2 exactly: the accepted launcher and rebuild completed and published
    the fixed code manifest/build/products/layer manifests plus one invocation and
    boundary receipt family. The extra master wrapper then exited `1` because it
    compared dynamic `outer_transport_environment_sha256` against the normalized
    fixed-environment authority digest. Retain R2 as core-complete but wrapper-
    unverified evidence; do not count it among the two R3 wrapper-verified runs.
  - >-
    The R3 wrapper correction must change no launch input, command, environment,
    descriptor, product, manifest, receipt or accepted code byte. Before process
    creation it mechanically reconstructs the exact 30-key post-uv child transport
    environment, including venv-prefixed PATH, recursion depth `1`, dynamic control
    prefix and inherited source descriptor, hashes its canonical JSON bytes, and
    compares the returned dynamic digest to that value. The normalized fixed-
    authority digest remains independently frozen in the accepted bootstrap tuple.
  - >-
    Execute exactly two additional fresh runs. Require wrapper exit `0`, one exact
    canonical COMPLETE status line, no extra stdout, distinct fresh control,
    admission and rebuild UUIDv4 values, exact dynamic transport digest equality,
    empty unchanged runtime prefixes, the fixed current code manifest/build ID,
    byte-identical seven products/three manifests and two new complete receipt
    families.
  - >-
    Guard-read/reopen every output and reconstruct code manifest, 25-key projection,
    build ID/inverse, product schemas/rows/digests, layer parent chain, temporal
    proof, receipt cross-fields and equality across the two R3 runs. Retain R1, R2
    and both R3 evidence families and all pre/mid/post inventories.
