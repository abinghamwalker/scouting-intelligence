requirements:
  - >-
    Close W04DCR3-P1-001. SilverPlayerMatchFact must derive all six R20
    coverage numerators and denominators from closed embedded identity, lineup,
    action, coordinate, possession and temporal evidence before Gold
    aggregation. A caller must not be able to replace any fixture dimension
    from 1/1 to internally consistent 2/2. Do not close this by hard-coding
    1/1, adding duplicate caller-supplied counts, or checking only Gold.
  - >-
    Close W04DCR3-P1-002. Derive coordinate_known_action_count using the exact
    accepted POSITION_PRESENT predicate: action_positions cardinality one or
    two, every position has both finite numeric axes, and every axis is within
    inclusive 0..100. Preserve anomalies unchanged with
    within_accepted_bounds=false but exclude the whole action from the
    coordinate feature and successful coordinate coverage numerator.
  - >-
    Close W04DCR3-P1-003. Separate exact possession-v2 predicate admission
    from final ELIGIBLE_RESOLVED sequence state. Final resolution and
    SilverPossession membership must derive from complete, unique, canonical,
    same-match and same-period ordered action evidence under the frozen R20/R21
    sequence policies. A singleton or period-ending CONTESTED (1,10) action
    must remain unassigned/ineligible; it may attach only when the exact
    required following deterministic possession exists. A caller-selected
    same-team action subset is not complete sequence evidence.
  - >-
    Add named public-constructor regressions for every all-six fact 1/1-to-2/2
    mutation, out-of-bounds and mixed-position Fact-to-Gold propagation,
    singleton/period-end contested rejection, following-control contested
    attachment, duplicate or incomplete period evidence, cross-match/period
    leakage, and resolved-count drift.
  - >-
    Preserve every R1-R3 closure, exact accepted authority/source/preimage
    byte, exact four-feature roster, all existing public security/temporal/
    provenance/path/quarantine invariants, and no-write in-memory test scope.
definition_of_done:
  - All three independent R3 finding families fail closed at public constructors.
  - Exact accepted authority/source/preimage bytes and digests remain unchanged.
  - Exactly four supported feature values remain and are evidence-derived.
  - Tests remain in-memory and create no product, manifest, receipt, or runtime file.
  - No architecture revision, serializer, dependency, provider access, or product write is introduced.
