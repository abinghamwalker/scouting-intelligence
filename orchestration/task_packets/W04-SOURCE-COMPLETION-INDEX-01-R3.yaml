requirements:
  - >-
    Establish one explicit checked construction boundary issued only after
    `validate_match_period_population` or `validate_match_population` succeeds against
    the accepted content-addressed index. The evidence passed downstream must be bound
    to that exact validated match-period population, not merely to the fixed index
    digest or a caller-provided membership digest/count/Boolean/witness.
  - >-
    Every authorized SilverAction, SilverPossession, SilverPlayerMatchFact,
    GoldPlayerWindow and layer-manifest construction/materialization entry point must
    require and verify that completion result before returning an accepted value.
    Direct low-level model construction, model_validate, copied model dumps, an
    arbitrary membership digest, or a real indexed membership digest without the exact
    population comparison must be incapable of crossing the authorized product
    boundary.
  - >-
    An opaque in-process capability is acceptable only if ordinary public callers
    cannot construct, copy, serialize/replay, or substitute it and every downstream
    boundary verifies exact identity/scope. A documentation-only, underscore-only,
    Boolean, fixed literal, caller-computable hash, or caller-selected validation
    context is insufficient. Prefer a pure verifiable inclusion/preimage proof when
    it can remain bounded and dependency-free.
  - >-
    Add a regression equivalent to the independent bypass: establish the membership
    is absent from the accepted index, make every reader/validator/factory fail-fast,
    then prove ordinary checked construction cannot return accepted Silver/Gold.
    Repeat with a copied real membership digest but a non-equal population. Do not use
    `model_construct` as either implementation or credited test evidence.
  - >-
    Preserve exact accepted index bytes/address, full 3071395 reconciliation, source
    bindings, every R1/R2 mutation closure, strict integer-only action projection,
    equal-clock group-first behavior, causal other-player provenance, dependency-
    lineage binding, all six coverage authorities and exactly four Gold features.
  - >-
    Keep contracts free of filesystem/provider access and keep source-to-contract
    import direction. Add no dependency, serializer, product artifact, provider access,
    network, cloud, container, endpoint, hosted CI, remote or deployment.
definition_of_done:
  - The exact independent fail-fast-reader Gold bypass no longer returns accepted Silver or Gold.
  - The accepted reader path still constructs exact source-bound sequences and supplies an enforceable downstream prerequisite.
  - Direct test/semantic objects cannot be consumed by the authorized product boundary.
  - The immutable index and every accepted R2 behavior remain byte/behavior stable.
