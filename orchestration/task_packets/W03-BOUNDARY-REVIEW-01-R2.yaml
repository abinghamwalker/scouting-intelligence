deliverables:
  - >-
    Retained independent role-brief collision proof plus independent shortlist and
    shortlist-entry collision challenges, all requiring generic denial, unchanged
    victim ownership and zero attacker material/audit effects.
  - >-
    Independent exact canonical replay and immutable-content mismatch challenges
    across the conflict-aware workflow.
  - Complete rerun of every R1 boundary and import-direction challenge.
  - Updated W03.1–W03.6/G-W03/G1 evidence mapping with final recommendation.
  - Complete mandatory R2 return; no implementation edits and no self-approval.
definition_of_done:
  - The retained R1 P1 reproduction passes unchanged.
  - Shortlist and shortlist-entry same-tenant owner collisions independently fail closed.
  - Same-owner immutable-content mismatch fails closed and exact replay is deterministic.
  - All ten original boundary challenges and the additive R2 checks pass.
  - No protected fixture or expected result is accessed.
  - Every non-pass has concrete reproduction evidence and a bounded correction.
  - The mandatory return confirms no Git operation.
acceptance_checks:
  - uv run pytest -q tests/security/test_w03_boundary_audit.py
  - uv run ruff format --check tests/security/test_w03_boundary_audit.py
  - uv run ruff check tests/security/test_w03_boundary_audit.py
  - uv run lint-imports --no-cache
  - >-
    uv run python -c "from pathlib import Path;
    text=Path('reports/reviews/W03/boundary-audit-R2.md').read_text();
    assert all(term in text for term in
    ['W03.1', 'W03.2', 'W03.3', 'W03.4', 'W03.5', 'W03.6', 'G-W03', 'G1'])"
stop_conditions:
  - The protected fixture has been accessed or its isolation cannot be maintained.
  - Any requested correction requires implementation or a path outside allowed_paths.
  - A Git command, Docker operation, dependency, external service, credential, public bind or destructive action appears necessary.
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
