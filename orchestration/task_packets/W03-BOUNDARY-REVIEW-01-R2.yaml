  - reports/reviews/W03/boundary-audit-R2.md
  - reports/reviews/W03/returns/W03-BOUNDARY-REVIEW-01-R2.md
forbidden_paths:
  - .git/**
  - pyproject.toml
  - uv.lock
  - compose.yaml
  - migrations/**
