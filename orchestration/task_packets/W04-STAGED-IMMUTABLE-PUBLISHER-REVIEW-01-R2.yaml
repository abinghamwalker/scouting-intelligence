review_requirements:
  - Verify every fixed hash before analysis and stop on drift.
  - >-
    Reproduce the failed R1 review race: create an exact final, introduce the exact
    serializer-owned staged name during final_recheck, and prove R3 returns no result,
    preserves the immutable final, and retains the raced evidence without repair.
  - >-
    Independently attack the final replay checkpoint with a safe regular file,
    symlink, hardlink, FIFO, directory, unsafe mode/link count, disappeared staging
    parent, and same-path replacement parent. Confirm descriptor-relative no-follow
    root/parent identity binding and the correct race/security failure class.
  - >-
    Reaudit the exact three-name root vocabulary and every original R2 path, full-byte
    write/read, regular-file/mode/link control, immutable equal replay, no-replace
    hardlink promotion, post-link final-parent fsync, post-unlink staging-parent fsync,
    retained failure evidence, no sidecars, and no unrelated-final damage.
  - >-
    Record the accepted same-trust-domain residual exactly: a transient staged name
    that appears and disappears wholly between checkpoints is not cryptographically
    excluded; do not misstate this as broader correctness.
  - >-
    Confirm no GuardedStorage/encoder change, real product or partial path, dependency,
    Git operation, provider/network access, cloud, container, hosted CI, endpoint or
    deployment occurred.
