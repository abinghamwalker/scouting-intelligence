deliverables:
  - Move the evidence-export module unchanged in behaviour from `scouting.operations`
    to `scouting.workflow`, update package exports and every runtime/test import, and
    leave `scouting.operations` as its pre-W08 telemetry surface.
  - Do not add a compatibility re-export that creates an upward or peer dependency;
