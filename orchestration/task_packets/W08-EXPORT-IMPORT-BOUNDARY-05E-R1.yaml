  - uv run pytest -q tests/integration/test_w08_evidence_export.py tests/security/test_w08_export_boundaries.py tests/security/test_w08_web_security.py tests/integration/test_w08_local_workflow_app.py tests/e2e/test_w08_local_workflow_playwright.py
