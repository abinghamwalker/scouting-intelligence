requirements:
  - >-
    Close W04DCR4-P1-001 with an independently recomputable, in-memory public
    contract/factory boundary. Accept the complete admitted Bronze/source
    match action and lineup populations, derive exact period partitions,
    player-match candidates, actions, possessions, source rows and all six R20
    coverage populations from them, and reject any omitted or added member at
    each public boundary. A literal completeness flag, mirrored count, caller-
    selected tuple, or digest derived only from the supplied subset is
    insufficient.
  - >-
    Bind every PossessionSequenceAction field to exact admitted evidence,
    including action_id =
    canonical_source_uuid(ACTION, source_event_record_id), physical source row,
    match/player/team, event/subevent, period/order, and tags. An unbound
    other-player or otherwise causal entry must fail before it can change
    possession resolution.
  - >-
    Carry every causal action source row used by sequence resolution into
    SilverPossession, SilverPlayerMatchFact and Gold provenance, including
    other-player and ineligible simultaneous rows. Fact/Gold source rows,
    supported counts, candidate population and coverage must remain exact when
    causal rows do not belong to the row player.
  - >-
    Close W04DCR4-P1-002 by evaluating all CONTROL/RESTART actions at one
    period_rank/period_elapsed_seconds clock as a group before applying
    transitions. Different canonical teams at the same clock make the entire
    same-clock control boundary and dependent contested buffer unassigned.
    Preserve deterministic groups completed strictly before that clock and
    forbid source ordinal from choosing a team.
  - >-
    Add named public-boundary regressions for consistent truncation through
    Gold while lineage retains the omitted row; whole-period omission;
    noncanonical and semantically drifted other sequence entries; other-player
    causal provenance; all six coverage population omissions; two-action
    equal-clock cross-team control; pre-existing deterministic possession
    followed by an ambiguous clock; and dependent contested evidence.
  - >-
    Preserve every R1-R4 closure, exact accepted authority/source/preimage
    byte, exact four-feature roster, all existing public security/temporal/
    provenance/path/quarantine invariants, and no-write in-memory test scope.
definition_of_done:
  - Both independent R4 finding families fail closed at public boundaries.
  - Exact accepted authority/source/preimage bytes and digests remain unchanged.
  - Exactly four supported feature values remain and are source-evidence-derived.
  - Tests remain in-memory and create no product, manifest, receipt, or runtime file.
  - No architecture revision, serializer, dependency, provider access, or product write is introduced.
