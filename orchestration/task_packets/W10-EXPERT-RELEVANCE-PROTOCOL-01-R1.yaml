acceptance_checks:
  - uv run pytest -q tests/contracts/test_w10_expert_relevance_contracts.py
  - uv run ruff format --check src/scouting/contracts/expert_relevance.py scripts/build_w10_expert_protocol.py tests/contracts/test_w10_expert_relevance_contracts.py
  - uv run ruff check src/scouting/contracts/expert_relevance.py scripts/build_w10_expert_protocol.py tests/contracts/test_w10_expert_relevance_contracts.py
  - uv run mypy src/scouting/contracts/expert_relevance.py scripts/build_w10_expert_protocol.py
stop_conditions:
