deliverables:
  - A review that verifies all four physical bindings before analysis.
  - Independent reasoning about READY lifecycle safety and master-return exemption fail-closed behavior.
  - Independent reproduction of all four producer checks plus adversarial borrowed-packet and delegated-return cases.
  - A PASS or REWORK recommendation with concrete findings.
  - A complete Markdown handback using orchestration/templates/subagent_return.md.
definition_of_done:
  - No implementation path is edited.
  - PASS is allowed only if READY does not bypass any other gate and empty returns remain impossible for delegated, mixed, absent, invalid, or task-mismatched packet evidence.
  - The review distinguishes correction acceptance from R21 gate acceptance and from product authorization.
acceptance_checks:
  - uv run ruff format --check scripts/verify_phase.py tests/unit/test_orchestration_controls.py
  - uv run ruff check scripts/verify_phase.py tests/unit/test_orchestration_controls.py
  - uv run mypy scripts/verify_phase.py
  - uv run pytest -q tests/unit/test_orchestration_controls.py
stop_conditions:
  - Any physical binding differs.
  - A finding requires implementation changes outside the bounded correction.
  - A secret, external account, deployment, destructive action, dependency change, or Git operation is required.
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
