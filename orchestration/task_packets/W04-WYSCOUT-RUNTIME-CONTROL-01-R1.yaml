requirements:
  - Verify every fixed binding before implementation and retain all accepted bytes.
  - >-
    The admission entrypoint must remain stdlib-only under the exact accepted
    locked/no-sync, no-site, no-bytecode argv. It must consume one closed canonical
    input, guard-read exact repository/lock/runtime/resource paths without Git or
    directory shorthand, independently derive the exact ordered twenty stable
    COMPONENT_KEYS values and positive evidence counts, and return a canonical
    PreBuildAdmissionResult/ChildResultEnvelope that validates without coercion.
    No placeholder, caller-supplied component digest, ambient Git value, clock,
    host path, run ID, output digest, product observation or network value may enter
    the stable code/environment manifest.
  - >-
    Reproduce the exact v15 stable-manifest key order, canonical no-LF bytes,
    environment digest over the exact twenty components, repository-code digest,
    component-proof digest, uv 0.9.21 authority, selected lock closure, exact
    seventeen-resource digest, local launcher/process/result schema authorities,
    and content-addressed UUIDv5/path. Reject missing/additional/reordered/mutable,
    symlink/nonregular/hardlinked/unsafe-mode/changed-during-read bytes and any
    pyproject/lock/resource/source drift.
  - >-
    The launcher is the sole code-manifest writer and build calculator. Through the
    accepted sidecar-free publisher, it may write only
    data/manifests/wyscout/v5/code/<digest>.code-manifest.json under caller-supplied
    exact manifest/staging roots after child-result and independently retained
    component validation. It must guard-read exact accepted v2 config bytes and use
    the two accepted logical no-LF digests, never their physical hashes or v1 values.
  - >-
    Only after immutable manifest readback, construct the exact PreBuildProjection
    with accepted authority/dependency/window/tenant/identity values and admitted
    code/environment/resource/lock values. Compute build_id only through
    build_id_for_projection(), construct only through invocation_from_projection(),
    and require projection_from_invocation() strict inverse equality. Return a
    frozen launch plan with exact code path, three layer paths, rebuild prefix and
    receipt path for a strict caller-supplied v4 run ID. Do not execute the absent
    rebuild or write any product, layer manifest, boundary, invocation receipt or
    run byte in this packet.
  - >-
    Tests must use isolated exact-root mirrors and the actual admission subprocess;
    prove two-run stable manifest/build determinism with different operational UUIDs,
    exact existing-manifest idempotency, no real-root writes, single build hash and
    v2 binding. Attack environment/input/result/frame/argv/descriptor/repository/
    lock/resource/component/proof/manifest/config/publisher/build/inverse/run/path
    substitutions plus symlink, race, unequal-existing and terminal-byte drift.
acceptance_checks:
