audit_requirements:
  - Verify every fixed hash before analysis and stop on drift.
  - >-
    Enumerate exactly the 23 root models in frozen order, exact serialized field
    order, field annotation/type/nullability/requiredness/default state, transitive
    named support models/enums/unions and list/fixed-tuple shapes.
  - >-
    Inspect the actual field/model validator bodies and adjacent accepted tests.
    For every validator, record the minimum declarative predicate obligations with
    exact operands/constants/classes of rejected substitution. Do not accept a
    validator name, code hash or prose label as a complete representation.
  - >-
    Enumerate which of the twelve Parquet roots contain CanonicalJsonValue,
    heterogeneous tuples, homogeneous sequences, nested structs, decimals and UTC
    timestamps, and the required accepted logical-to-Arrow mapping at each path.
  - >-
    Identify high-risk omission points the eventual independent producer review
    must attack, especially one-lineup-row semantics, rejected-field traversal,
    completeness/index bindings, identity reproduction, temporal cutoff,
    possession ordering, layer-manifest closure and receipt/result bindings.
  - >-
    Do not read a concurrently appearing wyscout_schema.py or its tests/return; this
    is an implementation-independent oracle, not a candidate review or authority.
definition_of_done:
  - Exact report-only census exists and contains no candidate verdict or schema bytes/digests.
acceptance_checks:
  - shasum -a 256 of every fixed input and both output reports
  - uv run python scripts/verify_local_only.py
deliverables:
  - Constraint census report.
  - Return using the repository template.
stop_conditions:
  - Fixed binding drift.
  - Need to choose/change a root, field, semantics, projection, dependency or architecture boundary.
  - Need to inspect the producer candidate, edit outside ownership, use Git/network/provider, or write product/aggregate/runtime data.
return_template: orchestration/templates/subagent_return.md
