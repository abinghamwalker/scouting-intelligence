stop_conditions:
  - A protected W06 expected output would need to be opened or reconstructed.
  - Review would mutate implementation, tests, config, orchestration, dependencies,
    Git or an external system, or require a network/public service.
  - Any Git command or repository/local-only/phase verifier would be required.
mandatory_return:
  - review/task ID and exact reviewed paths
  - exact commands/exits/test counts and independent probe results
  - findings ordered P0 through P3
  - explicit R3 finding and earlier R1/R2 closure outcomes
  - authn/authz, confidentiality/export, audit/concurrency/recovery,
    browser/accessibility and W06/protected-boundary outcomes
  - representative-user count/status
  - final PASS/FAIL and required rework
  - no Git/product/test/protected-output/external/participant-evidence confirmation
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
