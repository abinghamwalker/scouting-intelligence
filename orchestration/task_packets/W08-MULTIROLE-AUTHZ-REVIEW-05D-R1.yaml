deliverables:
  - Fresh P0/P1/P2/P3 findings with exact path/line, preconditions, impact and required
    correction; PASS only when no open security/confidentiality/authorisation/audit/
    accessibility/evidence-honesty finding remains.
  - Independently reproduce the R3 policy-true/route-404 case and prove route 200 for
    the legitimate multi-role owner, without disclosing unassigned/former/private or
    cross-tenant resources.
  - Independently prove read union for analyst+scout owner TEAM/OWNER_ONLY and
    approver+scout TEAM, plus ordinary-transition union for analyst+approver non-owner;
    prove scout-only current/unassigned/former and foreign-tenant matrices.
  - Inspect shared service/presentation action semantics for drift, special-target
    approve/hold/reject isolation, replay-link assignment preservation and any other
    role-presence action selector on the material W08 path.
  - Re-run the complete corrected focused suite and Bandit, and explicitly reconfirm
    every R1/R2/R3 closure, browser/accessibility automation, W06 wording, protected
    non-access and the 0/5 genuine-user status.
definition_of_done:
  - The independent exact probes, complete focused suite and Bandit pass; the report
    contains an explicit verdict and zero open findings required for PASS.
focused_checks:
  - uv run pytest -q tests/contracts/test_w08_workflow_contracts.py tests/security/test_w08_auth_audit.py tests/security/test_w08_workflow_access.py tests/security/test_w08_export_boundaries.py tests/security/test_w08_web_security.py tests/integration/test_w08_workflow.py tests/integration/test_w08_evidence_export.py tests/integration/test_w08_local_workflow_app.py tests/integration/test_w08_study_harness.py tests/e2e/test_w08_local_workflow_playwright.py
