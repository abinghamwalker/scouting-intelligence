requirements:
  - >-
    Preserve every frozen authority, candidate, predecessor, preimage,
    acceptance, review, archive, and product byte. Change only the focused
    helper/tests and R4 return.
  - >-
    Derive all 36 unique predicate pairs from the accepted possession-v2
    candidate. Derive potential resolution capability from exact predicate
    sequence semantics, not from `decision != UNMAPPED` alone and not from a
    copied substitute list.
  - >-
    A pair is potentially resolution-capable only if its accepted predicate can
    open/continue deterministic control, attach to a preceding resolved
    possession, or buffer to a following resolved same-period possession.
    `UNMAPPED`, `NON_CONTROL_ADMIN`, and `UNASSIGNED` attachment semantics are
    structurally ineligible.
  - >-
    Prove exact partition cardinality 28 capable / 8 structurally ineligible.
    The ineligible set is exactly `(2,23)`, `(2,24)`, `(2,25)`, `(2,26)`,
    `(4,40)`, `(5,51)`, `(9,90)`, `(9,91)`.
  - >-
    Directly compose representative `CONTROL`, `RESTART`, attachable
    `DEAD_BALL`, and buffered `CONTESTED` sequences against the accepted
    same-period resolver and prove eligible results. Compose the four
    additional structurally ineligible pairs with valid surrounding control and
    prove `INELIGIBLE_UNMAPPED`.
  - >-
    Feature applicability still requires exact `ELIGIBLE_RESOLVED`, strict
    selector types, positive team source ID, and membership in the derived
    28-pair capable set. Keep the exact three feature inputs; do not add
    attachments, sequence state, tags, raw fields, names, or labels.
  - >-
    Retain all R1-R3 wrong-type, coordinate, unknown-pair, UNMAPPED, team, and
    state negative cases.
  - >-
    Start and finish on the retained inventory using shell-only inventory, root
    uv --locked --no-sync, PYTHONDONTWRITEBYTECODE=1, and Python -B. Do not
    clean, repair, sync, install, or run unsuppressed Python.
  - >-
    Use apply_patch only for the two exact allowed paths. Do not run Git,
    delegate, self-approve, or begin acceptance, cross-authority, identity,
    Bronze, Silver, Gold, build, model, product, network, cloud, container,
    endpoint, hosted CI, or deployment work.
