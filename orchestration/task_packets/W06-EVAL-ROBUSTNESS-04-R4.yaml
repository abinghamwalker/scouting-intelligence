required_changes:
  - >-
    Add pure canonical contract helpers that derive each expected cohort's aggregate
    RankedObservation rows from the specification inventory and exact observation IDs.
    Use the same helpers in the executor and StressTestResult validator. Require every
    cohort ranked_rows to equal the derived rows exactly. Derive and validate every
    per-query MetricResult.input_digest from its embedded row and k, and derive the
    aggregate MetricResult.input_digest from embedded per-query result digests, rows,
    metric and k using the accepted core canonical payload.
  - >-
    In StressTestResult, map each StressComparison endpoint to its named cohort/query.
    Require left_ranking/right_ranking to equal those cohort rows in canonical digest
    orientation, derive common candidates, and require comparison left/right input
    digests to equal the canonical ordered rankings. Fix executor orientation if needed.
    Exact stress witness 013da049ef32c63d7bf5d40e825b7d377000cca70fe8b6c86fb2becb05797598
    and equivalent stale/foreign child substitutions must reject.
  - >-
    Replace ControlInput bare authority_kind+digest with an embedded
    ControlBaselineAuthority object binding kind, implementation/governed evidence
    class, authority ID, source artifact digest, method/definition digest and exact
    baseline ranking digests. ControlInput must validate exact authority-to-control and
    authority-to-row relations.
  - >-
    Persist the exact derived null rows plus per-query baseline/null results in computed
    DeterministicControlResult. Use shared canonical helpers to derive label shuffles,
    per-query and aggregate input identities, exact comparison roster and rank input
    digests from ControlInput, protocol seed and k. Normal construction must reject exact
    control witness 75b2bc182bbd1e72816de51ce7516e1cf1ee2475328aa49cbabca80485699e1b,
    arbitrary authority fd55e1eeaf2c977f0aa38156af350fb98f1b56a8b77d50aca10681cec86a74ba
    and all equivalent stale child substitutions.
  - >-
    Add typed INCOHERENT_LABEL_EVIDENCE and INSUFFICIENT_COMMON_CANDIDATES deficit kinds.
    Derive them from every expected cohort and required cohort comparison before
    execution. Otherwise sufficient incoherent/common-candidate specifications must
    return a valid exact unsupported StressTestResult, never raise an empty-deficit
    validation error. Pin the R3 reviewer specifications as rejecting/unsupported
    semantic regressions.
  - >-
    Extend public-robustness-v1.json with an exact sparse unsupported population, the
    pair-absence authority, content-addressed typed control authority objects, failure
    cases and an expected-identities block. Tests must parse every field, execute both
    computed and unsupported stress/control/applicability paths, and assert literal
    fixture SHA plus exact stress/control/pair/deficit/failure/applicability identities.
    A material observation/authority mutation must change the corresponding identity or
    fail validation.
  - >-
    Add direct normal-constructor regressions for all R2/R3 exact witnesses and child
    substitutions. Preserve every retained closed behavior and existing focused W06
    contract/metric test unchanged.
deliverables:
  - Narrow contract/executor lineage correction and typed deficits.
  - Fully authoritative computed-plus-unsupported public fixture and exact regressions.
  - Mandatory return at reports/reviews/W06/returns/W06-EVAL-ROBUSTNESS-04-R4.md.
definition_of_done:
  - Exact R3 stress/control witnesses reject under normal construction.
  - All computed metric/comparison children are input-reproducible from the same persisted object.
  - Incoherent/common-candidate evidence returns exact typed unsupported state.
  - Fixture bytes drive and pin every required identity without fabricated human evidence.
  - Focused accepted W06 checks remain green.
acceptance_checks:
  - uv run --no-sync pytest -p no:cacheprovider -q tests/contracts/test_w06_evaluation_contracts.py tests/unit/test_w06_evaluation_metrics.py tests/contracts/test_w06_robustness_contracts.py tests/unit/test_w06_robustness.py
  - uv run --no-sync ruff check src/scouting/contracts/evaluation.py src/scouting/contracts/__init__.py src/scouting/evaluation tests/contracts/test_w06_evaluation_contracts.py tests/unit/test_w06_evaluation_metrics.py tests/contracts/test_w06_robustness_contracts.py tests/unit/test_w06_robustness.py
  - uv run --no-sync mypy src/scouting/contracts/evaluation.py src/scouting/evaluation
  - uv run --no-sync lint-imports
  - shasum -a 256 tests/fixtures/w06/public-robustness-v1.json
  - test -s reports/reviews/W06/returns/W06-EVAL-ROBUSTNESS-04-R4.md
stop_conditions:
