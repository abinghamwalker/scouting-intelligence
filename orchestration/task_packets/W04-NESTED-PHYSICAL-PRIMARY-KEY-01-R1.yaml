requirements:
  - Verify every fixed binding and preserve all logical/Arrow schema content and aggregate bytes.
  - >-
    Add an exported exact role-to-physical-primary-key-path function for every W04
    serialized product role. A path is a nonempty tuple of canonical field-name
    segments and may descend only through fixed named STRUCT children, never lists,
    indices, wildcards, aliases, null children or inference.
  - >-
    Freeze at minimum: Bronze known source-row identity; Bronze rejected-field
    source-row identity plus json_path; Action action_id; Lineup lineup_stint_id;
    Possession possession_id; Fact tenant_context.tenant_id plus the accepted
    top-level logical key fields; and Gold tenant_context.tenant_id plus the
    accepted top-level logical key fields. Require every path exists in the exact
    accepted projection and ends at a non-null scalar str/int field.
  - >-
    Extend encode_w04_wyscout_product_parquet so primary_key_fields accepts exact
    dotted physical struct paths (retaining simple top-level compatibility),
    validates each path against the explicit descriptor/Arrow schema, resolves the
    same path in projected canonical contract rows, and compares exact type/value
    with supplied scalar keys. Preserve key arity, type homogeneity, uniqueness,
    canonical ordering and every semantic/physical digest formula.
  - >-
    Reject malformed/empty/double-dot/list/nullable/non-scalar/missing paths,
    top-level fallback for an absent nested key, booleans, nulls, type drift,
    duplicate paths, duplicate keys and row/key reordering. Prove the exact
    repeated rejected-field population can be uniquely ordered only by the frozen
    source-row/json-path key and that fact/Gold nested tenant keys encode/read back.
  - >-
    Rerun schema aggregate/materialization and require byte-for-byte equality of
    both accepted v2 preimages and digests; this correction must not alter schema
    root content or logical product-contract primary-key labels.
