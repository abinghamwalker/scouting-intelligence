deliverables:
  - Fresh code- and evidence-grounded P0/P1/P2/P3 findings with exact file/line,
    exploit or failure preconditions and required corrections; explicit PASS or FAIL.
  - >-
    Reproduce both R2 P1 probes and the R2 P2 probe: scout-only pre-approval queue and
    detail non-disclosure; approved brief metadata without replay/link/candidate
    disclosure until exact current assignment; former-assignment removal; mixed-role
    own-draft access through the analyst grant; cross-tenant and OWNER_ONLY denial.
  - Review the complete explicit owned-action set, TEAM and OWNER_ONLY semantics, and
    ensure multi-role grants compose by union without role-presence overrides.
  - >-
    Re-prove all R1 P1 closures: server-controlled evidence origin including hostile
    form override and DB/render/audit/export; independent byte-tamper denial for
    inventory/read/create/revoke; receipt binding and mutation detection.
  - Re-review IDOR/cross-object access, role escalation, session expiry/revocation/
    rotation/fixation/CSRF, private/team visibility, privileged export, sensitive
    leakage, path/input/file handling, replay/candidate allowlist, concurrency and
    recovery.
  - Re-review keyboard/semantic/responsive accessibility, fixed W06 wording,
    protected-output non-access and synthetic-versus-human evidence honesty.
  - Explicitly state that synthetic automation is not representative-user evidence
    and whether five genuine authorised reviewed participant records exist.
definition_of_done:
  - The full corrected focused suite and Bandit pass and the report gives an explicit
    verdict; any P0/P1 in security, confidentiality, authorisation, accessibility,
    evidence honesty or audit integrity requires FAIL.
focused_checks:
