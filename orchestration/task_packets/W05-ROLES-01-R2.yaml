requirements:
  - >-
    Extend FootballResponsibilityTaxonomy additively with the five already accepted
    semantic fields canonical_order, expert_validation_status,
    external_expert_evidence, claim and exemplar_notice. Give them strict contract
    types; the role loader continues to enforce the exact W05 v1 values
    responsibility_code_role_code_source_label, NOT_PERFORMED, empty evidence,
    synthetic_development_taxonomy_only and the accepted exemplar notice.
  - >-
    The existing digest_for_payload must bind those fields alongside ID/version,
    responsibilities, roles and mappings. The unchanged full config must reproduce
    taxonomy digest 59688694131370f42b24a0dd00b609d08254ec945df2ba4352055c8391983097
    through the shared public method. Do not introduce a second taxonomy/config digest
    or change accepted config/fixture bytes unless exact canonical recomputation proves
    it unavoidable; if it is unavoidable, stop rather than choosing a new identity.
  - >-
    Replace the RoleTaxonomy loader's model_construct bypass with normal
    FootballResponsibilityTaxonomy validation using every declared field and the
    canonical digest. Catch validation failure as RoleTaxonomyError. The returned
    contract must revalidate from model_dump(mode=python), and
    digest_for_payload(contract.model_dump(mode=json)) must equal its taxonomy_digest.
  - >-
    Update the shared contract test taxonomy fixture to supply explicit synthetic-only
    claim fields before computing its digest. Retain all existing contract truth tests.
    Add role tests for public contract round-trip, exact digest recomputation and failure
    of changed claim/exemplar/expert fields even after all candidate digests are re-signed.
  - >-
    Retain the exact eight responsibilities, six roles, mappings, fixture alignment,
    probabilities, context behavior, fail-closed inputs, no-permanent-label boundary and
    accepted taxonomy/fixture identity pins. No model/artifact/serving implementation is
    in scope; later model work must source its pins from this validated contract object.
deliverables:
  - Additive full-semantic shared taxonomy contract and normally validated role loader.
  - Public round-trip/digest and re-signed claim substitution tests.
  - Complete mandatory R2 return with old/new physical byte comparison.
definition_of_done:
  - The exact R1 public revalidation probe returns a valid contract with digest 596886...
    and no model_construct call remains in the role package.
  - Config and role fixture logical/physical bytes are unchanged; all accepted role and contract tests pass.
acceptance_checks:
  - uv run ruff format --check src/scouting/contracts/m0.py src/scouting/roles tests/contracts/test_w05_m0_contracts.py tests/unit/test_w05_roles.py
  - uv run ruff check src/scouting/contracts/m0.py src/scouting/roles tests/contracts/test_w05_m0_contracts.py tests/unit/test_w05_roles.py
  - uv run mypy src/scouting/contracts/m0.py src/scouting/roles
  - uv run pytest -q tests/unit/test_w05_roles.py tests/unit/test_w05_features.py tests/contracts/test_w05_m0_contracts.py tests/contracts/test_foundation_contracts.py
  - uv run lint-imports
  - uv run python scripts/verify_local_only.py
stop_conditions:
  - Existing accepted taxonomy or fixture bytes cannot remain unchanged under one valid digest.
  - Any W04, feature, dependency, external/provider, model/serving, destructive, rights or claim change is required.
  - Required work falls outside allowed_paths.
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
self_approval: forbidden
