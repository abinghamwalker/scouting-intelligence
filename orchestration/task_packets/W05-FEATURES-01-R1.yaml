schema_version: 1
task_id: W05-FEATURES-01
phase_id: W05
revision: R1
state: IMPLEMENTED
objective: >-
  Implement the additive versioned W05 feature registry, exact W04 real-data bridge,
  cryptographically separate synthetic-development family, deterministic materializer
  and adversarial state/temporal fixtures without changing W04 authority.
depends_on:
  - REVIEW-W05-CONTRACTS-TRUTH-03-R1:ACCEPT
