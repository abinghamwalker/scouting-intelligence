requirements:
  - >-
    Create one self-verifying JSON registry collection whose canonical digest excludes
    only its own digest and whose two evidence families have separate IDs, versions,
    ordered schemas and content digests. Canonicalisation is compact UTF-8 JSON with
    ensure_ascii=true, sorted mapping keys and list order preserved. Reject unknown
    keys, duplicate names/order positions, digest drift and non-contiguous order.
  - >-
    The W04_REAL_GOVERNED bridge must reference, never copy or reinterpret, the
    unchanged W04 candidate ID/digest, decision ID/digest and exact-four descriptor
    digest from the accepted M0 contracts. Its only admitted names, in order, are
    action_count, coordinate_known_action_count, match_count and
    resolved_possession_action_count. Types are int64 counts, units are actions or
    matches as applicable, denominator is NONE, imputation is FORBIDDEN, and only
    accepted Gold rows with strict source/dependency lineage may enter. Minutes,
    rates, per-90, role, outcome/value and other unsupported real fields stay
    suppressed or unavailable exactly as W04 declares; no W04 bytes are changed.
  - >-
    The SYNTHETIC_DEVELOPMENT family must be visibly and cryptographically distinct,
    carry provider_source=NONE, production_evidence=false,
    protected_evaluation=false and claim=constructed_W05_development_only, and use
    exactly this ordered schema: synthetic_progression_actions_per_90,
    synthetic_final_third_entries_per_90,
    synthetic_chance_creation_actions_per_90,
    synthetic_defensive_disruptions_per_90,
    synthetic_ball_retention_ratio, synthetic_aerial_involvements_per_90. It must not
    use Wyscout in its identity, descriptions, lineage or claims.
  - >-
    Bind a separate ordered synthetic-only metadata-control schema inside that family
    for synthetic_position_code, synthetic_age_years and synthetic_elapsed_minutes.
    Give it its own schema hash and explicit control_only=true status. These inputs
    support the declared metadata baseline and filters only; they are not silently
    blended with the six resemblance features and are never admitted for W04 real
    evidence, where elapsed minutes remains suppressed.
  - >-
    Define for every feature its football-language definition, strict numeric output
    type, unit, exact numerator inputs, denominator inputs/formula, order, missing
    policy, zero policy, suppression policy, unavailable policy, imputation=FORBIDDEN,
    as-of available-at rule and dependency-lineage rule. Per-90 denominators use only
    explicitly synthetic elapsed minutes; the ratio uses explicitly synthetic
    attempts. No invalid/missing denominator becomes zero or an imputed value.
  - >-
    Implement a deterministic registry loader/admitter and synthetic materializer
    using the additive W05 FeatureValue contract. It must return ordered values and
    identity hashes, reject schema/evidence-class substitution, ignore no unknown
    fields, use Decimal or another documented canonical calculation before one
    documented float conversion, and never read provider data.
  - >-
    Materialization must enforce available_at < feature_cutoff_ts for every admitted
    dependency and retain exact source/dependency lineage identity. A post-cutoff
    record, altered manifest, reordered features or W04/synthetic identity swap must
    fail closed rather than silently drop into a different result.
  - >-
    Add one self-verifying JSON fixture with at least 18 complete deterministic
    synthetic player-window rows spanning at least three deliberately constructed
    development peer groups plus explicit edge rows for unavailable, suppressed,
    missing and observed zero. Each complete row carries fixed UUID, position, age,
    synthetic elapsed minutes, cutoff, observed/available timestamps, raw numerator
    inputs, ordered expected FeatureValues, constructed_development_peer_group and
    dependency identity. The fixture must state that peer groups are development
    construction labels, not recruitment outcomes, external expert labels or W06
    protected evidence.
  - >-
    Tests must reproduce registry/fixture digests and exact bytes, feature order/hash,
    formulas, state distinctions, W04 exact-four closure, suppression-not-zero,
    no-imputation, cutoff-equality and post-cutoff rejection, lineage
    substitution and deterministic repeated materialization.
deliverables:
  - Versioned self-verifying feature registry and exact W04/synthetic separation.
  - Deterministic typed feature loader/materializer and development fixture.
  - Focused adversarial tests and mandatory return.
definition_of_done:
  - W04 real admission is exact-four and all broader inputs are visibly synthetic-only.
  - Unavailable, suppressed, missing and zero remain distinct through reload.
  - No accepted W04 authority, Gold output, evidence or claim is modified.
acceptance_checks:
  - uv run ruff format --check src/scouting/features tests/unit/test_w05_features.py
  - uv run ruff check src/scouting/features tests/unit/test_w05_features.py
  - uv run mypy src/scouting/features
  - uv run pytest -q tests/unit/test_w05_features.py tests/contracts/test_w05_m0_contracts.py tests/contracts/test_w04_supported_feature_authority.py
  - uv run lint-imports
  - uv run python scripts/verify_local_only.py
stop_conditions:
  - Any need to mutate or reinterpret accepted W04 authority/evidence/Gold bytes.
  - Any materially different feature/product behaviour or weakened temporal/evidence guarantee.
  - Any new dependency, external/provider access, credential, service, deployment/publication, destructive action or secret.
  - Required work falls outside allowed_paths.
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
self_approval: forbidden
