requirements:
  - Verify every fixed hash and stop on drift before editing.
  - >-
    In the existing equal-final replay branch, after validator and final recheck and
    after the fresh immutable-final readback, perform a final descriptor-relative
    no-follow checkpoint of the exact serializer-owned staged name. Bind the read to
    the originally fixed staging root identity and originally opened staging-parent
    identity. Return replay success only when that exact name is still absent.
  - >-
    A newly appeared regular file, symlink, hardlink, FIFO, directory, unsafe mode or
    link count, disappeared/replaced staging parent, or any other non-absent state
    must raise with no result. Retain both the pre-existing final and raced evidence;
    do not unlink, chmod, repair, replace or reinterpret it.
  - >-
    Add an isolated equal-final replay test creating the exact .partial during
    final_recheck and require fail-closed/no result with both final and staged bytes
    unchanged. Cover nonregular/link variants and staging-parent rename/replacement
    at the same final checkpoint. State the accepted same-trust-domain residual: a
    transient appearance entirely between checkpoints cannot be cryptographically
    excluded, but an artifact present at the final checkpoint is never success.
  - >-
    Preserve the exact three-name root vocabulary, all R1/R2 path/mode/link/race/
    recheck/replay rules, both post-link fsync evidence states, no-sidecar/no-replace
    behavior and every frozen/evidence byte. Add no real product path, dependency,
    public export, Git, provider/network or infrastructure action.
