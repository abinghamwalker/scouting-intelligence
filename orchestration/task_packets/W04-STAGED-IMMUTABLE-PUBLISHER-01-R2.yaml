findings:
  - id: W04-PUBLISHER-R1-P1-ROOT-NAME-CLOSURE
    priority: P1
    evidence: >-
      The accepted vertical-slice audit states that the publisher maps only the
      exact names wyscout-working, wyscout-manifests and w04-rebuild-runs. R1
      instead admits every value matching a generic root-name regular expression,
      and its positive tests use the unauthorized name silver.
  - id: W04-PUBLISHER-R1-P2-POST-LINK-FAILURE-COVERAGE
    priority: P2
    evidence: >-
      R1 covers unlink failure after the hard link, but does not independently
      target final-directory fsync failure after link creation or staging-directory
      fsync failure after staged-name unlink. Those state boundaries must be
      executable and fail closed before independent review.
requirements:
  - Verify every fixed hash and stop on drift before editing.
  - >-
    Replace the generic admitted root-name vocabulary with exactly the three
    literals wyscout-working, wyscout-manifests and w04-rebuild-runs. A non-empty
    subset of those exact names is permitted so one bounded writer need not receive
    unrelated roots; every other string/type must fail before directory or file write.
  - >-
    Update every positive temporary-root test to use an authorized exact root name,
    prove all three authorized names can be declared, and prove canonical-looking
    aliases including silver, bronze, gold, manifests, runs and arbitrary valid
    tokens fail before write. Do not hard-code real repository absolute paths into
    the testable publisher; downstream wiring remains responsible for exact local
    root locations and tests use tmp_path mirrors only.
  - >-
    Add targeted fault injection after hard-link creation for the final-parent fsync
    and after staged-name unlink for the staging-parent fsync. Require no success
    result, no replacement of any pre-existing final, and exact observable retained
    evidence/link-count state for each boundary. Do not weaken R1's earlier staged
    evidence, replay, no-follow, mode, race, cross-device or readback guarantees.
  - >-
    Preserve every other R1 behavior and all frozen inputs byte-identically. Add no
    sidecar, real product path, dependency, public export, Git, provider/network or
    infrastructure action.
