  accepted R20 evidence while defining an acyclic contract-digest preimage,
  exact conservative POC feature roster, evidence-preserving v2 field and
  possession supersession routes, strict integer-only action subevent mapping,
  and cross-authority composability gates. Do not implement any product layer.
