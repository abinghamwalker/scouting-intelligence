deliverables:
  - Retain every complete R1 deliverable from R1 for immutable role briefs, approved-version retrieval links, shortlists/comments and versioned observations.
  - Permit `rejected -> longlist` only as revision `N+1` on the same shortlist_entry_id, same shortlist/player/brief/retrieval-link/owner identity and matching optimistic lock.
  - Preserve the rejected revision and controlled reason unchanged; require a non-empty reconsideration reason and attributable changed_by actor on the new longlist revision.
  - Continue to reject a second shortlist entry for the same shortlist/player and every attempt to rewrite pinned identity or evidence.
  - Prove stale reconsideration, illegal duplicate creation and audit failure produce no partial revision, container update or receipt; retry appends exactly one revision and receipt.
definition_of_done:
  - The complete packet suite passes and no shared contract/migration change is needed.
  - Synthetic fixtures remain synthetic_automated_test and the mandatory return is complete.
focused_checks:
  - Rejected-to-longlist same-entry revision history, identity preservation and reason attribution.
  - Duplicate, stale, audit-failure rollback and idempotent recovery witnesses plus the complete R1 workflow suite.
acceptance_checks:
  - uv run ruff format --check src/scouting/workflow/r1.py src/scouting/observations/r1.py tests/integration/test_w08_workflow.py tests/security/test_w08_workflow_access.py
  - uv run ruff check src/scouting/workflow/r1.py src/scouting/observations/r1.py tests/integration/test_w08_workflow.py tests/security/test_w08_workflow_access.py
  - uv run mypy src/scouting/workflow/r1.py src/scouting/observations/r1.py
  - uv run pytest -q tests/contracts/test_w08_workflow_contracts.py tests/integration/test_w08_workflow.py tests/security/test_w08_workflow_access.py tests/security/test_w08_auth_audit.py
stop_conditions:
  - The narrowed same-entry revision invariant still cannot be represented without a shared contract or migration change.
  - A dependency, external service/model, protected-output access, destructive action or forbidden-path edit is required.
  - A correction would weaken history, pinned identity, deny-by-default access, audit atomicity or evidence honesty.
mandatory_return:
  - task ID/revision and one-sentence narrowed objective
  - exact changed-file list
  - behaviour and invariant proof
  - exact commands, exit statuses and concise results
  - evidence paths and identifiers
  - residual risks and follow-ups
  - confirmations of no Git operations, no dependency/lock change and no edits outside allowed_paths
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
