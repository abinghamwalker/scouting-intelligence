findings:
  - id: W04-BUILD-R1-P1-ADMISSION-PROOF-NONBINDING
    priority: P1
    evidence: >-
      R1's positive fixture decodes only schema_version, repository_code_sha256 and
      environment_digest. The model accepts that three-key object, never requires
      the exact twenty stable environment-component values, never derives
      environment_digest from them, and never compares each component proof's
      value_json_sha256 to the decoded component value. This contradicts R20
      Sections 8.0.6 and 8.9.
  - id: W04-BUILD-R1-P1-GOLD-COMPETITION-WIDENING
    priority: P1
    evidence: >-
      R1 admits any UUIDv5 competition in a Gold path and its positive fixture uses
      11111111-1111-5111-8111-111111111111. The authorized exact product path fixes
      competition_id cb5c5317-fa4a-571e-93dc-ef6ce482eab7.
  - id: W04-BUILD-R1-P1-MANIFEST-CLOSURE-OMISSION
    priority: P1
    evidence: >-
      R1 validates boundary physical bytes but can declare COMPLETE without receiving
      the three complete manifest physical readbacks, reproducing each summary's
      physical and sole two-key semantic digest, reconciling Bronze<-Silver<-Gold
      parents, or deriving the one Gold boundary population from the accepted Gold
      manifest. The standalone helper test does not compose those authorities.
requirements:
  - Verify every fixed hash and stop on drift before editing.
  - >-
    Preserve the exact existing five-window, season, five-authority, five-dependency,
    25/25 one-hash inverse, 15/9 receipt, and eight result-root field rosters. Add no
    ninth result role, schema root, aggregate, writer or public export.
  - >-
    Close the decoded w04-code-environment-admission-v15 stable manifest at the
    build-contract boundary using the exact R20 stable fields. Its environment
    component is exactly the twenty COMPONENT_KEYS values, with selector as the
    closed canonical value, uv_version as the exact canonical string, and every
    digest-valued component as lowercase SHA-256. Recompute environment_digest from
    the exact twenty-key canonical component object; reject missing, additional,
    reordered, mistyped, null, operational-only, stale-version or noncanonical data.
    This may use internal/helper models but must not create a ninth result/root role.
  - >-
    For every component proof, recompute value_json_sha256 from the corresponding
    decoded component value and require exact equality in the fixed twenty-row order.
    Keep the exact proof-array digest and bounded evidence-row-count grammar; expose
    a pure validation seam for independently recounted expected row counts if those
    counts are not derivable from the stable component value itself. Caller-supplied
    proof values alone are insufficient.
  - >-
    Replace the generic Gold competition UUIDv5 path segment with the sole exact
    competition_id cb5c5317-fa4a-571e-93dc-ef6ce482eab7. Reject every other UUID,
    including the former R1 fixture, while preserving the exact build/window/cutoff path.
  - >-
    Extend pure receipt closure to require exactly three Bronze/Silver/Gold complete
    manifest physical byte streams and their already closed-schema-validated parsed
    objects. For each, require canonical JSON plus exactly one terminal LF, parsed
    byte equality, physical SHA-256/size equality, exact layer/build/path/completion
    bindings, and the sole R4 two-key complete-manifest semantic equality. Do not
    implement a second schema or semantic derivation.
  - >-
    Reconcile exact parents after all three manifests pass: Bronze none; Silver one
    exact Bronze physical parent; Gold one exact Silver physical parent. Derive the
    exact one-entry GOLD_PLAYER_WINDOW relative-path sequence from the validated Gold
    manifest in manifest order and require exact sequence-and-set equality with the
    one boundary summary and receipt. No sort, filter, dedup, caller population
    witness, fallback or recovery is permitted.
  - >-
    Add composability tests that mutate each of the twenty decoded component values,
    each proof digest/order/count, all three summary physical/semantic values, each
    parent field/order/cardinality, Gold manifest entry role/path/cardinality, exact
    competition UUID, and downstream receipt/child hashes. Every substitution must
    fail at its earliest authority boundary even after downstream rehash.
  - >-
    Keep the module standard-library plus Pydantic only and side-effect free. Preserve
    every frozen input and R1 evidence byte. Add no product/control/data/run write,
    dependency, Git, provider/network or external-infrastructure action.
