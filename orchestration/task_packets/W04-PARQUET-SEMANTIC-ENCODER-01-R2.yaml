requirements:
  - Verify all fixed hashes before editing and stop on drift.
  - >-
    Derive a canonical contract-JSON object from each Arrow row under its explicit
    field type and require its canonical bytes to equal the supplied contract row
    bytes exactly before hashing or encoding. Key-only comparison is insufficient.
  - >-
    The closed projection supports only null plus exact Arrow Boolean, signed/unsigned
    integer, finite float, UTF-8 string, decimal, timestamp[us, tz=UTC], list/large-
    list/fixed-size-list and struct values recursively. Decimal projects to its exact
    fixed-point string. UTC timestamp projects to RFC3339 with `Z`, preserving present
    microseconds and omitting a zero fractional part. Reject naive/non-UTC timestamps,
    binary, date/time/duration, dictionary, map, union, extension and all other types.
  - >-
    Require contract-row object keys to equal Arrow schema field names exactly. Require
    every primary-key field to exist in the Arrow schema. Derive each key from the
    projected Arrow row and compare it with the caller key using exact type identity
    plus value equality; Boolean/integer and string/integer confusion must fail.
  - >-
    Add adversarial regressions for unchanged-key/non-key divergence, Arrow-key
    divergence, string-vs-integer keys, Boolean-vs-integer keys, absent Arrow key,
    missing/extra contract field, non-UTC/naive timestamps, decimal/list/struct
    correspondence and an unsupported Arrow type.
  - Preserve both valid fixed vectors, all R20 physical settings, semantic framing and generic serializer bytes/behavior.
definition_of_done:
  - R1 P1 is closed with exact full-row correspondence and no new P0-P2 finding.
  - Existing plus new focused tests and legacy guarded-storage suite pass.
acceptance_checks:
  - uv run ruff format --check src/scouting/storage/formats.py tests/unit/test_w04_wyscout_product_formats.py
  - uv run ruff check src/scouting/storage/formats.py tests/unit/test_w04_wyscout_product_formats.py
  - uv run mypy src/scouting/storage/formats.py tests/unit/test_w04_wyscout_product_formats.py
  - uv run pytest -q tests/unit/test_w04_wyscout_product_formats.py tests/unit/test_guarded_storage.py
  - uv run bandit -q -r src/scouting/storage/formats.py
  - uv run lint-imports
  - uv run python scripts/verify_local_only.py
master_only_checks:
  - git diff --check
  - git remote
stop_conditions:
  - Exact row correspondence cannot be implemented additively without a new dependency, product contract change or valid-vector change.
  - Any product/control write, Git, provider/network, cloud/container/CI/endpoint/remote/deployment action is required.
