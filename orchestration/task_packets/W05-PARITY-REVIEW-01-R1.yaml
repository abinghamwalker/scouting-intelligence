schema_version: 1
task_id: W05-PARITY-REVIEW-01
phase_id: W05
revision: R1
state: DISPATCHED
objective: >-
  Independently prove W05 training-serving and batch-request parity, artifact reload
  determinism, exact evidence lineage and the declared synthetic M0 control comparison.
depends_on:
  - REVIEW-W05-SERVING-01-R2:ACCEPT
  - W05-SERVING-REVIEW-01-R2:PASS
assigned_role: independent_verifier
risk: high
read_first:
