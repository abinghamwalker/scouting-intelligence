requirements:
  - >-
    Read every listed input fully, recompute every fixed digest, inspect all
    4,007 implementation/test lines, and reproduce the exact packet checks.
    Producer assertions and 370 passing tests are evidence, not approval.
  - >-
    Reproduce every R1 direct-constructor failure and prove it now rejects:
    raw-kind state forgery; non-admitted subevents and rejected-field drift;
    zero/negative/bool source IDs; decimal exponent/nonfinite overflow; exact
    authority clock and lineage drift; optional coverage proof and fail-closed
    applicability; manifest build/parent/schema/partition drift; Gold/fact
    reconciliation; and source/tenant/rights/ordinal/family drift.
  - >-
    Challenge new invariants independently for equality/coercion traps,
    circular digest or lineage dependencies, mutable or excluded proof data,
    feature-count double counting, cross-player/match/window leakage, malformed
    raw measurements, unsafe parent paths, incomplete classification, authority
    aliases, stale clocks, ordinal off-by-one, Decimal boundary errors, and
    constructor/factory inconsistency.
  - >-
    Verify the correction remains exactly four supported features and creates
    no serializer, product byte, manifest file, receipt, runtime, build,
    dependency, architecture revision, provider access, or external service.
  - >-
    Write only the two allowed review artifacts. Include exact implementation,
    test, return, authority and preimage identities; exact commands/results;
    one section per R1 finding; every new P0-P2 finding; recommendation; and
    scope confirmation. PASS requires zero open P0-P2 findings; otherwise
    REWORK with exact reproducible evidence.
definition_of_done:
  - Every R1 finding is independently closed or returned with exact evidence.
  - Every new P0-P2 finding is reported.
  - All reviewed and authority bytes remain unchanged.
  - Exact focused/static/security/local-only checks complete.
