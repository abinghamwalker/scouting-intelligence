  - exact boundary parity and three-parent outcomes
  - exact fixture identities and SHA values
  - exact focused commands/statuses/results
  - remaining P0/P1 risk or none
  - implementation-only/no-fabricated-expert boundary confirmation
  - no Git/dependency/protected/external/tuning/out-of-scope confirmation
return_template: orchestration/templates/subagent_return.md
