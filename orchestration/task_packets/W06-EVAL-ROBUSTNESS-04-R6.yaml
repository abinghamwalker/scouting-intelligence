objective: >-
  Close the final single-core P1 by consolidating ranking metric and bootstrap
  calculations into one dependency-safe pure implementation called by general
  evaluation, robustness production and owning validators.
depends_on:
  - W06-EVAL-ROBUSTNESS-REVIEW-04-R5:ACCEPTED_REWORK_VERDICT
assigned_role: implementation_engineer
risk: high
bounded_scope:
  retained_without_reopening:
    - accepted metric formulas, supported metrics and bootstrap method
    - exact R3/R4 stress, control, authority, fixture, deficit and applicability closures
    - exact three numeric-child rejection behavior
    - one shared rank-comparison derivation
  exact_open_class:
    - duplicate live ranking metric and bootstrap calculation paths
  convergence_rule: >-
    This is a mechanical single-root consolidation. Create no new policy, architecture
    authority, dependency or metric semantics. Representation adapters and contract
    wrapping may remain separate; value, status, sufficient-statistic, resampling,
    percentile and identity calculations must have one live source.
