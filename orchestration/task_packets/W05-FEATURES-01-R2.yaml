    an exact-four descriptor, and insert Wyscout/production/expert language into a
    synthetic descriptor; recompute every affected schema, family, root or fixture
    digest and canonical byte sequence. Every fully re-signed attack must reject for an
    accepted-identity mismatch. Preserve normal exact canonical reload.
  - >-
    Bind W04 admission to the sole retained accepted research-only Gold product rather
    than trusting caller labels. Exact accepted identities are build
    b1f1a9135e307b115fd1d00f19dae7951993765ee5ac1fb5d5afeb245fdc7b79,
    Gold manifest physical SHA-256
    08de1349a532c3f455d792ee56aafc3d8c587828bc9934dc7f77a58a71c90068,
    Gold product physical SHA-256
    6e49b4322c766352fdc427b8d35d73ddaed036d0bd19f1d65435fe3a72edcd17,
    Gold product semantic SHA-256
    f1751b4f1ff7911ad339fa1954cd5c88483fc09c733547dba87d7aa301c1bffa,
    dependency lineage
    ded9ae0a3bece552eb047e005809837871a0ccd2cf76ead47e33abcb9288ea9d,
    player be8da881-2b15-513f-978f-6bb3865bc8e2, competition
    cb5c5317-fa4a-571e-93dc-ef6ce482eab7, season
    4696aa1f-b512-5d18-af79-33cf031455cf and window definition
    a0af8d56-e41d-5467-b46e-82887c4861e0. Also pin the exact manifest relative path,
    product relative path, one-row count, schema hash, 2017-08-11T18:45:00Z snapshot,
    2026-07-31T14:15:26Z availability watermark, cutoff and research_only
    applicability from the unchanged accepted W04 bytes.
  - >-
    W04 dependency admission must equal the complete ordered five-dependency envelope
    in the accepted Gold manifest, including kind, UUID, lowercase SHA-256 digest,
    observed_at and available_at, and must recompute to the accepted lineage hash.
    Validate every digest as exactly 64 lowercase hexadecimal characters. Retain strict
    available_at/observed_at before cutoff. Do not read provider or Gold files at
    materialization time and do not copy, mutate or reinterpret an accepted W04 byte.
  - >-
    Pin and require the exact accepted four values (2, 2, 1, 2), in accepted feature
    order, for that sole one-row product. Reject a different player, product/manifest
    identity, clock, applicability, dependency, reordered dependency, count or
    caller-supplied state even if the attacker recomputes every self-digest. The W04
    public function remains an admission bridge for a supplied authenticated projection;
    it never opens provider/product data itself.
  - >-
    Set production_evidence=false and protected_evaluation=false for both evidence
    families. Make the W04 claim explicitly accepted-four-count, resemblance-only and
    research-only. Update loader expectations, all affected family/root/fixture digests
    and tests. No config, code, test or return may call W04 production evidence,
    protected evaluation, validation evidence, expert evidence or recruitment fitness.
  - >-
    Retain all accepted R1 exact definitions/formulas, Decimal conversion, exact-four
    closure, suppression/no-imputation/state separation, synthetic-only control schema,
    canonical bytes, cutoff rejection, deterministic fixture values and no-provider
    behavior. Do not expand W04 beyond its exact four counts or start model/role work.
deliverables:
