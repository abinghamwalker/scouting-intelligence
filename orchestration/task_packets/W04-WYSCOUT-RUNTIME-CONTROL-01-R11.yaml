requirements:
  - >-
    Verify every fixed binding before editing. Preserve the complete dirty tree,
    all retained run families and prefixes, products, manifests, receipts,
    logical contracts, physical schemas, source authority and unrelated bytes.
    Do not run a real-root invocation, mutate PYC state, clean, use Git, or write
    any generated product/evidence byte in this packet.
  - >-
    Replace both and only both duplicated 17-member local-resource path tuples
    with the fixed exact ordered 30-member tuple. Members 1 through 17 must remain
    byte-for-byte equal and in their existing positions; append R21 members 18
    through 30 exactly as bound above. Admission and launcher must expose identical
    tuple values and cardinality. No glob, discovery, directory shorthand,
    optional path, substitution, duplicate, sorting, or normalization is allowed.
  - >-
    Change the resource digest component algorithm token in both admission and
    launcher to exactly w04-local-resource-exact-30-v1. Retain the existing row
    construction and stable digest meaning over each ordered row's exact path,
    physical SHA-256, size, mode, purpose, parser/schema version and authority
    link. Retain existence, regular-file, non-symlink, mode, hash and size checks.
  - >-
    Add focused positive and adversarial tests proving exact cardinality/order,
    admission-launcher equality, immutable first 17, exact appended 13, algorithm
    equality, stable digest agreement, and fail-closed behavior for omission,
    insertion, duplicate, reorder, v1/v2 substitution and row-content mutation.
    Prefer direct pure/unit boundaries; do not weaken existing tests or checks.
  - >-
    Preserve dependencies, lock state, root roster, product population, logical
    fields, serialization contracts, inverse guarantees, manifest/build formulas
    and digest meaning. Later code-manifest, repository-code digest, build ID,
    product/manifests/receipt bytes may change only as mechanical consequences of
    the corrected governed source bytes and require their own fresh real-root loop.
