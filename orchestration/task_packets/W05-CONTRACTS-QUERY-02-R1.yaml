schema_version: 1
task_id: W05-CONTRACTS-QUERY-02
phase_id: W05
revision: R1
state: DISPATCHED
objective: >-
  Implement only the self-verifying resolved-query and scored-candidate ordering
  projections omitted from W05-CONTRACTS-01-R3, with exact request/result identity
  checks and deterministic distance-then-UUID ordering.
depends_on:
  - REVIEW-W05-CONTRACTS-01-R3:SPLIT_REWORK
assigned_role: contracts_platform_implementer
risk: high
read_first:
  - AGENTS.md
  - orchestration/reviews/REVIEW-W05-CONTRACTS-01-R3.yaml
  - orchestration/task_packets/W05-CONTRACTS-01-R3.yaml
  - reports/reviews/W05/returns/W05-CONTRACTS-01-R3.md
  - reports/reviews/W05/w05-m0-contracts-independent-review-R1.md
  - src/scouting/contracts/m0.py
  - src/scouting/contracts/primitives.py
  - src/scouting/contracts/retrieval.py
  - src/scouting/contracts/workflow.py
  - tests/contracts/test_w05_m0_contracts.py
  - orchestration/templates/subagent_return.md
allowed_paths:
  - src/scouting/contracts/m0.py
  - src/scouting/contracts/__init__.py
  - tests/contracts/test_w05_m0_contracts.py
  - reports/reviews/W05/returns/W05-CONTRACTS-QUERY-02-R1.md
forbidden_paths:
  - .git/**
  - .gitignore
  - .venv/**
  - pyproject.toml
  - uv.lock
  - AGENTS.md
  - orchestration/**
  - configs/**
  - data/**
  - runs/**
  - reports/phase-gates/**
  - reports/verification/**
  - reports/reviews/W05/returns/W05-CONTRACTS-01-*.md
