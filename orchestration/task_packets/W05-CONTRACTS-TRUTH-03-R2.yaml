schema_version: 1
task_id: W05-CONTRACTS-TRUTH-03
phase_id: W05
revision: R2
state: DISPATCHED
objective: >-
  Close the three independently reproduced truth blockers with exact state projection,
  W04 family compatibility and fitting/PCA dimensional bounds only.
depends_on:
  - REVIEW-W05-CONTRACTS-TRUTH-03-R1:REWORK
assigned_role: contracts_platform_implementer
risk: high
read_first:
  - AGENTS.md
  - orchestration/reviews/REVIEW-W05-CONTRACTS-TRUTH-03-R1.yaml
  - reports/reviews/W05/w05-m0-contract-truth-independent-review-R1.md
  - src/scouting/contracts/m0.py
  - tests/contracts/test_w05_m0_contracts.py
  - orchestration/templates/subagent_return.md
allowed_paths:
  - src/scouting/contracts/m0.py
  - src/scouting/contracts/__init__.py
  - tests/contracts/test_w05_m0_contracts.py
  - reports/reviews/W05/returns/W05-CONTRACTS-TRUTH-03-R2.md
forbidden_paths:
  - .git/**
  - .gitignore
  - .venv/**
  - pyproject.toml
  - uv.lock
  - AGENTS.md
  - orchestration/**
  - configs/**
  - data/**
  - runs/**
