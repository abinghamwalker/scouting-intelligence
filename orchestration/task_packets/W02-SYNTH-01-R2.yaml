  - scope_confirmation.git_operations_performed is the Boolean false.
  - files_changed and artifacts_evidence identify exactly the two R2 allowed paths.
  - The R2 Markdown handback contains every mandatory return heading.
  - No other content or path is changed.
  - No Git command is run.
acceptance_checks:
  - >-
    uv run python scripts/verify_task_return.py
    --packet orchestration/task_packets/W02-SYNTH-01-R2.yaml
    --structured-return tests/fixtures/orchestration/W02-SYNTH-01-subagent-return.yaml
    --handback orchestration/reviews/W02-SYNTH-01-return-R2.md
stop_conditions:
