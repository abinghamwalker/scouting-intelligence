schema_version: 1
task_id: W08-REPLAY-CONTRACT-02C
phase_id: W08
revision: R1
state: DISPATCHED
objective: >-
  Correct the uncommitted W08 replay-link contract/schema so it retains exactly one
  truthful local query mode: a query player or a non-empty exemplar set.
