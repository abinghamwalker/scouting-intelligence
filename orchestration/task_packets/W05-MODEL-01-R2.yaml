schema_version: 1
task_id: W05-MODEL-01
phase_id: W05
revision: R2
state: DISPATCHED
objective: >-
  Complete the deterministic transparent M0 implementation using one additive,
  preregistered synthetic model-development fixture, preserving the failed R1
  comparison and every accepted predecessor byte.
depends_on:
  - REVIEW-W05-MODEL-01-R1:REWORK
assigned_role: m0_baseline_implementer
risk: high
read_first:
  - AGENTS.md
  - orchestration/task_packets/W05-MODEL-01-R1.yaml
  - orchestration/reviews/REVIEW-W05-MODEL-01-R1.yaml
  - reports/reviews/W05/returns/W05-MODEL-01-R1.md
  - orchestration/reviews/REVIEW-W05-ROLES-01-R2.yaml
  - orchestration/reviews/REVIEW-W05-ROLES-REVIEW-01-R2.yaml
  - src/scouting/contracts/m0.py
