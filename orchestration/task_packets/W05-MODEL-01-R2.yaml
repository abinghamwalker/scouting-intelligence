  - orchestration/**
  - configs/features/**
  - configs/roles/**
  - data/**
  - reports/phase-gates/**
  - reports/verification/**
  - reports/reviews/W04/**
  - reports/reviews/W05/returns/W05-MODEL-01-R1.md
