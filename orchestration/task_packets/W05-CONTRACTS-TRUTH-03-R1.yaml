requirements:
  - >-
    Replace global dimension state with a per-candidate projection that contains
    player ID, rank and exactly the six EvidenceDimensionName values in enum order.
    It must align one-to-one and in rank order with RetrievalResult candidates and
    explicit scored candidates.
  - >-
    Treat MEASURED and canonical ZERO as evidence-bearing states; ZERO is distinct
    from MISSING, SUPPRESSED and UNAVAILABLE and may contribute to ranking. A ZERO
    state requires the legacy dimension score to be canonical +0.0. Absence states
    require zero sentinel score/confidence, exact matching reasons and may not rank.
    DATA_CONFIDENCE remains a separate non-ranking object and its visible dimension
    must be an exact projection of that object.
  - >-
    For every M0 result, IMPACT, TRAJECTORY and TRANSFER_RISK remain unavailable or
    suppressed and non-ranking. For W04_REAL_GOVERNED, ROLE_COMPATIBILITY also remains
    unavailable or suppressed and non-ranking; only STYLE_RESEMBLANCE and
    DATA_CONFIDENCE may be MEASURED or ZERO. Synthetic development may measure role
    compatibility but gains no production or expert-validation claim.
  - >-
    Require each candidate explanation to contain exactly artifact feature_names in
    artifact order and to equal the corresponding scored candidate's exact query
    FeatureValue tuple, candidate FeatureValue tuple and contribution tuple. Player,
    rank and ordering must align. Mutating/re-signing/incompletely projecting an
    explanation and recomputing result_digest must still fail.
  - >-
    Add taxonomy_digest to ContextualRoleMembership and require ID, version and digest
    equality in require_matching_taxonomy. Restore direct taxonomy tests for canonical
    responsibility/role/mapping order, same-ID content substitution, contextual
    membership ordering, probability sum, unknown roles and digest drift.
  - >-
    Correct W04 real authority constants and manifest pins: canonical candidate digest
    is `49065bcfe762caa7585082d897d845d82c9a9ef2f57a84a5312e55a12ffea10f`;
    decision digest is a separate required feature_registry_decision_digest equal to
    `bf46f42585adfdec48f5e3670c70d9e517b9f542645089ba63b91dd218d33941`.
  - >-
    Expose a pure mechanical helper which accepts the parsed accepted W04 registry,
    selects exactly the four SUPPORTED rows in order action_count,
    coordinate_known_action_count, match_count, resolved_possession_action_count, and
    hashes compact sorted-key JSON containing exactly aggregation, applicability,
    denominator, feature_name, input_fields, output_type, reason and state. Freeze the
    expected digest as
    `fb562ddee18e008f26b9c865772ef217cb5b34243ae73eb69fad815da291778e`.
    W04 manifests must require it; missing, reordered, expanded or changed supported
    rows fail derivation/tests. Do not modify the W04 YAML or acceptance JSON.
  - >-
    Make the ordered array semantic-role sequence and shape rules executable per
    family. Every family requires INDEX_VECTORS then INDEX_PLAYER_IDS in a documented
    canonical descriptor order; UUID bytes are uint8 candidate_count x 16. Raw and
    metadata controls have candidate_count x feature_count vectors. Robust cosine
    additionally requires one-dimensional SCALER_CENTER and SCALER_SCALE of
    feature_count. Weighted cosine and role-aware restriction additionally require
    SCALER_CENTER, SCALER_SCALE and FEATURE_WEIGHTS of feature_count. PCA requires
    SCALER_CENTER, SCALER_SCALE, PCA_COMPONENTS and PCA_EXPLAINED_VARIANCE;
    components are component_count x feature_count, variance is component_count, and
    index vectors are candidate_count x component_count. All numeric model arrays are
    float64 and descriptors use the canonical ordered semantic roles. A PCA manifest
    with only feature/index arrays, a two-column matrix against four W04 features, or
    reordered semantic roles must fail.
  - >-
    Retain canonical negative-zero rejection for FeatureValue, distance and
    contribution. Update focused fixtures/exports and add direct adversarial tests for
    every requirement. Do not add loaders, fitting, scoring, serving or W06 surfaces.
deliverables:
  - Candidate-specific evidence truth and scored-explanation equality contracts.
  - Exact W04 candidate/decision/descriptor identity and complete array semantics.
  - Restored taxonomy/membership substitution tests.
  - Complete mandatory return at the exact allowed path.
definition_of_done:
  - The remaining four omissions from W05-CONTRACTS-01-R3 fail closed under direct tests.
  - Existing W03/W04 contracts, authority files and serialized bytes remain unchanged.
  - No loader, feature implementation, role implementation, training, serving or W06 work is introduced.
