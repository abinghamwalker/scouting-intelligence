requirements:
  - >-
    Verify every fixed binding before adjudication. Keep all producer, code,
    product, manifest, receipt, staging, retained-failure, PYC, data and run bytes
    read-only. Perform no launch, publication, cleanup, Git operation, dependency
    change, or producer edit.
  - >-
    Independently read the corrected wrapper and prove that it constructs the
    exact post-uv 30-key environment from the unchanged launch inputs and compares
    only the returned dynamic transport digest to that digest. Confirm that the
    normalized fixed authority remains independently bound and that no accepted
    launch/environment/command byte or digest formula changed.
  - >-
    Independently guard-read and strictly validate the retained R2 and both R3
    invocation/boundary receipt families. Reproduce each 25-key projection,
    projection/invocation inverse and sole build hash; require distinct UUIDv4
    run/boundary paths and one common code/build/product/manifest authority.
  - >-
    Reopen all seven Parquet products and three manifests. Through the accepted
    root-owned descriptors, strictly reconstruct every row to canonical logical
    JSON bytes and recompute all physical/semantic hashes and parent paths.
    Require ordered counts [1768,3544,13,1,2,1,1], exact Decimal inverse and
    struct order/type, coverage UTF-8 projection, temporal proof, and byte-stable
    outputs across both R3 runs.
  - >-
    Prove every retained runtime-pycache prefix is empty, old code manifest and
    failed prefixes remain present, and independent shell site/repository PYC
    inventories equal the frozen hashes. Add read-only/in-memory adversarial
    mutations for receipt/product/manifest/cross-run/prefix predicates; no attack
    may write a producer or retained-root byte.
  - >-
    Reproduce the exact 286-test runtime population plus Ruff, mypy, Bandit,
    import-linter, guard, local-only, diff-check and zero-remotes checks with
    writes/caches isolated under /tmp and Python bytecode disabled. PASS only with
    P0/P1/P2 exactly 0/0/0; otherwise return bounded REWORK.
