correction_boundary:
  canonical_decimal_utf8:
    projection_kind: CANONICAL_DECIMAL_UTF8
    exact_logical_fields:
      - GoldCoverageDimension.coverage
      - GoldCoverage.coverage_overall
    forward: >-
      Require exact finite Decimal. Normalize every signed zero to `0`; otherwise
      format fixed-point without exponent notation, strip redundant trailing
      fractional zeros and a now-empty decimal point, perform no rounding, and
      return exact UTF-8 text with no terminal LF.
    inverse: >-
      Require an exact non-null UTF-8 string, strict-parse directly to Decimal,
      reject non-finite values, canonical re-encode, and require byte-for-byte
      equality. Reject whitespace, BOM, exponent aliases, leading plus, leading
      integer zeros, redundant fractional zeros, signed zero and any other alias.
    null_rule: >-
      The encoded value never uses Arrow null; only the owning projection field's
      existing outer optionality may admit null.
    unchanged_decimal_fields: >-
      Every other Decimal, including event seconds, x/y coordinates and the
      Decimal position in possession/action order tuples, remains exactly
      decimal128(22,18).
  predicate_operands:
    - >-
      Every runtime predicate operand must mechanically resolve against the exact
      owning Pydantic model field graph. Correct all nine invalid R2 records named
      in the master report; no conceptual or renamed operand can masquerade as a
      runtime field.
    - >-
      Guarded-reader, source-completion, authority-composition, season binding,
      exact one-lineup population, build receipt and other cross-object rules must
      be explicit external/composed authority predicates with an exact authority
      source and exact operands. They must not be attributed to a generic runtime
      model validator.
    - >-
      Correct all known false constants and relations: coordinates are 0..100;
      dependency clocks obey observed_at<=available_at; temporal boundary state is
      STRICT_BEFORE_CUTOFF_PASS; descriptor number is not fixed to 3; data contract
      authority/clocks have four rows; build composition has its separate fifth
      season-lineup-product authority; generic SilverMatch and SilverLineupStint
      validators do not themselves establish the POC population bindings.
  frozen_constants:
    - >-
      Emit the exact structured constants used by every claimed equality. Labels,
      counts, placeholder names, prose and symbolic concepts are insufficient.
    - >-
      At minimum reproduce the accepted source manifest/member paths, IDs, digests
      and counts; exact authority candidate/review/acceptance rows and clocks;
      exact 119-row field registry and digest; exact admitted event/subevent pairs,
      strict integer-only mapping and all non-integer quarantine reasons; exact
      possession admitted sets/order constants; exact completion-index source
      binding plus 1H/2H counts and ordered-membership digests; five dependency
      rows; season 181150 and UUID 4696aa1f-b512-5d18-af79-33cf031455cf; exact match
      2499719/team 1631/player 285508/ordinal 0 lineup row and UUID
      591cdf5b-2281-53c4-8225-150313ca2c01; and the accepted R4 sole complete
      LayerManifest semantic derivation and receipt/readback composition constants.
    - >-
      Derive exact values directly from the frozen contracts and authority files;
      do not transcribe an alternate semantic source or change any frozen byte.
implementation_requirements:
  - Verify every fixed hash before editing and stop on drift.
  - Preserve exactly 23 roots, 12 Parquet roots, 11 JSON-only roots, all role IDs,
    fields, dependency edges, versions, semantics and digest paths.
  - >-
    Keep `wyscout_schema.py` contracts-layer only: no storage or PyArrow production
    import. It exports exact descriptor content; tests alone mechanically instantiate
    the accepted storage descriptor primitive without inference.
  - Extend storage descriptor validation, Arrow schema generation and inverse
    projection only enough to support CANONICAL_DECIMAL_UTF8. Do not add a second
    schema source, alternate encoder, inference path or semantic digest.
  - Preserve the four accepted CanonicalJsonValue tagged UTF-8 projection paths.
  - No aggregate, product, manifest, receipt, provider, network, publication,
    deployment, cloud, container, CI, dependency or Git action.
focused_acceptance:
  - Exact 23-root/order/key/ID/version/dependency assertions remain passing.
  - Every emitted runtime predicate operand resolves; every external/composed
    predicate is classified and bound to an exact frozen authority source.
  - Exact constant corpus reproduces independently and placeholder/symbolic constant
    substitution fails closed.
  - Descriptor-led Arrow construction and inverse logical equality execute for all
    twelve Parquet roots, including required logical-null fields and variant arms.
  - Exactly the two authorized owning logical fields use CANONICAL_DECIMAL_UTF8 at
    every occurrence; no other field does.
  - Decimal tests include 0, signed zero rejection on inverse, 1, trailing-zero and
    exponent input canonicalization, the valid 38-digit 1/3 coverage value, tiny and
    large finite values, non-finite rejection, Arrow-null rejection, whitespace,
    BOM, plus, exponent and redundant-zero alias rejection, no LF and byte equality.
  - All other Decimal paths assert and successfully exercise decimal128(22,18).
  - Width/nullability/metadata/position/inference/caller-authority mutations and all
    R1/R2 adversarial cases fail closed.
