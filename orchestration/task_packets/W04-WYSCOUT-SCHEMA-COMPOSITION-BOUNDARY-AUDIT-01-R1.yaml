audit_requirements:
  - Verify every fixed hash before analysis and stop on drift.
  - >-
    Trace the approved serial order from build-contract implementation through
    23-root implemented-schema closure, schema-bundle-v2 materialization,
    product-contract-v2 materialization and later runtime admission/publication.
  - >-
    Determine whether exact Gold Arrow schema identity is already fully derivable
    from an accepted existing implementation authority, or whether it becomes
    accepted only at the planned implemented-schema/aggregate gates.
  - >-
    Compare these bounded options: a direct exact-schema validator in the current
    build module; a callback/content input sourced from a later accepted schema
    authority; or deferring receipt-closure executability until that authority is
    materialized. Reject any option that creates a second schema, placeholder
    digest, caller self-authorization, new root, changed 25-key projection, cycle,
    product write or wider scope.
  - >-
    Recommend the smallest option and classify it as either composition within the
    approved chain or a change to a frozen architecture/sequencing boundary that
    requires user clarification.
