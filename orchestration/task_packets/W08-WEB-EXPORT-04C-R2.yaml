schema_version: 1
task_id: W08-WEB-EXPORT-04C
phase_id: W08
revision: R2
state: DISPATCHED
objective: >-
  Close the R1 web-export residual with reachable inventory/create/revoke UI,
  streaming request bounds and route-level denial/tamper/recovery witnesses.
depends_on:
  - W08-WEB-EXPORT-04C:R1_CORE_ROUTES_COMPLETE
assigned_role: routine_producer_gpt-5.6-terra_medium
risk: high
invariant: >-
  No HTTP request may expose or mutate a pack outside exporter policy, verified bytes
  and append-only audit state; malformed/oversized input fails before side effects.
read_first:
  - AGENTS.md
  - orchestration/task_packets/W08-WEB-EXPORT-04C-R1.yaml
  - reports/reviews/W08/returns/W08-WEB-EXPORT-04C-R1.md
  - configs/policies/w08-authorization.yaml
  - configs/policies/w08-export.yaml
  - src/scouting/audit/ledger.py
  - src/scouting/operations/evidence_export.py
  - src/scouting/web/w08.py
  - apps/web/templates/w08/base.html
  - apps/web/templates/w08/shortlist.html
  - apps/web/templates/w08/audit.html
  - apps/web/templates/w08/export.html
  - tests/integration/test_w08_evidence_export.py
  - tests/security/test_w08_export_boundaries.py
  - tests/integration/test_w08_local_workflow_app.py
  - tests/security/test_w08_web_security.py
allowed_paths:
  - src/scouting/web/w08.py
  - apps/web/templates/w08/base.html
  - apps/web/templates/w08/shortlist.html
  - apps/web/templates/w08/audit.html
  - apps/web/templates/w08/export.html
  - apps/web/templates/w08/exports.html
  - apps/web/static/w08/app.css
