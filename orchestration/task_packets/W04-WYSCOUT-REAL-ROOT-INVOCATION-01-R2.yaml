    the exact retained unaccepted code manifest. Record both failure causes and
    prove every retained prefix remains empty.
  - >-
    For each new run the master alone samples/creates one fresh control UUIDv4
    prefix, no-follow opens and verifies the accepted launcher exactly once, and
    passes only that inherited descriptor through the exact literal normal-PATH-
    selected command `uv run --locked --no-sync python -S -B
    scripts/launch_wyscout_v5.py` under the complete closed outer environment.
    Never use a module, wrapper argv substitution, direct physical uv invocation,
    alternate environment value, network or provider access.
  - >-
    Execute exactly two new COMPLETE runs after R10 acceptance. Require distinct
    control/admission/rebuild UUIDs, one new current-repository accepted immutable
    code manifest, one stable accepted build ID, byte-identical seven products and
    three layer manifests, and two invocation/boundary receipt families. The
    retained pre-R10 unaccepted manifest and failed build/prefix are additional
    negative evidence and must never be counted as accepted output or removed.
  - >-
    Guard-read/reopen all seven Parquet products, three manifests, code manifest,
    both boundary and invocation receipt families and every completion cross-field.
    Independently reconstruct the code/environment manifest, exact 25-key
    projection, build ID and inverse, physical/logical aggregate bindings, parent
    chain, temporal proof, row counts and two-run equality from named bytes.
  - >-
    Record complete pre/mid/post no-follow inventories, PYC inventories, all
    failed and successful prefixes, source descriptor/encoding/uv/frame/status
    observations, row counts, SHA-256/semantic digests, run equality, local-only
    checks and residual risk. Retain all staging and PYC evidence; do not clean.
