    Verify every fixed binding and repeat complete no-follow data/runs and PYC
    preflight. Treat the immediately preceding accepted R10 master gate as the
    complete locked/offline pre-run gate because no code, resource, dependency,
    lock, source, identity, schema, authority or product byte may change between
