review_requirements:
  - Classify every finding P0, P1 or P2 and cite exact file/line evidence.
  - Determine whether the UI uses only serve_m0_request, serve_m0_batch and the loaded accepted scorer, with no UI scoring arithmetic or second scorer.
  - Confirm W06 NO_GO and MISSING_EXPERT_RELEVANCE_EVIDENCE are prominent and cannot read as positive validation.
  - Confirm resemblance_only, synthetic-development-only, LIMITED, no_recommendation_evidence and suppressed W04 measures remain explicit.
  - Confirm every result carries source, model, registry, schema, taxonomy, configuration, cutoff, confidence, applicability, limitations and lineage identities.
  - Review search, player, retrieval, comparison, evidence centre and all closed-state routes for fail-closed semantics.
  - Review semantic landmarks, headings, labels, tables, focus, responsive CSS and keyboard journey implementation.
  - Confirm no external assets, Node tooling, provider access, remote resource, protected output or protected fixture is required or opened.
  - Reproduce the focused W07 tests plus W05 serving and retrieval parity tests.
focused_checks:
  - uv run ruff check src/scouting/web/w07.py services/api/w07_main.py tests/integration/test_w07_local_evidence_app.py tests/e2e/test_w07_local_evidence_playwright.py
  - uv run mypy src/scouting/web/w07.py services/api/w07_main.py
  - uv run pytest -q tests/integration/test_w07_local_evidence_app.py tests/e2e/test_w07_local_evidence_playwright.py tests/integration/test_w05_m0_serving.py tests/e2e/test_w05_m0_retrieval.py
stop_conditions:
  - A protected fixture/output, dependency install, external request, Git action, production edit or destructive action would be required.
  - Any P0 or P1 finding is identified; retain it precisely and return it to the master without editing production.
deliverables:
  - Independent review at reports/reviews/W07/w07-application-independent-review-R1.md with decision PASS, REWORK or BLOCKED and enumerated findings.
  - Mandatory return at reports/reviews/W07/returns/W07-INDEPENDENT-REVIEW-05-R1.md using the repository return template.
mandatory_return_requirements:
  - State exact commands and exit statuses.
  - State P0, P1 and P2 finding counts even when zero.
  - State whether protected output was opened.
  - State whether any external request occurred.
  - State whether any file outside allowed_paths was changed.
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
self_approval: forbidden
