deliverables:
  - Analyst-only creation form with fixed retained template/taxonomy, selectable supported responsibility code, preference weight, hard constraint and local synthetic-development exemplar derived from the public W07 default request.
  - Role-correct create/submit/correct/replay and approve/reject controls; scout approved-read only; admin no workflow mutations; direct POST remains service/policy protected.
  - Reject submits RoleBriefRejectionReason plus note; correct submits expected lock and exact changed title/responsibilities/constraint/preference/exemplars, produces DRAFT with submission/decision fields cleared and leaves rejection unchanged.
  - Detail renders every immutable template/taxonomy/visibility/responsibility/constraint/preference/exemplar/status/reason/note/timestamp/actor field and labels weights as retained replay context not applied by W05 scoring.
  - A five-version create-submit-reject-correct-resubmit-approve automated chain proves old/new values, actors and timestamps, plus role/CSRF/stale/invalid/foreign denial without revision/lock/audit partial state.
definition_of_done:
  - All R1 gaps are implemented within allowed paths and focused tests pass; replay equality/candidate membership remains explicitly deferred to 04F.
focused_checks:
  - Five immutable versions and exact content preservation/change boundary.
  - Rendered role controls and complete history fields.
  - Negative attempts leave revision, lock and receipt counts unchanged.
acceptance_checks:
  - uv run ruff format --check src/scouting/web/w08.py tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py
  - uv run ruff check src/scouting/web/w08.py tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py
  - uv run mypy src/scouting/web/w08.py
  - uv run pytest -q tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py
stop_conditions:
  - A shared contract/service/policy/migration/dependency, W05/W07 or protected-output change is required.
  - A network/provider/model call, fitting/training, Node/npm, container, destructive action or Git operation is required.
  - Correctness would rewrite history, invent retained options, bypass policy or widen evidence claims.
mandatory_return:
  - task/revision and invariant
  - exact changed-file list
  - role-control and old/new version maps
  - exact commands/exits/test counts
  - five-version and negative atomicity witnesses
  - residual risks/follow-ups
  - no Git/dependency/protected-output/out-of-scope confirmations
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
