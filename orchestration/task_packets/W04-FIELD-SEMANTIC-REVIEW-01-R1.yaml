    frozen input digests, strict schemas, master ActorId/clock, canonical JSON,
    safe canonical YAML, registry equality, and all physical/canonical digests.
  - >-
    Audit every semantic row against the W04 claim and source support. Report
    any unsupported transform, unsafe canonical projection, missing forbidden
    field, unjustified unmapped field, collision, coercion, label/name/current
    team/outcome/score/role inference, zero-identity error, time/position/tag
    overclaim, or rationale mismatch as a P0/P1/P2 finding.
  - >-
    Independently audit the progression-safe review/acceptance validator and
    mutation suite. It must fail closed for malformed/missing/non-PASS
    authority, changed candidate, self-review, actor/clock/digest/fence failure,
    and downstream paths before valid acceptance, while allowing a valid review
    and later exact acceptance without permanently blocking separately
    authorized downstream paths.
  - >-
    Before writing the review, take an actual complete shell-only pyc preflight,
    verify the four frozen hashes, confirm review/acceptance/downstream paths are
    absent, and run the focused 123-test suite plus Ruff and local-only checks.
    Do not sync.
  - >-
    Only after the audit is complete, obtain `reviewed_at` from the actual local
    UTC clock. Create the review Markdown with explanatory prose outside exactly
    one fenced block whose opening is exactly
    `w04-authority-review-v1`. The body is one strict canonical JSON record plus
    one LF using the exact R20 keys and frozen values. Use the exact independent
    reviewer ActorId. PASS requires no findings; REWORK requires at least one
    complete finding.
  - >-
    After writing the actual review, rerun the focused contract suite. It must
    pass while strictly validating the newly present review and still blocking
    absent acceptance/downstream work. Then run all other packet checks and
    reproduce the complete terminal pyc inventory exactly.
  - >-
    Record review record SHA-256, complete physical review SHA-256, file
    size/line count, candidate hashes before/after, all commands/results, and
    exact inventory in the return. Do not create the acceptance artifact.
  - >-
    Use only root uv with locked/no-sync. Every Python process starts with
    PYTHONDONTWRITEBYTECODE=1 and `python -B`; use `-S -B` for stdlib-only work.
    Do not repair or clean pycs.
  - >-
    Change exactly the two owned paths. Do not run Git, self-approve, access
    network/provider data, or create acceptance, dependency, Bronze, Silver,
    Gold, product, runtime, cloud, container, endpoint, or deployment artifacts.
