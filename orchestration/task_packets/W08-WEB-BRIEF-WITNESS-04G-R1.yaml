deliverables:
  - Analyst create and correction forms expose fixed `w08-local-template`, exact retained W05 taxonomy identity, both supported public W07 responsibility codes, a responsibility-code preference weight, supported local `synthetic_age_years` at-most constraint, and the public W07 query-player UUID as a labelled synthetic-development exemplar; no arbitrary free-form taxonomy/UUID option.
