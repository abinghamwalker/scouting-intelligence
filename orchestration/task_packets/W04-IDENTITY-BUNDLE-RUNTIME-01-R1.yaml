requirements:
  - >-
    Reopen and verify exact completion/source manifests, the complete accepted identity
    authority graph and every declared master/match/action source member needed to
    recompute the full population. Use declared paths only; never scan, select newest,
    follow an alias, access a provider/network or trust a digest/count witness alone.
  - >-
    Parse identity-bearing fields as strict JSON integers. Reject malformed, missing,
    Boolean, float, string-integer, duplicate, zero under its distinct policy,
    cross-kind and conflicting keys without name or label matching.
  - >-
    Build exactly 5,594 version-1 current rows and the exact 15-item queue. Recompute
    all source references, aggregation, clocks, accepted authority edges, canonical
    identities, evidence digests, row IDs, trace IDs, counts and ordering.
  - >-
    Apply the packet's frozen queue namespace, exact no-newline canonical JSON
    preimage and sole absent-player reason token. Reject alternate separators,
    namespace names, preimage fields, tokens or encodings.
  - >-
    Canonicalize the queue once, derive its address, persist only the exact sidecar-
    free content-addressed queue path, reopen through nofollow access and compare exact
    bytes/digest/semantics. Bind that path/digest into the initial bundle and perform
    the same materialize/reopen/recursive-verification process for the bundle.
  - >-
    Equal existing bytes are idempotent. Unequal existing content, any adjacent
    sidecar, partial, symlink, escape, stale queue/bundle, unreferenced extra identity
    artifact or unexpected correction fails closed without cleaning or overwriting.
  - >-
    Expose the verified bundle SHA-256 and R20-derived identity-bundle UUID for later
    build authority, but do not calculate a build ID or create product/receipt bytes.
definition_of_done:
  - Exact target IDs and all source-complete counts reproduce from verified source bytes.
  - Exact queue and bundle bytes materialize once, reopen recursively, and are byte-idempotent.
  - Focused positive/adversarial identity tests pass with no architecture or dependency change.
