mandatory_tests:
  - Exact target rows, ordinals, raw digests and canonical UUIDs.
  - Exact 5,594 current-row counts and effective index.
  - Exact 23-to-15 queue aggregation and eight substitution-zero exclusions.
  - Exact 226,041 rejected-zero source references.
  - Repeated byte-identical materialization and recursive readback.
  - >-
    Missing, additional, duplicate, reordered, stale, cross-kind, cross-source,
    cross-tenant, string/Boolean/float, zero-resolution, queue/bundle omission,
    digest-only witness, alternate preimage, wrong clock, wrong authority digest,
    path scan, sidecar, symlink and immutable conflict rejection.
