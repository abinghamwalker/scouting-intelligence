deliverables:
  - Pack template uses verified payload plus passed pack_id to render classification, claim/model evidence/applicability, brief ID/version, retrieval link/model/data/taxonomy versions, underlying SHA-256, audit event/digest/sequence and limitations; no raw underlying/private values or generic payload dump.
  - Pack template has one CSRF revoke form with non-empty reason for its authorised reader. Successful revoke redirects to `/w08/exports`; read-after-revoke is generic denial.
  - Inventory renders active rows as local pack links, revoked rows as non-links with explicit reason/time, plus only ID, classification, SHA-256, generated actor/time and limitations.
  - One dedicated TestClient journey reuses or builds an exact approved brief/link/TEAM shortlist, asserts analyst shortlist export form hidden tuple, creates/reads/inventories the pack, verifies approver read/inventory, creates same-tenant second analyst and proves absent inventory/read, then revokes and proves revoked non-link/read denial.
  - The same witness asserts scout/admin see no create/nav controls and direct inventory/create/read/revoke denial; rendered strings preserve NO_GO/resemblance_only/synthetic_development_only/LIMITED/no recommendation and exclude a private observation marker.
definition_of_done:
  - The complete authorised journey and safe templates pass; adversarial tamper/failure/body-boundary matrices remain exclusively assigned to 04J.
focused_checks:
  - Exact safe payload fields and no underlying/private dump.
  - Analyst/approver success, second-analyst/scout/admin denial.
  - Revoked inventory non-link and verified read denial.
acceptance_checks:
  - uv run ruff format --check src/scouting/web/w08.py tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py
  - uv run ruff check src/scouting/web/w08.py tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py
  - uv run mypy src/scouting/web/w08.py
  - uv run pytest -q tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py tests/integration/test_w08_evidence_export.py tests/security/test_w08_export_boundaries.py
stop_conditions:
  - A core exporter/audit/policy/contract/schema/dependency, base/shortlist template or protected-output change is required.
  - A network/external destination, Node/npm, container, destructive action or Git operation is required.
  - Passing requires dumping private underlying values or rendering unauthorised/revoked content.
mandatory_return:
  - task/revision and invariant
  - exact changed files
  - safe field/role/journey maps
  - exact commands/exits/test counts
  - authorisation, revocation and non-disclosure witnesses
  - residual risks/follow-ups
  - no Git/dependency/protected-output/out-of-scope confirmations
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
