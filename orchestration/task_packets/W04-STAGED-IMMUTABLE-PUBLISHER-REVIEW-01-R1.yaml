review_requirements:
  - Verify every fixed hash before analysis and stop on drift.
  - >-
    Independently prove the constructor and selection seam admit only a non-empty
    subset of the exact names wyscout-working, wyscout-manifests and
    w04-rebuild-runs. Attack every canonical-looking alias and non-string before write.
  - >-
    Audit every descriptor-relative open/stat/mkdir/read/link/unlink/fsync transition
    for no-follow containment, directory/file modes, stable identity, regular-file
    type, exact link count, full-byte read/write, immutable equal replay and no replacement.
  - >-
    Independently reproduce failures for absolute/dot/dot-dot/duplicate separator/
    backslash/NUL/overlong/deep/partial tails; staged/final symlink, hardlink, FIFO,
    directory, mode and link drift; nested symlink and parent/root rename; partial
    write, reopen, validator, final recheck, link race, EXDEV and unlink failure.
  - >-
    Target the exact post-link final-parent fsync state and post-unlink staging-parent
    fsync state without relying only on producer assertions. Confirm no success result,
    exact retained final/staged inode/link state and no damage to unrelated final evidence.
  - >-
    Confirm no digest sidecar, chmod repair, GuardedStorage/encoder change, real
    product/partial path, dependency, Git, provider/network, cloud/container/CI/
    endpoint/deployment action occurred.
definition_of_done:
