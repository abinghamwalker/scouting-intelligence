  - Bronze/identity/Silver/Gold grains, keys, nullability, and lineage reconcile.
  - Two-root rebuild can be implemented without wall-clock or filesystem nondeterminism.
  - No code/config/test/data/provider/network/Git changes or accesses occur.
acceptance_checks:
  - uv run python -c "from pathlib import Path; p=Path('reports/reviews/W04/wyscout-schema-design-independent-review-R1.md'); assert p.is_file() and p.stat().st_size > 4000"
  - uv run python scripts/verify_local_only.py
stop_conditions:
