requirements:
  - >-
    Verify every fixed binding before editing. Preserve the complete dirty tree,
    every retained R2/R3 run/failure/prefix, all products/manifests/receipts, PYC,
    source/rights/authority bytes and unrelated files. Do not run a real-root
    invocation, write generated data/run/manifest evidence, clean, or use Git.
  - >-
    Preserve PreBuildAdmissionResult, child-input v1, pre-build projection v1,
    rebuild invocation v1, published rebuild-invocation receipt v1, the one-SHA
    build formula, accepted logical schema/product digests, 23-root roster,
    product population and every source/data-rights meaning. Actual R is terminal
    operational evidence only: it must not enter stable admission, projection,
    build ID, published product/manifest/receipt identity, selection, retry or
    authority expansion.
  - >-
    Add one nested non-root strict RuntimeSubsetObservation with exactly ordered
    fields observation_kind, owner_name, owner_version, site_relative_path,
    subject_name. observation_kind is exactly MODULE_SOURCE, NATIVE_EXTENSION,
    NAMESPACE_LOCATION or SITE_SHARED_IMAGE. owner name/version are the exact
    normalized selected-L identity. Paths are NFC safe root-independent POSIX
    paths relative to site-packages. subject_name is the exact sys.modules key
    for module/namespace rows and literal DYLD_IMAGE for shared-image rows. No
    null, extra, absolute root, unsafe segment, symlink or PYC/PYO spelling.
  - >-
    Freeze selected-L and complete RECORD ownership once before product imports.
    At the terminal post-product/post-receipt recheck, observe R exactly once.
    Record site .py origins as MODULE_SOURCE; exact frozen EXTENSION_SUFFIXES
    origins as NATIVE_EXTENSION; true namespace locations only when origin is
    None, there is no contributor-owned __init__.py and each emitted contributor
    has singular concrete descendant ownership; and every Darwin loaded image
    contained in site-packages and singularly RECORD-owned as SITE_SHARED_IMAGE.
    Ignore only admitted built-in/frozen/repository/stdlib origins. Reject every
    other absolute/external origin, unsafe namespace, unowned/ambiguous/mutated
    file/image, installed-only/lock-only owner, version drift or selection drift.
  - >-
    Sort rows by canonical row JSON bytes, require exact uniqueness and bounded
    cardinality 1..100000. R is the sorted unique (owner_name, owner_version)
    projection and must be a nonempty subset of the frozen selected L. When
    loaded, require native observations mapping pydantic_core to pydantic-core
    and _polars_runtime_32 to polars-runtime-32. Use only local stdlib/Darwin
    loader observation; add no dependency or provider/network access.
  - >-
    Preserve runtime_subset_digest's accepted meaning and calculate it only as
    SHA256(canonical_json({algorithm:
    w04-normalized-runtime-subset-observations-v1, rows:<exact tuple>})), without
    terminal LF. Extend FinalRecheckResult with runtime_subset_rows immediately
    after runtime_subset_digest; its strict validator reproduces order,
    uniqueness, nonempty R and the exact digest. The launcher independently
    validates every returned row against its pre-child frozen selected/RECORD
    authority and current bytes so a coherent row-plus-digest substitution fails.
  - >-
    Apply exactly the fixed physical version changes: installed subset policy v2,
    final-recheck v2, child-result v3, manifest v16 and outer-completion v2. Keep
    frame magic/version 1 and every explicitly unchanged schema version fixed.
    Rebind the stable child-result contract component to final-recheck v2, the
    runtime-subset algorithm, exact five observation fields and four kinds; actual
    R rows remain excluded. Regenerate only derived physical schemas/predicates/
    constants/tests needed by these versioned runtime contracts; do not change a
    Wyscout logical root or accepted logical digest.
  - >-
    Extend internal ChildExecution with one closed process-observation value and
    retain the admission observation only as an explicitly operational,
    build-excluded launch-plan field. Outer completion v2 must copy the rebuild
    final R rows/digest byte-for-byte and contain the exact canonical top-level
    roster admission_run_id, build_id, child_process_observations,
    code_manifest_sha256, control_run_id, outer_transport_environment_sha256,
    pyc_inventory_health, rebuild_receipt_relative_path,
    rebuild_receipt_sha256, run_id, runtime_subset_digest, runtime_subset_rows,
    schema_version, status. The two child rows are ordered admission then rebuild.
  - >-
    Each child-process observation must close and truthfully bind: child role and
    input/result schema versions; exact argv/digest; input/final UV values;
    transport digest; nonce; payload kind; entrypoint source descriptor object;
    result descriptor number/inheritance/parent-close checkpoint; PID and exit 0;
    timeout bound/not-timed-out; result frame magic/version/count/EOF/payload
    size/digest; stdout/stderr sizes and SHA-256; prefix absolute/relative path,
    pre identity {device,inode,link_count,mode}, empty before and identity/empty
    unchanged after; source descriptor checkpoint; cross-field binding; in-place
    PYC unchanged and zero in-place PYC read. Successful rows require every
    boolean true, empty diagnostics, one frame, exact /opt/homebrew/bin/uv for the
    three verified UV observations, and no diagnostic payload bytes in tracked
    evidence. Actual PID/FD/inode/absolute path/nonce/transport fields are
    operational and excluded from stable identity.
  - >-
    Add positive direct contract, observer, launcher-validation and outer-status
    proofs. Add adversarial tests for row omission/insertion/reorder/duplicate;
    digest-only drift; coherent row+digest owner/path/version substitution;
    unknown/null/mistyped kind; absolute/unsafe/non-NFC/symlink/PYC/external
    origin; owned-init/unowned/ambiguous/unsafe namespace; unowned/mutated shared
    image; duplicate, lock-only, installed-only or version-mismatched owner;
    exact native positives; repeated R observation/rescan; R influence on stable
    identity; stale final-recheck v1, child-result v2, manifest v15 and outer v1;
    outer row order/PID/FD/frame/diagnostic/prefix/UV binding; and synthetic
    two-root R mismatch. Rejection must precede acceptance/publication use.
