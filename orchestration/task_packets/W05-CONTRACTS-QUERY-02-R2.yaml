requirements:
  - >-
    Add expected_resolved_query_digest: Sha256Digest to PinnedM0ServingRequest beside
    the complete typed resolved_query. Require it to equal the already self-verified
    resolved_query.resolved_query_digest. This field is the independent upstream pin;
    it is not derived or silently overwritten by model construction.
  - >-
    Update focused fixtures and result digest inputs to carry the expected pin. Add a
    direct strict-validation attack which changes responsibilities and matching
    responsibility_weights under the same tenant, trace, brief ID/version, taxonomy,
    cutoff, limit, exclusions and artifact pins; recomputes resolved_query_digest and
    result_digest; leaves expected_resolved_query_digest unchanged; and fails with an
    exact independent-query-digest mismatch.
  - >-
    Retain all accepted R1 request overlap, taxonomy, scored-candidate cardinality,
    negative-zero, total-order, limit, exclusion and claim checks. Do not enter
    candidate-specific evidence, W04 descriptor/array or explanation-truth scope.
deliverables:
  - Independent resolved-query digest pin and adversarial same-ID substitution test.
  - Complete mandatory R2 return.
definition_of_done:
  - The sole independent-review P1 probe fails closed for the intended reason.
  - No accepted W03/W04 or other W05 surface changes.
acceptance_checks:
  - uv run ruff format --check src/scouting/contracts/m0.py src/scouting/contracts/__init__.py tests/contracts/test_w05_m0_contracts.py
  - uv run ruff check src/scouting/contracts/m0.py src/scouting/contracts/__init__.py tests/contracts/test_w05_m0_contracts.py
  - uv run mypy src/scouting/contracts/m0.py src/scouting/contracts/__init__.py
  - uv run pytest -q tests/contracts/test_w05_m0_contracts.py tests/contracts/test_foundation_contracts.py
  - uv run lint-imports
stop_conditions:
  - Any need to change accepted W03/W04 contracts, authorities, evidence or product bytes.
  - Any new product behavior, dependency, external access, weakened guarantee or out-of-scope write.
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
self_approval: forbidden
