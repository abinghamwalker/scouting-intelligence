phase_id: W06
revision: R1
state: DISPATCHED
objective: >-
  Replace every Bandit-reported W06 runtime assert with an explicit fail-closed guard
  that survives optimized Python, and annotate only the three deterministic,
  non-security PRNG uses, without changing formulas, seeds, digests, protocol or gate.
