requirements:
  - >-
    Do not edit any fixture, config, accepted registry/taxonomy/contract, selected
    artifact byte or dependency. Do not tune, select, refit or change a frozen array,
    score, ranking, family, k, weight, threshold, seed, PCA count or control.
  - >-
    Add one normal source-authority revalidation path for M0Configuration. Every
    fit/load/development-check boundary must recompute its complete canonical mapping
    and self digest, enforce exact strict field types, and compare every scalar/list/
    map/ID/version/digest to the accepted source-pinned authority. A dataclass replace
    that retains the accepted digest but changes any value must fail before reading or
    writing artifact content.
  - >-
    Add one normal complete semantic revalidation path for FeatureRegistry instances.
    Explicitly reconstruct the full nested canonical registry projection from the
    immutable typed fields and recompute the accepted root digest, thereby binding all
    family/schema/definition/control/W04-bridge values as well as IDs and carried
    digests. Do not modify or weaken the accepted feature registry module or bytes.
  - >-
    Revalidate RoleTaxonomy wrapper claim/expert/exemplar fields plus its complete
    normally validated contract. Revalidate typed candidate and query authorities:
    exact accepted identity/count/order/keys, reproduced materialized features/roles,
    cutoff/dependency evidence, full selected or metadata projection pin, exact query
    projection and peer_groups derived from candidate rows. No class-only trust or
    caller-supplied relevance substitution remains.
  - >-
    Manifest load must require exact canonical JSON bytes and compare every evidence-
    or behavior-bearing field to the family-specific accepted authority, including
    both registry digests, descriptor digest, evidence class, population/universe IDs
    and counts, seed, serialization, PCA policies and each descriptor's exact semantic
    role, name, dtype, family shape, little endianness and C order. Self-consistent
    re-signing must not create a new accepted authority.
  - >-
    Fitting must inspect the destination and each existing ancestor before mkdir/write
    and reject destination or ancestor symlinks/resolve drift. Preserve immutable
    create-only writes. This is the only serializer-path hardening admitted in R6.
  - >-
    Canonicalize an exactly tied PCA eigenspace independently of an arbitrary valid
    sign, component order or orthonormal rotation within that eigenspace. Use a
    deterministic projector/standard-axis basis policy only for tied groups, retain
    the existing non-tied R5 selected PCA bytes exactly, and recompute transformed
    vectors from the final components. Document and directly test the invariant.
  - >-
    Expand the dedicated suite into parameterized attacks that directly assert exact
    complete all-six ranking-digest lists; two-build four-file bytes for every family;
    exact distances/contributions/reload; typed config/registry/taxonomy/candidate/query
    forgeries; fully re-signed manifest/universe substitutions; ZIP/object/dtype/shape/
    order/digest/metadata corruption; fit/load symlinks; zero-IQR/norm; PCA sign/tied
    basis/six-feature contribution sums; UUID ties; role restriction; temporal cutoff;
    exemplar permutations and deep immutability. Use the production fit/load/score
    paths and no duplicate scoring implementation.
  - >-
    The R6 return must list exact frozen input and output physical/logical identities,
    full ranking digest lists, exact commands/results and the unchanged development-
    only claim. It must explicitly state that this is not W06 evaluation, validation,
    expert evidence, provider evidence or a recruitment-outcome claim.
deliverables:
  - Normally revalidated source-pinned typed authorities at every M0 boundary.
  - Exact family-specific manifest/array interpretation and safe fitting destination.
  - Tied-eigenspace canonical PCA policy that preserves all frozen R5 bytes.
  - Comprehensive dedicated executable attack suite and mandatory R6 return.
definition_of_done:
  - Both master-reproduced R5 typed config and forged feature-name attacks fail closed.
  - Every independent-review P0/P1 is closed without any frozen identity or score drift.
  - Focused quality/import/local-only checks pass and selected artifact file SHAs remain exact.
