state: PLANNED
objective: >-
  Materialize the controlling W04 data-health JSON and exact Markdown rendering
  from the accepted source authority, real two-run raw-to-Gold outputs and frozen
  runtime evidence, without changing any product or authority byte.
depends_on:
  - W04-WYSCOUT-REAL-ROOT-INVOCATION-01-R1:MASTER_ACCEPTED
