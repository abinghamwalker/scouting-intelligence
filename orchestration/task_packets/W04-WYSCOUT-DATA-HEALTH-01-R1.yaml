forbidden_paths:
  - .git/**
  - .gitignore
  - .venv/**
  - pyproject.toml
  - uv.lock
  - AGENTS.md
  - orchestration/**
  - configs/**
  - migrations/**
  - data/**
  - runs/**
  - scripts/**
  - src/**
  - tests/**
  - docs/**
