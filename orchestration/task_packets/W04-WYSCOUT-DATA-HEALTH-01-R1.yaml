  - reports/reviews/W04/wyscout-schema-design-R20.md
  - reports/phase-gates/W04/source-schema-profile.md
  - reports/verification/W04/wyscout-exact-decimal128-with-exponent-R2-master-acceptance.md
  - reports/verification/W04/wyscout-23-root-schema-closure-R8-master-acceptance.md
