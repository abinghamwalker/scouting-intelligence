  r4_audit_sha256: a6f8f3321dcfdb0c04d231d3e07d06497441ce703716d6e509f3f45b8829c222
  r20_sha256: 8cb2f0d4d4015484453491f1846bd5bd0f41e8b8f11d8e52c0fab81b40078047
  r21_sha256: faff34cc5f8c976809f58d7847038aafd39eac8ac68f6c418d717f74e6287020
  guarded_storage_sha256: 62a026560c4821d123d42afcd3438be18572ec0fef03f1747a0cbcfa97f030ef
  parquet_encoder_sha256: bd849dda61b570378697ce703719c2058fc9c450e298a88a9f1e5f95ad0a7ff4
requirements:
  - Verify every fixed hash and stop on drift before editing.
  - >-
    Add one standalone POSIX local publisher module without modifying or wrapping
    GuardedStorage.write_bytes and without changing the accepted Parquet encoder.
  - >-
    Admit only exact named roots and bounded normalized POSIX relative tails.
    Open/traverse descriptor-relatively with O_NOFOLLOW and reject absolute,
    empty, dot, dot-dot, duplicate-separator, backslash, NUL, symlink and escape paths.
  - >-
    Create directories at 0700 and staged/final files at 0600. Use the exact
    serializer-owned `.partial` staged name; write all bytes, fsync file and
    directories, reopen no-follow, run the caller validator, and recheck final
    code/environment/resource inputs before promotion.
  - >-
    Promote on the same filesystem atomically without replacement through a
    hard-link/no-replace operation. On success remove the staged name and prove
    final link count one. Equal-byte final replay is idempotent; unequal bytes,
    races, links/symlinks, cross-device behavior, mode drift and changed final
    recheck fail closed without replacing evidence.
  - >-
    Create no digest sidecar. Preserve failed staged evidence, never overwrite an
    existing final, never chmod an attacker-controlled object, and return an
    immutable result binding path, byte count and physical digest only after final
    guarded readback.
  - >-
    Tests use tmp_path only and cover exact replay, unequal final, staged/final
    symlink/hardlink/FIFO/nonregular cases, path traversal, permissions, partial
    write, validator failure, fsync/reopen/recheck failure, link race,
    cross-device simulation and final link-count/readback checks.
  - No real data/working, data/manifests or runs path may be created.
acceptance_checks:
  - uv run ruff format --check src/scouting/storage/wyscout_publication.py tests/unit/test_w04_staged_product_publisher.py
  - uv run ruff check src/scouting/storage/wyscout_publication.py tests/unit/test_w04_staged_product_publisher.py
  - uv run mypy src/scouting/storage/wyscout_publication.py tests/unit/test_w04_staged_product_publisher.py
  - uv run pytest -q tests/unit/test_w04_staged_product_publisher.py tests/unit/test_w04_wyscout_product_formats.py tests/unit/test_guarded_storage.py
  - uv run python scripts/verify_local_only.py
deliverables:
  - Sidecar-free publisher, adversarial tests and mandatory return.
stop_conditions:
  - R20 publication semantics or any fixed binding must change.
  - A sidecar, replace/overwrite, real product path, dependency or GuardedStorage/encoder edit is required.
  - Any Git, provider/network or external-infrastructure action is required.
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
self_approval: forbidden
