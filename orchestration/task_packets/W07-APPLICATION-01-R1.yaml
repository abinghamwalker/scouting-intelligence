  - uv run mypy src/scouting/web/w07.py src/scouting/web/__init__.py services/api/w07_main.py
  - uv run pytest -q tests/integration/test_w07_local_evidence_app.py tests/e2e/test_w07_local_evidence_playwright.py tests/integration/test_w05_m0_serving.py tests/e2e/test_w05_m0_retrieval.py
  - uv run lint-imports
stop_conditions:
  - Any need to open or reconstruct a protected expected-retrieval fixture or run the W06 protected gate.
  - Any need to change accepted contracts, feature/taxonomy/model authorities, artifact bytes or scoring semantics.
  - Any second scoring implementation, unsupported evidence substitution or positive retrieval-quality claim is required.
  - Any new dependency, Node toolchain, external request/service, provider access, public endpoint, deployment, secret, destructive action or Git operation is required.
  - Required work falls outside allowed_paths.
