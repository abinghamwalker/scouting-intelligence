requirements:
  - >-
    Build server-rendered Jinja templates and local CSS/assets only. Provide design
    tokens, responsive layout/navigation, skip link, visible focus, semantic landmarks,
    accessible tables and distinct loading, error, empty, unavailable and NO_GO states.
    Add no JavaScript requirement, Node tooling, external asset or network request.
  - >-
    Provide a local landing page, synthetic-development search, player evidence,
    retrieval, comparison and evidence/validation centre. A user must reach a result
    or explicit unavailable/NO_GO state in at most three clicks from landing. Every
    result must visibly expose source, model/version, feature and taxonomy identities,
    cutoff/window, confidence, applicability, lineage and limitations.
  - >-
    Visually and semantically distinguish W04 accepted real-data descriptive evidence,
    W05 synthetic-development retrieval evidence and unavailable/suppressed measures.
    Present the W04 bridge as exactly action_count, coordinate_known_action_count,
    match_count and resolved_possession_action_count; elapsed minutes, rates and per-90
    remain SUPPRESSED. Never substitute another value for absent evidence.
  - >-
    Retrieval and comparison must call the accepted M0ServingCore only through the
    public serve_m0_request/serve_m0_batch path. Do not copy or implement distance,
    scaling, contribution, role-overlap or ranking arithmetic. Expose role-aware output,
    contrastive/dimension contribution evidence, reason codes, confidence/applicability,
    underlying values and the accepted identities/digests. Do not display a match
    percentage, blended score, recommendation or outcome-prediction label.
  - >-
    The evidence centre and all result surfaces must make W06 NO_GO and
    MISSING_EXPERT_RELEVANCE_EVIDENCE prominent. Explain that a future positive rerun
    requires governed expert relevance evidence, but do not access, inspect, acquire,
    infer or execute protected evidence. Do not say validated, expert-approved,
    recommended, transferable, recruitment-success, price/value or production-ready.
  - >-
    Add focused TestClient integration tests and genuine Python Playwright journeys for
    desktop/mobile, keyboard focus/navigation, semantic landmarks/headings/labels,
    three-click completion, empty/unavailable/error/loading/NO_GO states, request/batch
    scorer parity, accepted digests, forbidden wording and absence of external requests.
    Tests must use the existing Python/uv dependency set and a real local application.
deliverables:
  - Complete local W07 composition module and loopback entrypoint.
  - Server-rendered W07 templates and local responsive CSS.
  - Focused integration and Python Playwright evidence.
  - Mandatory producer return with exact commands, outcomes and scope confirmation.
definition_of_done:
  - G-W07 behaviours 1 through 8 are directly witnessed by focused tests.
  - The accepted scorer is spied through the public path and no second scorer exists.
  - W06 NO_GO cannot be mistaken for positive validation on any result surface.
  - No protected output or forbidden path is opened or changed.
