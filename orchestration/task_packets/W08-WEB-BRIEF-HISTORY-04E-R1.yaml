deliverables:
  - Analyst-only brief creation form exposing fixed local template/taxonomy, selectable supported responsibility codes, one transparent preference weight, one supported hard constraint and one selectable local synthetic-development exemplar sourced from the retained public W07 request.
  - Queue and detail controls shown only when the current role is authorised: analyst owner create/submit/correct/replay, approver approve/reject, scout approved read only, admin no workflow mutation.
  - Controlled rejection reason plus bounded decision note; rejection is mechanically usable and persists attributable submitted/decided fields.
  - Rejected-to-draft correction parses the submitted exact replacement content, clears submission/decision fields as required by the contract, uses expected optimistic lock and appends one changed version without altering any rejected row.
  - Render every version's template, taxonomy, visibility, responsibilities, constraints, preferences/weights, exemplars, transition/rejection reason, note, submission/decision times and actors. State that weights are retained replay context and are not applied by W05 scoring.
  - Generic cross-role, foreign-object, bad CSRF, stale-lock and invalid-field failure with no role-brief or audit partial state.
definition_of_done:
  - One focused automated chain proves create with exact fields -> submit -> reject -> correct changed draft -> resubmit -> approve, retaining all five immutable versions and exact old/new interpretations.
  - This packet does not change replay persistence, candidate selection, shared contracts/services, W05/W07 code, dependencies or evidence claims.
focused_checks:
  - Full five-version chain and per-version field/actor/timestamp assertions.
  - Role-correct rendered controls and direct unauthorised POST denial.
  - Stale, invalid, CSRF and foreign-ID attempts leave revision, lock and receipt counts unchanged.
acceptance_checks:
  - uv run ruff format --check src/scouting/web/w08.py tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py
  - uv run ruff check src/scouting/web/w08.py tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py
  - uv run mypy src/scouting/web/w08.py
  - uv run pytest -q tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py
stop_conditions:
  - A shared contract/service/policy/migration/dependency, W05/W07 or protected-output change is required.
  - A network/provider/model call, fitting/training, Node/npm, container, destructive action or Git operation is required.
  - Correctness would require rewriting history, inventing a responsibility/exemplar, bypassing policy or widening evidence claims.
mandatory_return:
