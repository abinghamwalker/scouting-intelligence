schema_version: 1
task_id: W04-SCHEMA-DESIGN-REVIEW-01
phase_id: W04
revision: R13
state: DISPATCHED
objective: >-
  Perform a fresh independent merits review of the complete standalone R20
  design under the exact no-write preflight/postflight harness, and issue PASS
  only if no P0-P2 candidate defect remains.
depends_on:
  - W04-SCHEMA-DESIGN-01-R20:MASTER_ACCEPTED
  - W04-SCHEMA-DESIGN-REVIEW-01-R12:MASTER_REWORK
assigned_role: fresh_independent_data_architecture_reviewer
risk: high
read_first:
  - AGENTS.md
  - orchestration/task_packets/W04-SCHEMA-DESIGN-REVIEW-01-R13.yaml
  - reports/reviews/W04/wyscout-schema-design-R20.md
  - reports/reviews/W04/returns/W04-SCHEMA-DESIGN-01-R20.md
  - orchestration/task_packets/W04-SCHEMA-DESIGN-01-R20.yaml
  - orchestration/reviews/REVIEW-W04-SCHEMA-DESIGN-01-R20.yaml
  - reports/verification/W04/wyscout-schema-design-R20-master-verification.md
  - orchestration/reviews/REVIEW-W04-SCHEMA-DESIGN-REVIEW-01-R12.yaml
  - reports/verification/W04/wyscout-schema-design-independent-review-R12-master-verification.md
  - reports/reviews/W04/wyscout-schema-design-independent-review-R12.md
  - reports/phase-gates/W04/source-schema-profile.md
