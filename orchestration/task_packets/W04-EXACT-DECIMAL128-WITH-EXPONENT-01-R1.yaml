requirements:
  - Verify the fixed implementation/test/R5 hashes before editing and report the authorization file hash.
  - >-
    Add exactly one projection kind named EXACT_DECIMAL128_WITH_EXPONENT. It is a
    logical scalar represented by a WyscoutArrowStructNode whose only admitted
    children, in exact order, are non-null `value` identity decimal128(22,18),
    non-null `exponent` identity int8, and non-null `negative_zero` identity bool.
    No metadata, aliases, child nulls, alternate order/type/name or logical-position
    state is admitted.
  - >-
    Add a focused public forward helper that accepts only an exact finite built-in
    Decimal plus an optional exact declared source scale, reruns the accepted
    decimal128(22,18) lexical capacity rule, requires declared scale equality when
    supplied, proves rescaling to the physical scale requires no rounding, and
    returns only the exact three-child physical mapping. Preserve the tuple exponent
    and set negative_zero exactly for signed zero; never set it for nonzero values.
  - >-
    Inverse projection must accept only the exact physical struct, validate the
    three runtime child values, reject negative_zero=true for nonzero, reconstruct
    the exact original exponent with a trapping/no-rounding operation, restore
    negative zero, rerun the accepted capacity/source-scale rule, and return the
    exact logical Decimal JSON token so the existing whole-row byte equality remains
    controlling before semantic hashing/writing.
  - >-
    Keep all coverage Decimal fields and their helper on CANONICAL_DECIMAL_UTF8.
    Preserve generic serializer behavior and the accepted semantic digest framing
    and formula. Derived descriptor/physical/vector bytes for the new kind need not
    match earlier scalar-decimal bytes.
  - >-
    Add focused success/adversarial tests for scale 0/18, positive exponent,
    trailing zeros, signed zero, capacity boundaries, wrong logical/runtime types,
    malformed exponent/sign, nonzero negative_zero, null children, descriptor
    child/order/type/nullability/metadata drift, rounding attempts and capacity
    failures. Instrument hashing and pq.write_table and require zero calls for every
    invalid inverse/schema path.
  - Do not map any W04 logical contract field in this packet; R5 owns descriptor adoption after acceptance.
