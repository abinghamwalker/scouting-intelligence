master_counterexamples:
  - >-
    R5 had two live complete metric/bootstrap paths and diverged at undeclared k plus
    integer-score input identity. Confirm R6 has one live primitive calculation owner,
    with every general, robustness and validator surface only adapting its result.
  - >-
    Tests currently contain none of the literal mandated parent digests
    fa8bea37b980b8761427695e18840789f6ea4da26f63fc73d581d42e8776a8fb,
    e67c82c8800e1e4c0efa360153cd918f36d21859079ef630b3fe3d2fab477815,
    and 2e70e316301230b85db9bae9785c16f431f1cf3a251affd9ba3d792174741404.
review_questions:
  - Is evaluation_calculations the sole live owner of all rank metric/bootstrap values, statuses, identities, resampling and percentile behavior?
  - Do general, robustness and validator adapters enforce the same declared-k, metric, score and ordering boundary?
  - Are partial on/off, zero denominator, insufficient population, missing labels, ties, integer/float scores and interval identities either cross-path tested or guaranteed by the sole call path?
  - Are all three original substituted parents literally reconstructed, identity-pinned and rejected in committed tests?
  - Are public fixture and result identities unchanged with all prior closures retained?
deliverables:
  - One report-only ACCEPT or REWORK verdict with exact P0/P1 counts, call-path matrix, boundary matrix and three-parent test evidence.
  - Mandatory return at reports/reviews/W06/returns/W06-EVAL-ROBUSTNESS-REVIEW-04-R6.md.
definition_of_done:
  - The single-core implementation and original witness regression coverage are independently adjudicated.
  - Additional findings are limited to actual metric, interval, identity, population, leakage, applicability or protected-decision effects.
  - Review remains public-only and does not access protected expected outputs.
acceptance_checks:
  - uv run --no-sync pytest -p no:cacheprovider -q tests/contracts/test_w06_evaluation_contracts.py tests/unit/test_w06_evaluation_metrics.py tests/contracts/test_w06_robustness_contracts.py tests/unit/test_w06_robustness.py
  - uv run --no-sync ruff check src/scouting/contracts/evaluation_calculations.py src/scouting/contracts/evaluation.py src/scouting/contracts/__init__.py src/scouting/evaluation tests/contracts/test_w06_evaluation_contracts.py tests/unit/test_w06_evaluation_metrics.py tests/contracts/test_w06_robustness_contracts.py tests/unit/test_w06_robustness.py
  - uv run --no-sync mypy src/scouting/contracts/evaluation_calculations.py src/scouting/contracts/evaluation.py src/scouting/evaluation
  - uv run --no-sync lint-imports
  - shasum -a 256 tests/fixtures/w06/public-evaluation-v1.json tests/fixtures/w06/public-robustness-v1.json
stop_conditions:
  - A required check needs protected expected-output, external/provider, credential or new-dependency access.
  - A required write falls outside allowed_paths or overlaps unexpected user work.
  - A secret, restricted datum or destructive action is encountered.
mandatory_return_requirements:
  - task ID and exact changed-file list
  - final verdict and exact severity counts
  - exact one-core call path and boundary matrices
  - exact three-parent runtime and test outcomes
  - exact focused commands/statuses/results
  - remaining P0/P1 risks and smallest correction or none
  - no Git/dependency/protected/external/out-of-scope confirmation
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
self_approval: forbidden
