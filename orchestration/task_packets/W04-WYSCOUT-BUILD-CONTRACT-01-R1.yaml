requirements:
  - Verify every fixed hash and stop on drift before editing.
  - >-
    Keep the new contracts module standalone: standard library plus Pydantic only;
    it must import no other scouting module and perform no filesystem/network write.
  - >-
    Implement the exact canonical five-key window object in R20 order and strict
    half-open/cutoff/snapshot/valid-from rules. Reproduce window identity UUID
    a0af8d56-e41d-5467-b46e-82887c4861e0 from the frozen namespace/name/preimage.
  - >-
    Implement one bounded strict season UUID helper that admits only non-Boolean
    integer 181150 for this W04 product and returns
    4696aa1f-b512-5d18-af79-33cf031455cf through the documented UUIDv5 chain.
    Reject every other type/value; do not add a generic season identity kind.
  - >-
    Model the exact ordered five accepted authority references: field-v2,
    possession-v2, four-feature registry, identity-v1 and the new season/lineup
    acceptance. The fifth reference may appear only inside the existing
    authority_rows projection member.
  - >-
    Implement the exact R20 25-key pre-build projection, canonical JSON UTF-8 NFC
    without BOM/whitespace/terminal LF, one SHA-256 build ID, strict inverse from
    the post-hash 25-key invocation by removing only build_id and restoring only
    schema_version. Reject a 26th key, second hash, reordered/duplicate rows,
    Boolean integers, noncanonical clocks/UUIDs/digests and any substituted input.
  - >-
    Implement the exact closed nine-key rebuild-invocation receipt and 15-key
    temporal-boundary receipt with started_at <= checked_at <= completed_at,
    strict readback/lineage/build/run/product/manifest bindings and no optional
    placeholder/null route forbidden by R4.
  - >-
    Implement strict closed models for exactly the eight R4 result roles:
    ENTRYPOINT_SOURCE_RESULT, COMPONENT_PROOF_RESULT, PRE_BUILD_ADMISSION_RESULT,
    REBUILD_RECEIPT_SUMMARY, LAYER_MANIFEST_SUMMARY, FINAL_RECHECK_RESULT,
    POST_BUILD_ID_REBUILD_RESULT and CHILD_RESULT_ENVELOPE. Preserve R20/R4 field,
    state, dependency and failure semantics; no ninth model/role.
  - >-
    Add exhaustive closed tests for key/order/type equality, canonical bytes,
    UUID/digest reconstruction, one-hash inverse roundtrip, fifth-authority-only
    integration, clock inequalities, receipt/result substitutions and malformed
    or expanded inputs. Tests create no real product, aggregate or run byte.
  - Add no schema aggregate/materializer, product writer, dependency or public export.
