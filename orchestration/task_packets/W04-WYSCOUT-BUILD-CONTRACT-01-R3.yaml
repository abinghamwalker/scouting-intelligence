findings:
  - id: W04-BUILD-R2-P1-UNATTESTED-LAYER-MANIFESTS
    priority: P1
    evidence: >-
      R2 accepts ordinary manifest dictionaries. Its three positive manifests pass
      receipt closure but fail the accepted LayerManifest validator, so the claimed
      closed-schema prerequisite is not executable at the composition seam.
  - id: W04-BUILD-R2-P1-CALLER-DIGEST-REHASH
    priority: P1
    evidence: >-
      Coherently changed Gold physical/semantic and temporal-proof claims pass when
      manifest summaries, boundary bytes and caller digest parameters are rehashed;
      no product or proof content is supplied from which those digests are derived.
requirements:
  - Verify every fixed hash and stop on drift before editing.
  - >-
    Preserve every R2 admission, window, season, competition, authority, dependency,
    projection/inverse, receipt/result roster and sole R4 layer-semantic behavior.
    Preserve all R1/R2 and failed-review evidence bytes. Add no root, result role,
    feature, product row, population, aggregate, writer or publication permission.
  - >-
    Replace the plain-dict manifest composition member with an exact content-bound
    input that invokes the already-accepted `wyscout_data.LayerManifest` validator on
    the exact canonical physical readback. A model constructed without validation,
    ordinary dict, caller Boolean, raw digest or free-standing attestation must not
    establish schema validity. Revalidate from bytes, require exact typed dump/readback
    equality, then repeat R2 physical, authority, sole-semantic, parent and Gold
    population equalities. Do not copy or redefine the LayerManifest schema.
  - >-
    Replace `gold_product_physical_sha256`, `gold_product_semantic_sha256` and
    `temporal_proof_sha256` caller claims with synthetic in-memory exact readback
    content or an opaque content-bound adapter that independently validates the
    already-authorized `GOLD_PLAYER_WINDOW` and `W04SemanticTemporalProof` roots and
    uses the accepted W04 Parquet physical/semantic rules. Derive physical digest,
    positive size, exact row count one, semantic digest and canonical temporal-proof
    digest from those inputs before comparing manifest, boundary and receipt.
    Mutually agreeing caller strings, Booleans or directly constructible claim-only
    models remain insufficient.
  - >-
    It is permissible to compose the already-accepted repository LayerManifest,
    Gold/temporal models and Parquet helpers through bounded internal/lazy imports;
    this is an existing root dependency, not a new schema root or uv dependency.
    Keep the code side-effect free and in-memory: no filesystem scan/read/write,
    product materialization, provider/network/process action or external service.
  - >-
    Rebuild the three positive manifest fixtures from complete objects that genuinely
    pass the accepted LayerManifest validator. The Gold readback fixture must be a
    genuine one-row synthetic in-memory product whose parsed typed row, physical
    bytes, semantic preimage, parent paths and temporal proof bind exactly.
  - >-
    Add adversarial tests proving: each R2 locally-shaped but closed-schema-invalid
    manifest fails; model-construct/bypass and readback-object/byte mismatch fail;
    coherent Gold product physical, semantic and temporal-proof substitutions fail
    even when every manifest summary, boundary, receipt and child digest is rehashed;
    malformed/empty/additional-row, schema/parent/path/window/cutoff/lineage drift
    fails; and unchanged exact readback passes.
  - >-
    Run the full R2 suite plus accepted data-contract and Parquet-format integration
    tests needed to prove composition. No real product, manifest, receipt or run byte
    may be created.
