defects:
  - severity: P0
    evidence: reports/reviews/W06/evaluation-core-independent-review-R1.md#W06-EC-R1-01
    affected_definition_of_done: ACCEPT_CLAIM cannot be constructed from unrelated or ineligible objects.
    required_fix: >-
      Add an actual canonical nested decision envelope or equivalently strong validated
      relation: identical protocol/bundle/access/run identities; valid protected
      membership; exact frozen candidate identity; query cutoff not after decision
      cutoff; one unique access consumption/run identity; non-empty required results;
      and governed-human evidence for claim eligibility. IMPLEMENTATION_FIXTURE must be
      structurally ineligible for CALIBRATION, PROTECTED_TEST, PROSPECTIVE and
      ACCEPT_CLAIM. Opaque unrelated digest strings are insufficient.
  - severity: P1
    evidence: reports/reviews/W06/evaluation-core-independent-review-R1.md#W06-EC-R1-02
    affected_definition_of_done: All nested evidence identities and substitutions fail closed.
    required_fix: >-
      Introduce a self-verifying canonical aggregate digest over protocol, rubric,
      exact reviewer roster, query/candidate universe identities, exclusive memberships,
      relevance, unordered pair preferences, hard negatives and adjudications. Require
      canonical ordering/semantic uniqueness; exact roster/rubric binding for every row;
      candidate membership; valid disagreement references and eligible adjudicator.
  - severity: P1
    evidence: reports/reviews/W06/evaluation-core-independent-review-R1.md#W06-EC-R1-03
    affected_definition_of_done: Precision/Recall/NDCG denominators and ties are protocol-bound.
    required_fix: >-
      Make RankingRow carry the frozen candidate universe, an explicit mutually exclusive
      per-item RELEVANT/PARTIAL/IRRELEVANT/UNJUDGED/ABSTAIN label state and deterministic
      tie groups/score-order policy. Evaluate with an EvaluationProtocol, enforce k in
      declared_k, reject out-of-universe/overlapping states, freeze partial gain and its
      Precision/Recall treatment, and return explicit unavailable results whenever the
      frozen missingness policy does not admit a denominator. Never default absent labels
      to irrelevant or zero.
  - severity: P1
    evidence: reports/reviews/W06/evaluation-core-independent-review-R1.md#W06-EC-R1-04
    affected_definition_of_done: Comparison, preference and agreement metrics are valid and complete.
    required_fix: >-
      Declare and implement same-complete-universe or reranked-intersection Spearman with
      deterministic tie behavior and [-1,1] range; explicit overlap count/rate and
      Jaccard; replacement churn in [0,1]; pair-preference accuracy over canonical
      unordered eligible non-abstaining pairs; and a declared inter-rater agreement
      statistic with missing/abstention/insufficiency behavior.
  - severity: P1
    evidence: reports/reviews/W06/evaluation-core-independent-review-R1.md#W06-EC-R1-05
    affected_definition_of_done: Bootstrap, result, interval and run identities are deterministic and relationally bound.
    required_fix: >-
      Add protocol fields for resampling unit, seed, count, confidence, percentile method,
      primary/secondary metric roster and missingness policy. Bind input/resample/result
      digests to canonical query IDs, per-query statuses/values, metric, k and every
      setting. Validate metric enum/range/formula; require exact interval method/link,
      lower <= point <= upper, no unavailable bounds; enforce canonical unique non-empty
      metric/interval/slice/failure run rosters.
