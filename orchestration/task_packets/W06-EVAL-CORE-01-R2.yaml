deliverables:
  - Corrected strictly relational evaluation/protected-decision contracts closing every P0/P1 attack.
  - Corrected protocol-bound metric, rank-comparison, pair/agreement and bootstrap implementation.
  - Public fixture loaded by tests and expanded adversarial coverage for every reproduced P0/P1 counterexample.
  - Complete mandatory return at reports/reviews/W06/returns/W06-EVAL-CORE-01-R2.md.
definition_of_done:
  - Every P0/P1 constructor and metric counterexample in the R1 independent report now rejects or returns the exact declared unavailable result.
  - ACCEPT_CLAIM cannot validate from fixture authority, missing governed reviewers, non-protected/reused access, empty/unavailable results, or mismatched identities.
  - Missing/unjudged/abstained evidence never becomes irrelevant/zero and all metric values/ranges/formulas are exact.
  - Declared k, universe, tie, partial-gain, correlation, agreement, bootstrap and interval policies are mechanically enforced.
  - Canonical nested digests and collection order reproduce identically under input reordering while semantic substitution changes identity or rejects.
  - Public fixture tests assert its implementation-only authority and exact bytes/digest without creating expert/protected evidence.
  - No protected result/protocol threshold is tuned or executed and accepted W03/W04/W05 bytes remain unmodified.
acceptance_checks:
  - uv run pytest -q tests/contracts/test_w06_evaluation_contracts.py tests/unit/test_w06_evaluation_metrics.py
  - uv run ruff check src/scouting/contracts/evaluation.py src/scouting/evaluation tests/contracts/test_w06_evaluation_contracts.py tests/unit/test_w06_evaluation_metrics.py
  - uv run mypy src/scouting/contracts/evaluation.py src/scouting/evaluation
  - uv run lint-imports
stop_conditions:
  - Correction requires a new dependency, protected expected-output access, external/provider access or a credential.
  - Correction requires inventing an expert, protected population/result, threshold or claim.
  - Correction requires an edit outside allowed_paths or accepted W03/W04/W05 bytes.
  - Unexpected user-owned work overlaps an allowed path.
  - A secret, restricted datum or destructive action is encountered.
mandatory_return_requirements:
