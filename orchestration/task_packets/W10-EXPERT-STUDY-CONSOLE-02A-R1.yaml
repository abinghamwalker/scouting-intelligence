requirements:
  - The web process may load only the frozen protocol and participant-safe presentation bundle, never the evaluator query pack, W09 router/runtime, provenance, rank, score, method, arm, threshold result, labels, or aggregate result.
  - Serve one simple loopback study entry URL at /w10 with the concise human approval page, pilot entry, and formal participant entry as applicable.
  - Require an explicit human product-owner pseudonym and exact confirmation before creating an immutable ProtocolApproval; never auto-approve in code, tests, startup, or fixtures.
  - Formal preparation requires an existing exact-digest approval plus protocol-defined eligibility, material-conflict handling and all consent items. Pilot is plainly labelled and needs no expert claim.
  - Implement the 82-presentation formal journey: all 80 blinded primary candidates plus two delayed blinded repeats, participant-keyed deterministic order, neutral slot/task identities, relevance 0-4, confidence 1-5, explicit abstain/unable, optional bounded failure category/explanation, progress, resume, review, submit-once and local receipt.
  - Use separate pilot.sqlite3 and formal.sqlite3 authorities and separate immutable capture roots. Pilot captures can use only the first two queries, never instantiate FormalStudySubmission, never enter formal tables/files, and never unlock a gate.
  - Use exact command-id retry and expected-revision semantics; same command/same bytes is idempotent, reused command/different bytes or stale revision is 409; SQLite transactions and uniqueness constraints must make concurrent completion safe.
  - A completed formal session and its canonical content-addressed FormalStudySubmission/CompletionReceipt files are immutable. Exact duplicate completion returns the same receipt.
  - No fictional sign-in, roles, workflow tasks, terminal instructions, browser storage, innerHTML, external request, arbitrary record lookup, evaluator route, /api/w09 route, or relevance verdict.
  - Add security headers, bounded strict form/JSON parsing, process-random CSRF HttpOnly SameSite=Strict cookies, safe text-node rendering, accessible semantic landmarks/focus/status and responsive 320px layout.
  - Missing, ambiguous or digest-incompatible authority must expose a neutral 503 page and no participant mutation routes; never fall back to synthetic/alternate data.
  - Tests may use TEST_ONLY stores/fixtures but may not write to real pilot/formal roots or create a real approval/formal evidence artifact.
deliverables:
  - All allowed implementation, test, asset, and return paths listed above.
definition_of_done:
  - Focused unit/integration/browser tests prove the full accessible journey, leakage absence, pilot/formal separation, resume, abstain/missingness, idempotency, concurrency, immutable completion and stale-authority rejection.
acceptance_checks:
  - uv run pytest -q tests/unit/test_w10_expert_study_web.py
  - uv run pytest -q tests/integration/test_w10_expert_study_console.py
  - uv run pytest -q tests/e2e/test_w10_expert_study_playwright.py
  - uv run ruff format --check src/scouting/storage/expert_study.py src/scouting/web/w10_expert_study.py services/api/w10_study_main.py tests/unit/test_w10_expert_study_web.py tests/integration/test_w10_expert_study_console.py tests/e2e/test_w10_expert_study_playwright.py
  - uv run ruff check src/scouting/storage/expert_study.py src/scouting/web/w10_expert_study.py services/api/w10_study_main.py tests/unit/test_w10_expert_study_web.py tests/integration/test_w10_expert_study_console.py tests/e2e/test_w10_expert_study_playwright.py
  - uv run mypy src/scouting/storage/expert_study.py src/scouting/web/w10_expert_study.py services/api/w10_study_main.py
stop_conditions:
  - Any need for real approval/participant evidence, evaluator/query-pack bytes in the web process, Git, dependency changes, network/deployment, or edits outside allowed_paths.
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
self_approval: forbidden
