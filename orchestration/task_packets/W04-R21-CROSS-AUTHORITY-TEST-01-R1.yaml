  - >-
    Prove an accepted canonical field-v2 action composes through the accepted
    possession-v2 resolver and that only the applicable frozen feature row is
    selected for the resolved possession case.
  - >-
    Encode the exact 30-resource roster in the R21 order, preserving all v1
    paths at positions 1-17, uniqueness, and exclusion of products, returns,
    generated evidence, and directory shorthand.
  - >-
    Exercise cross-authority negatives by mutating in-memory copies or
    temporary paths only. Never alter or materialize an authority, product,
    manifest, receipt, serializer, build, Bronze, Silver, or Gold path.
  - >-
    The future fixed review and master-gate assertions must fail closed while
    those artifacts are absent and must validate exact physical binding once
    independently created; do not create either artifact in this packet.
  - >-
    Start and finish on the retained inventory using root uv --locked
    --no-sync, PYTHONDONTWRITEBYTECODE=1, and Python -B. Do not clean, repair,
    sync, install, run Git, delegate, self-approve, or make network, cloud,
    container, endpoint, hosted-CI, deployment, or product changes.
