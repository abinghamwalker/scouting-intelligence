review_requirements:
  - Verify every fixed hash before analysis and stop on drift.
  - >-
    Strict-load and byte-reproduce the canonical decision. Independently compare
    every rule with the exact user authorization rather than relying on the
    producer or master conclusions.
  - >-
    Prove present CanonicalJsonValue is non-null exact canonical tagged logical
    JSON UTF-8 without LF; its inverse rejects invalid UTF-8, duplicate keys,
    invalid constants, typed-invalid values and any noncanonical byte spelling;
    outer optionality alone may use Arrow null.
  - >-
    Prove heterogeneous fixed tuples are exact descriptor-owned ordered
    positional structs and homogeneous sequences are descriptor-owned Arrow
    lists, including child names, types, positions, ordering, nullability and
    tuple/list cardinality requirements.
  - >-
    Attack fixture, row, observed-value, empty-sequence and caller inference,
    Arrow union authority, lossy decoding, caller proof substitutes, and any
    attempt to use Arrow null for present canonical JSON null.
  - >-
    Confirm schema generation is permitted only from independently accepted
    descriptor content and that no implementation/schema/product byte is granted
    by this authority-only lifecycle.
  - >-
    Independently prove the semantic digest version, framed preimage, formula and
    inputs are unchanged. The projection can affect only the existing physical
    schema descriptor input; it adds no digest field, path, preimage or derivation.
  - >-
    Confirm there is no root, logical field, semantic, feature, population,
    dependency, provider-access, publication, cloud, container, hosted-CI,
    deployment or Git-remote expansion.
  - >-
    Confirm the authority test is progression-safe and does not bind mutable
    implementation hashes or permanent absence of later authorized product paths.
  - >-
    Write one canonical machine-readable review fence at the allowed authority
    review path. Return PASS only with zero P0/P1/P2 findings; otherwise REWORK.
definition_of_done:
