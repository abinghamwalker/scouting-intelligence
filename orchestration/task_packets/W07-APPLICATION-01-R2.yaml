requirements:
  - >-
    Preserve the W03 exports in scouting.web.__init__ and add create_w07_app once.
    Make request construction fully typed and pass format, lint and mypy.
  - >-
    Mount only the repository-local W07 static directory. Apply a restrictive local
    content security policy and render a consistent base document with lang, viewport,
    skip link, header/nav/main/footer, one h1, visible focus and no external asset.
  - >-
    Implement landing, search/filter, individual player evidence, retrieval, genuine
    two-player comparison, evidence centre and explicit loading, empty, unavailable,
    error and NO_GO pages. The landing-to-search-to-player-to-retrieval journey must be
    at most three link/button activations; NO_GO must be visible on landing and results.
  - >-
    Every evidence-result page must display local source, model ID/version, artifact and
    manifest digest, feature registry/schema identity, taxonomy ID/version/digest,
    configuration digest, data/model window, cutoff, confidence, LIMITED applicability,
    limitations and lineage. Search/player views are synthetic-development evidence;
    W04 is shown separately as descriptive real-data evidence.
  - >-
    Retrieval and comparison must call only serve_m0_request/serve_m0_batch over
    M0ServingCore. Expose ranks/distances as resemblance geometry, reason codes,
    evidence dimension states, and each feature's query/candidate value/contribution in
    accessible tables. Never implement scoring arithmetic or present a blended percent.
  - >-
    Present W04 exact descriptive values action_count=2,
    coordinate_known_action_count=2, match_count=1 and
    resolved_possession_action_count=2, while elapsed minutes, rates and per-90 remain
    SUPPRESSED. Present W06 NO_GO / MISSING_EXPERT_RELEVANCE_EVIDENCE prominently and
    retain the resemblance_only, synthetic-development-only, LIMITED boundary.
  - >-
    Integration tests must spy the accepted public serving calls, prove request/batch
    byte parity, exact accepted result/lineage/manifest/registry/taxonomy/configuration
    digests, artifact-file immutability, complete result metadata, all explicit states,
    CSP/local-assets, prohibited claim/score-label absence and W04 exact values.
  - >-
    E2E tests must use playwright.sync_api (not TestClient) against a real loopback
    uvicorn application. Cover Chromium desktop and mobile viewports, click-count path,
    keyboard Tab/Enter and visible focus, landmarks/headings/labels/tables, horizontal
    overflow, every explicit state, NO_GO, and interception proving zero external HTTP
    requests. Do not install a browser or dependency; use the existing environment.
deliverables:
  - Corrected complete W07 application and local assets.
  - Complete focused TestClient and genuine Playwright acceptance evidence.
  - Mandatory R2 return with exact commands, results, browser details and scope confirmation.
