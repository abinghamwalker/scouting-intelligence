    Add normal-constructor regressions for comparison parent
    fa8bea37b980b8761427695e18840789f6ea4da26f63fc73d581d42e8776a8fb,
    control metric parent
    e67c82c8800e1e4c0efa360153cd918f36d21859079ef630b3fe3d2fab477815,
    and stress metric/interval parent
    2e70e316301230b85db9bae9785c16f431f1cf3a251affd9ba3d792174741404.
    Each must reject for exact value derivation while unmodified public identities pass.
  - >-
    Re-pin fixture identities only where the shared implementation mechanically changes
    canonical bytes. Retain all prior exact closure regressions and implementation-only
    evidence boundaries.
