    RankedObservation rows, metric and k. Use the same accepted formula path from core
    production and owning stress/control validators. Require exact per-query and
    aggregate MetricResult equality, not only input digests or internal arithmetic.
  - >-
    Reconstruct the exact deterministic bootstrap interval for each StressCohort from
    its persisted rows, protocol, metric and k, including point, resample identity,
    bounds and digest; require complete equality. Preserve seed, resample unit/count,
    confidence, method and stable ordering without changing accepted formulas.
