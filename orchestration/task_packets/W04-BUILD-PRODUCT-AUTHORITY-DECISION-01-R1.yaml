    state `AUTHORITY_ONLY_NO_PRODUCT_BYTES`.
  - >-
    Bind all fixed inputs by exact relative path and physical digest. Preserve rather
    than rewrite R20/R21/v1/index/R2/R3/R4 bytes.
  - >-
    Freeze the exact half-open window, selected-match snapshot, strict cutoff,
    valid-from maximum rule, five-key canonical window object, namespace/name
    UUIDv5 algorithm, canonical match/provider/source IDs and no terminal LF preimage.
  - >-
    Freeze the accepted completion-index path/content address, source/member binding,
    source row count, match IDs and exact ordered 1H=901 and 2H=867 population digests.
  - >-
    Freeze exactly the 23 R4 required root roles in order and only the acyclic
    implemented-schema-v2 materialization rule. Do not serialize any absent v2 schema
    content digest, bundle digest, product digest, placeholder, null or anticipated value.
  - >-
    Freeze the v2 product-preimage key roster/rules, exact publication order,
    nine-key invocation receipt and 15-key boundary receipt, guarded readback and
    `started_at <= checked_at <= completed_at` clock predicate, without creating an
    aggregate instance or receipt.
  - >-
    Freeze exactly the R20 25-key pre-build projection roster, schema version, one
    canonical SHA-256 build algorithm, exact inverse reconstruction and post-hash
    replacement of only `schema_version` by `build_id`; forbid a 26th key or second hash.
  - >-
    Freeze the sole two-key complete-LayerManifest semantic wrapper and formula for
    all Bronze/Silver/Gold summaries, exact parent-summary chain, manifest-derived
    one-Gold-product/one-boundary population/readback and all R4 substitution failures.
  - >-
    Freeze exactly four supported feature names: action_count,
    coordinate_known_action_count, match_count, resolved_possession_action_count.
    Preserve strict integer-only event/subevent mapping and unmapped/quarantined strings.
  - >-
    Encode explicit prohibitions for second semantic derivation, schema/population/
    feature expansion, placeholder digests, provider/network access, product writes or
    publication, cloud, containers, hosted CI, endpoints, remotes and deployment.
  - >-
    Add executable closed authority tests covering canonical bytes, exact key/type/
    order/set equality, fixed bindings, window digest/UUID reconstruction, index and
    period equality, 23/25/9/15/two-key rosters, acyclicity, feature scope, lifecycle,
