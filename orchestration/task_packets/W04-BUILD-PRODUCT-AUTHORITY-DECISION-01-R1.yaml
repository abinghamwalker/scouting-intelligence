  - Verify every fixed binding before editing and stop on drift.
  - >-
    Write exactly one strict R20-canonical JSON-plus-one-LF decision at the allowed
    authority path. Use a closed top-level schema, strict scalar types, NFC strings,
    truthful UTC `decided_at`, master actor `4efe5691-8903-5148-8275-30d2e7e8aed0`,
