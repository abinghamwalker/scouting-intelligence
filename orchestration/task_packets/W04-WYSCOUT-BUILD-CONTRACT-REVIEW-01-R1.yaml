review_requirements:
  - Verify every fixed hash before analysis and stop on drift.
  - >-
    Independently reconstruct the exact one-match window, season UUID, five accepted
    authority rows, five dependency rows, 25-key pre-build projection, 25-key strict
    inverse invocation, and sole one-hash build derivation. Confirm there is no added
    result role, schema root, feature, aggregate, product row, or wider population.
  - >-
    Decode the v15 admission bytes independently and prove their exact 23-key lexical
    roster: the exact twenty COMPONENT_KEYS plus environment_digest,
    repository_code_sha256 and schema_version. Recompute the 20-component environment
    digest, every value proof, proof-array digest, exact uv version, selector grammar,
    digest grammar, and independently supplied ordered count seam. Attack omission,
    addition, reordering, type drift, Boolean counts and coherent downstream rehashes.
  - >-
    Independently reproduce competition_id cb5c5317-fa4a-571e-93dc-ef6ce482eab7
    from competition source ID 364 and confirm it is the sole admitted Gold path.
  - >-
    Audit receipt closure across exactly Bronze, Silver and Gold complete physical
    manifests: canonical bytes plus one LF, parsed equality, digest/size, exact frozen
    authority and lineage, sole R4 two-key complete-manifest semantic derivation,
    exact Bronze-empty/Silver-to-Bronze/Gold-to-Silver parents, and exact one-entry
    Gold-derived boundary population. Attack each summary, physical readback, parsed
    object, authority field, parent field/cardinality/order, Gold role/path/cardinality,
    product digest/count, boundary, receipt, and downstream child rehash.
  - >-
    Confirm the pure contract remains side-effect free, local-only, standard-library
    plus Pydantic, and created no product/data/run bytes, dependency, Git operation,
    provider/network access, cloud, container, hosted CI, endpoint or deployment.
definition_of_done:
  - PASS with P0/P1/P2 equal 0/0/0, or bounded REWORK with executable evidence.
