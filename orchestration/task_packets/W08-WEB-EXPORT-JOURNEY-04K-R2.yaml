deliverables:
  - One isolated TestClient test constructs exact approved exemplar replay and TEAM shortlist through HTTP and reads the rendered hidden export tuple rather than inventing IDs.
  - Analyst creates deterministic pack, verified page asserts every safe field and absence of underlying/private marker, inventory shows one active link; identical repeat retains one row/file/export receipt.
  - Same-tenant approver sees inventory and reads pack. A newly created second same-tenant analyst has empty inventory and gets generic read denial. Scout/admin have no nav/form and direct inventory/create/read/revoke denial.
  - Analyst revokes with non-empty reason; inventory retains one plain revoked row with reason/time and no href for pack, verified read is denied, and database has one revocation/one revocation receipt.
  - Assertions preserve NO_GO/resemblance_only/synthetic_development_only/LIMITED/no-recommendation wording and never treat the synthetic TestClient as a user.
definition_of_done:
  - The one named witness passes with the existing focused suite and no production/template edits.
focused_checks:
  - Exact rendered tuple and safe pack fields.
  - Owner/approver vs other analyst/scout/admin boundary.
  - Idempotent repeat and revoked non-readability/counts.
acceptance_checks:
  - uv run ruff format --check tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py
  - uv run ruff check tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py
  - uv run pytest -q tests/integration/test_w08_local_workflow_app.py tests/security/test_w08_web_security.py tests/integration/test_w08_evidence_export.py tests/security/test_w08_export_boundaries.py
stop_conditions:
