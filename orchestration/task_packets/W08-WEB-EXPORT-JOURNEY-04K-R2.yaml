  - A dependency, protected output, network/external destination, Node/npm, container, Git or destructive action is required.
  - Passing would weaken an authorisation/revocation/non-disclosure assertion.
mandatory_return:
  - task/revision and invariant
  - exact changed files
  - exact commands/exits/test counts
  - role/idempotency/revocation/non-disclosure results
  - any discovered product defect as an exact blocker
  - no Git/dependency/protected-output/out-of-scope confirmations
return_template: orchestration/templates/subagent_return.md
