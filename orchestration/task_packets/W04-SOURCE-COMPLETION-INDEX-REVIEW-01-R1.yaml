review_requirements:
  - Verify every fixed candidate hash before analysis and stop on drift.
  - >-
    Independently rederive or otherwise recompute from the frozen source enough to
    prove the bridge runs first, all five whole-file digest/size/row counts are exact,
    only authorized members are opened, index bytes are deterministic and the full
    3071395 row reconciliation is real rather than metadata trust.
  - >-
    Independently inspect the action and period preimages for source ordinal, provider
    event and match identities, period/clock/order, player/team, integer-only event/
    subevent semantics, raw tags, possession tag projection and Bronze-compatible raw
    record digest. Challenge string/bool/float coercion and missing/null distinctions.
  - >-
    Reproduce rejection of wrong content address, internally self-consistent lookalike,
    address spoof, source binding drift, member/period ordering drift, count/aggregate
    drift, duplicate period/action, missing/additional/reordered/stale/cross-member/
    cross-match/cross-period action and whole-period/whole-match omission.
  - >-
    Determine whether the public factory/reader is the enforceable production
    completeness boundary despite low-level immutable contract models being directly
    constructible for tests. Return REWORK if an authorized downstream product path
    could bypass the reader and obtain accepted provenance/Gold from a caller-selected
    subset. Do not accept a convention-only restriction that executable code does not
    enforce.
  - >-
    Reproduce completion-index digest binding through possession sequence, Silver
    possession, player-match fact, Gold provenance, dependency-lineage hash, temporal
    proof and layer manifest; verify causal other-player/ineligible rows remain.
  - >-
    Reproduce both equal-clock ambiguous-team cases, dependent contested uncertainty
    and preservation of strictly earlier deterministic groups. Challenge source
    ordinal/event identity as a same-clock team tie-break.
  - Verify exactly four Gold features remain and no product/runtime byte was written.
  - Confirm no dependency/lock/provider/network/cloud/container/remote/CI/endpoint/deployment change.
