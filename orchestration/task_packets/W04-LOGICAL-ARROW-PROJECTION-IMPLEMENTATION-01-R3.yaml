rework_requirements:
  - Verify every fixed hash before editing and stop on drift.
  - >-
    Do not trust an existing Pydantic union-member instance merely because its
    class matches one CanonicalJsonValue arm. Before any JSON-mode dump or
    canonical encoding, recover its raw Python field state without coercion and
    strictly revalidate that state as a fresh exact discriminated union value.
  - >-
    The accepted writer must reject direct and recursively nested bypassed state
    created with both `model_copy(update=...)` and `model_construct`, including at
    minimum Boolean-as-integer, float-as-integer, string-as-integer,
    integer-as-Boolean, list-versus-tuple, bare-dict-versus-typed-child, wrong
    discriminator, extra member state, duplicate/unsorted object-member keys,
    non-finite Decimal, non-NFC text and surrogate text.
  - >-
    Revalidation must occur before Pydantic JSON serialization can warn, coerce or
    normalize invalid state. Invalid writer input raises FormatError and cannot
    produce tagged text.
  - >-
    Add end-to-end zero-write tripwires showing copied/constructed invalid values
    cannot reach semantic hashing or `pq.write_table`, while all seven valid
    variants and nested mixed values still round-trip exactly.
  - >-
    Preserve exact descriptor API, physical schema, semantic framing, build
    contract, build tests, authority bytes and R2 rejected-sentinel correction.
    Preserve the accepted physical and semantic identity golden digests.
  - >-
    Do not edit CanonicalJsonValue contract models, add revalidation config there,
    introduce a new type/field/root/digest/version/dependency, or create schema or
    product bytes outside in-memory tests.
