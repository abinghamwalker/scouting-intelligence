requirements:
  - Verify all fixed hashes before editing and stop on drift.
  - >-
    Reject metadata on the value_field of list, large_list and fixed_size_list at
    every recursive depth. Also validate each value-field name and nested nullability
    representation under the same closed schema rules before hashing or encoding.
  - >-
    Change the new W04 semantic helper boundary to require the exact explicit
    metadata-free pa.Schema alongside its descriptor. Re-derive the descriptor from
    that schema and descriptor.schema_role through the same closed encoder validator,
    then require exact descriptor equality before calculating any digest.
  - >-
    There must be no descriptor-only fallback, optional schema or alternate public
    helper that can emit the W04 semantic domain without accepted-schema validation.
    Direct binary/malformed/metadata-like/non-UTC/nanosecond claims must fail closed.
  - >-
    Update only W04-focused callers/tests for the required schema argument. Preserve
    semantic preimage bytes and both fixed vectors; validation evidence is not added
    to the preimage and no existing generic format API changes.
  - >-
    Add list/large/fixed nested-metadata differential tests proving both variants
    cannot be accepted, plus direct-descriptor tests with unsupported/malformed type
    text, mismatched field/nullability/order/role and a valid exact schema/descriptor.
definition_of_done:
  - Both R2 P1 findings are closed with no new P0-P2 issue and all earlier bypasses remain closed.
  - Existing plus new focused tests and legacy guarded-storage suite pass with unchanged valid vectors.
