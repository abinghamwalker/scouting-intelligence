requirements:
  - >-
    Close W04DC-P1-001 at RawKindEvidence itself. Direct construction must
    derive the exact safe/unsafe/non-string/null/missing state, reject every
    known token, and reproduce the exact canonical framed digest. Factory-only
    correctness is insufficient.
  - >-
    Close W04DC-P1-002. SilverAction must accept a non-null canonical subevent
    only for one of the 36 exact admitted strict-integer event/subevent pairs;
    ELIGIBLE_RESOLVED also requires that pair and a resolved team. Bind every
    BronzeRejectedField path/type/value/decision/reason to the exact accepted
    field-v2 decision, including string, boolean, null, non-integer number,
    array, object, and unknown-integer subevents, without coercion.
  - >-
    Close W04DC-P1-003 and the related action-ID gap. Require strict positive
    non-boolean canonical competition, team, player, match, and action source
    IDs at the helper and every public entity/action constructor. Require the
    provider event record ID to be strict positive and equal the action source
    ID. Zero remains rejected evidence, never a UUID.
  - >-
    Close W04DC-P1-004 with exact finite decimal128(22,18) validation that
    counts positive exponents, limits scale to 18 and integer capacity to four
    digits, and rejects NaN/infinity/overflow. Preserve the exact declared
    lexical source scale; do not quantize, round, clamp, or coerce.
  - >-
    Close W04DC-P1-005 and P1-006. Bind source, identity, field-v2,
    possession-v2, and supported-feature dependency decision/review/acceptance
    clocks to their exact accepted authority records and require every bound
    clock strictly before cutoff. Recompute every DependencyLineage hash and
    require exact row-lineage/temporal-proof equality at player-match and Gold.
    Replace the stale focused-fixture clocks with the exact accepted clocks.
  - >-
    Close W04DC-P1-007. Optional coordinate or possession 0/0
    not-applicable states require the exact accepted FIELD or POSSESSION
    authority evidence respectively; positive and mandatory zero denominators
    forbid that proof. Represent AUTHORITY_MISSING and FAILED only as
    fail-closed non-ready states with explicit sorted reasons. Enforce the
    exact applicability order so no missing/failed/partial/uncertain row becomes
    w04_data_ready.
  - >-
    Close W04DC-P1-008. Bind exact manifest filename/layer/build equality,
    non-empty complete manifests, exact safe preceding-layer parent manifest,
    same-build parent products, exact schema_role to path_role, exact unique
    sorted path partition key/value pairs, fixed tenant, rights, feature and
    dependency lineage, and no traversal/cross-layer/alternate-parent route.
  - >-
    Close W04DC-P1-009 without adding a fifth feature. Contributing
    player-match facts/keys must reconcile to the Gold tenant, manifest, player,
    competition, season, schema and window selection. Derive and verify exactly
    action_count, coordinate_known_action_count, distinct match_count, and
    resolved_possession_action_count from the selected facts; arbitrary keys,
    schema strings, counts, or unrelated facts fail. Keep rates, minutes,
    outcomes, roles, current team, per-90 and value models absent.
  - >-
    Close W04DC-P1-010 with the minimum evidence-bearing fields already
    required by R20: exact measured raw paths/types and admission on known
    Bronze, complete lineage/classification/authority clocks on rejected
    records and fields, exact source availability and acquisition receipt,
    fixed tenant with null club, exact restricted rights, source-family/row
    membership, and zero-based source_record_ordinal strictly below the exact
    manifested row count. Every Bronze/Silver/Gold row and manifest must bind
    the same accepted source authority without cyclic lineage.
  - >-
    Add direct-constructor, mutation, and cross-authority negative matrices for
    all ten findings, including booleans-as-integers, zero/negative IDs, ordinal
    upper bounds, forged raw-kind state, non-admitted subevents, every rejected
    raw type, decimal exponent boundaries, every authority clock, recomputed
    lineage drift, tenant/rights drift, all coverage states, manifest
    path/build/parent/schema/partition drift, and all four Gold feature
    reconciliation routes. Preserve the in-memory one-match/seven-family
    positive fixture and create no product file.
definition_of_done:
  - All ten R1 P1 findings fail closed at each exported constructor.
  - Exact accepted authority/source/preimage bytes and digests remain unchanged.
  - Tests use only in-memory values and tmp-free contract construction; no product or manifest file exists.
  - No new feature, architecture revision, serializer, runtime, build, data write, or dependency is introduced.
acceptance_checks:
  - >-
    uv run ruff format --check src/scouting/contracts/wyscout_data.py
    tests/contracts/test_wyscout_data_contracts.py
  - >-
    uv run ruff check src/scouting/contracts/wyscout_data.py
    tests/contracts/test_wyscout_data_contracts.py
  - >-
    uv run mypy src/scouting/contracts/wyscout_data.py
    tests/contracts/test_wyscout_data_contracts.py
  - uv run lint-imports
  - >-
    uv run pytest -q tests/contracts/test_wyscout_data_contracts.py
    tests/contracts/test_foundation_contracts.py
    tests/contracts/test_w04_identity_ruleset_authority.py
    tests/contracts/test_w04_r21_cross_authority_composability.py
    tests/unit/test_wyscout_source_manifest.py
  - uv run bandit -q -r src/scouting/contracts/wyscout_data.py
  - uv run python scripts/verify_local_only.py
master_only_checks:
  - git diff --check
  - git remote
stop_conditions:
  - Any accepted authority, source, preimage, R20, R21, or R1 review byte must change.
  - Exact correction requires a different project path, dependency, storage, serializer, runtime, or product byte.
  - >-
    Correctness genuinely contradicts frozen architecture, feature scope,
    provider/right, project-root, dependency/lock, local-only, network, cloud,
    container, endpoint, hosted-CI, or deployment boundaries.
