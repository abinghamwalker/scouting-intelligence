requirements:
  - >-
    Work only from accepted R20, the exact accepted field authority, and the
    two frozen taxonomy CSVs. Do not use web/external football knowledge,
    excluded payloads, provider-native possession claims, or runtime label/name
    matching.
  - >-
    Inspect fixed taxonomy labels only as bounded offline decision evidence.
    Runtime authority must consist solely of exact integer event/subevent/tag
    selectors and the frozen source digests. A label change cannot alter
    runtime matching.
  - >-
    Make an explicit conservative master decision for every one of the 36 fixed
    `(event,subevent)` taxonomy pairs. Each pair must have at least one exact,
    non-overlapping predicate. Use tag partitions only when fixed tag IDs and
    disjoint required/forbidden sets justify the distinction; otherwise choose
    the conservative complete R20 combination, including explicit UNMAPPED.
    Unknown/conflicting/unmatched combinations remain UNMAPPED by policy.
  - >-
    Predicates must be sorted by the exact R20 tuple, unique, non-overlapping,
    and use strict nonnegative integers. Required/forbidden tags are sorted,
    unique, disjoint, and drawn from the fixed tag taxonomy. Do not infer a
    missing selector, priority, fallback, opponent team, or possession from
    names.
  - >-
    Every predicate contains all 12 exact R20 fields. Every row decided_by
    equals the top-level master ActorId. Only the six exact valid
    decision/control/open/close/attachment combinations are allowed.
    UNMAPPED is fully explicit with nonempty row-specific rationale.
  - >-
    Use the exact seven closed policies. Set provider-native possession claim
    false and runtime/unknown name matching forbidden.
  - >-
    Render the decision as strict canonical JSON with one LF, exact top-level
    keys, five frozen inputs, truthful post-choice decided_at, and complete
    predicates. Render one safe canonical YAML taxonomy whose parsed
    bound_inputs, policies, and predicate objects equal the decision exactly and
    whose decision_sha256 binds the decision bytes.
  - >-
    Implement the complete R20 contract and rejection matrix. Independently
    reproduce input/taxonomy digests and coverage; enforce schemas, strict
    types, sorting, overlap, tag partitions, actor equality, rationales,
    combination union, canonical JSON/YAML, registry equality, and digest
    edges. Reject label/name matching and provider-native claims.
  - >-
    Make the contract progression-safe from the outset. It must strictly
    validate the future exact review and acceptance when present, block
    possession/dependency/Bronze/runtime outputs without a fully valid
    acceptance, and remain green after separately owned valid review and
    acceptance artifacts later exist. Do not permanently assert those future
    paths are absent.
  - >-
    At packet completion the actual review/acceptance and all possession,
    dependency, Bronze, product, and runtime paths remain absent. Record that as
    execution-time return evidence without creating those artifacts.
  - >-
    Take an actual complete shell-only current pyc preflight before Python.
    Use root uv with `--locked --no-sync`; every Python process starts with
    `PYTHONDONTWRITEBYTECODE=1` and `python -B`. Do not sync, use bare Python,
    clean, repair, or coerce the baseline. Reproduce the exact inventory after
    the return is written.
  - >-
    Change exactly the four owned paths. Do not run Git, delegate, self-approve,
    access provider/network data, or begin review, acceptance, possession
    construction, dependency, identity, feature, Bronze, Silver, Gold, product,
    runtime, cloud, container, endpoint, or deployment work.
definition_of_done:
  - Complete explicit non-overlapping decisions cover all 36 taxonomy pairs.
  - Decision/taxonomy are canonical, equal, closed, and digest-linked.
  - Progression-safe positive/negative contract passes.
  - Future authority and downstream paths remain absent.
  - Terminal inventory exactly equals fresh preflight.
acceptance_checks:
  - >-
    PYTHONDONTWRITEBYTECODE=1 uv run --locked --no-sync python -B -m pytest -q
    tests/contracts/test_w04_possession_semantic_authority.py
  - >-
    uv run --locked --no-sync ruff format --check
    tests/contracts/test_w04_possession_semantic_authority.py
  - >-
    uv run --locked --no-sync ruff check
    tests/contracts/test_w04_possession_semantic_authority.py
  - >-
    PYTHONDONTWRITEBYTECODE=1 uv run --locked --no-sync python -B
    scripts/verify_local_only.py
stop_conditions:
  - >-
    A semantic choice requires external knowledge, a new transform/decision
    kind, label-based runtime matching, or an unsupported provider claim.
  - Any frozen input/digest differs or mandatory taxonomy pair is ambiguous
    beyond conservative UNMAPPED.
  - Any check, inventory, or allowed-path boundary fails.
  - Work requires architecture, root, dependency, rights, storage, or local-only change.
