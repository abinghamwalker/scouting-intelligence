requirements:
  - >-
    Completion proof state must retain enough exact source evidence to re-execute the
    accepted period or match population comparison. On every checked use, derive the
    period/full-match state and reader-built sequences from that evidence; never trust
    a stored Boolean, count, period key, sequence, issuer identity or registry entry.
  - >-
    Product proof state must retain its exact construction kind and dependency graph.
    On every checked use, recursively revalidate completion evidence and recompute the
    exact Action, Possession, Fact, Gold or manifest value from checked dependencies.
    The recomputed exact value and completion scopes must equal the retained product.
  - >-
    Make recursive verification acyclic and fail closed for cycles, malformed record
    types, unissued handles, direct registry insertion, exposed-issuer invocation,
    false complete-match state, detached raw-value reissue and cross-scope mixing.
  - >-
    A registry may remain only as a process-local lookup/cache; neither its membership
    nor issuer secrecy may confer authority. Standard callable introspection of public
    checked functions or private getters must not expose a route that makes arbitrary
    semantic models pass `require_checked_product`.
  - >-
    Preserve the R3 public checked API, normal positive match 2499719 behavior,
    exact one-match manifest scope, raw `semantic_only_unchecked` state, copy/replay
    rejection and future serializer requirement to consume the checked handle.
  - >-
    Preserve exact accepted index bytes/address, full 3071395 reconciliation, strict
    integer-only action projection, equal-clock group-first behavior, causal
    provenance, dependency lineage, six coverage authorities and exactly four Gold
    features. Add no dependency, product byte, provider/network, cloud, container,
    endpoint, hosted CI, remote or deployment.
definition_of_done:
  - Registry/issuer introspection and mutation cannot make a non-reader or malformed population/product pass checked consumption.
  - Every legitimate checked product remains re-verifiable from the exact accepted population and exact dependency graph.
  - The complete R3 focused suite and new bounded regression tests pass.
