requirements:
  - Verify all fixed bindings before implementation.
  - >-
    Build the exact eight-key schema-bundle v2 object in canonical key order from
    export_w04_implemented_schema_rows(), exact 23 required roles and fixed R2
    values. Validate every content digest from exported canonical root bytes,
    unique IDs, exact order and earlier-only dependency edges. Hash only R20
    canonical UTF-8 JSON without LF.
  - >-
    Only after the schema digest exists, build the exact ten-key product-contract
    v2 object with actual schema_bundle_preimage_v2_sha256, exact completion-index
    binding, feature cutoff, publication order, window authority and receipt
    composition. receipt_contracts must include both exact receipt schemas plus the
    sole R4 two-key complete-LayerManifest semantic derivation, all-three summary
    reconciliation, parent chain, one-Gold/one-boundary population and substitution
    rejection. Hash only the canonical no-LF object.
  - >-
    Physical config files are canonical compact UTF-8 JSON plus exactly one LF.
    Implement deterministic write and --check. Check must reject absent, malformed,
    unequal, duplicate-key, wrong-order, placeholder, swapped digest, v1 digest,
    self-reference, forward/cycle or terminal-byte drift. Write must fail on an
    existing unequal file and idempotently accept exact bytes; it may create only
    the two owned config files.
  - >-
    Do not scan, infer, write or advertise product/data/run/manifest/receipt/build
    instances. Preserve the unchanged 25-key build projection and digest meanings.
