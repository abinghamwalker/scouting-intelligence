requirements:
  - >-
    Derive every concrete model from the existing strict extra-forbidden
    ContractModel and reuse StrictUuid, UtcInstant, Sha256Digest,
    EvidenceDependency, and DependencyLineage without altering them. Use deeply
    immutable values and deterministic canonical JSON.
  - >-
    Implement the exact seven-kind source envelope
    (competition, team, player, event-taxonomy, tag-taxonomy, match, action);
    source-row/lineage and seven-field authority references; Bronze known,
    rejected-record/raw-kind, and rejected-field contracts; all eight Silver
    product contracts; Gold temporal proof, six coverage dimensions, exact
    four-feature values, player-window row; and layer manifest entry/manifest.
  - >-
    The envelope discriminator is only record_kind. Never infer kind from
    payload or filename. Preserve JSON numbers as Decimal and raw values
    canonically. Unknown kinds use only the fixed missing/null/non-string/
    string-unknown-safe/string-unsafe states and never enter known products.
  - >-
    Action subevent taxonomy is present only for a strict integer admitted by
    the accepted field-v2 event/subevent pair. Boolean, string,
    numeric-looking-string, float, null, collection, and unknown integer values
    remain rejected-field evidence without coercion. Possession consumes only
    the four accepted canonical selector fields.
  - >-
    Bind the exact action order, match/period possession boundary, exact
    player-match and Gold keys, neutral role UUIDv5 context, result-independent
    exclusions, exact 17 product/manifest/receipt path roles, literal records
    segment, five country tokens, six-fraction UTC path token, and
    Bronze-to-Silver-to-Gold ordering.
  - >-
    Gold contains exactly the four fixed supported features and no rate,
    per-90, minutes, outcome, score, inferred-role, current-team, or value-model
    feature. feature_schema_hash is required but is not a Gold key member.
  - >-
    Coverage dimensions are exactly identity, lineup, action, coordinate,
    possession, temporal with strict integer N/D, exact Decimal coverage,
    zero-denominator rules, lexical missing-dimension order, overall minimum,
    and only suppressed, research_only, or w04_data_ready applicability.
  - >-
    Temporal proof has exactly five ordered dependencies: source manifest,
    identity evidence, field-v2, possession-v2, and supported-feature. Reject
    duplicate kind/ID, wrong cardinality, any bound clock at/after cutoff, and
    lineage drift. valid_from is max(snapshot, availability watermark).
    Semantic proof is clock-free and must contain no generated/run/host/output
    time.
  - >-
    Tests must materialize an in-memory one-match seven-family contract fixture
    through Bronze, all Silver families, and one Gold player-window with exact
    keys, paths, lineage, coverage, and four feature values. This is contract
    evidence only: no product or manifest file may be written.
definition_of_done:
  - Exact closed contract surface validates the one-match four-feature fixture.
  - Negative matrices close coercion, path, temporal, feature, coverage, and immutability routes.
  - No serializer, runtime, product, manifest, receipt, build, or data file exists.
acceptance_checks:
  - >-
    uv run ruff format --check src/scouting/contracts/wyscout_data.py
    tests/contracts/test_wyscout_data_contracts.py
  - >-
    uv run ruff check src/scouting/contracts/wyscout_data.py
    tests/contracts/test_wyscout_data_contracts.py
  - >-
    uv run mypy src/scouting/contracts/wyscout_data.py
    tests/contracts/test_wyscout_data_contracts.py
  - uv run lint-imports
  - >-
    uv run pytest -q tests/contracts/test_wyscout_data_contracts.py
    tests/contracts/test_foundation_contracts.py
    tests/contracts/test_w04_r21_cross_authority_composability.py
    tests/unit/test_wyscout_source_manifest.py
  - uv run python scripts/verify_local_only.py
stop_conditions:
  - Any accepted authority, source, preimage, or existing contract byte must change.
  - Exact contract implementation requires a different path, dependency, storage, or schema authority.
  - >-
    Correctness requires product serialization, data writes, architecture,
    provider/right, project-root, dependency/lock, network, cloud, container,
    endpoint, hosted-CI, deployment, or broader-scope change.
