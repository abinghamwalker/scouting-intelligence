requirements:
  - >-
    Close W04DCR2-P1-001. ActionSubeventOutcome must carry enough raw event
    and typed subevent evidence for its public constructor to derive the same
    exact admitted-pair or rejected-reason result as classify_action_subevent.
    A caller must not be able to emit an arbitrary canonical integer.
  - >-
    Close W04DCR2-P1-002. Derive action possession eligibility from the exact
    accepted possession-v2 predicate roster using only accepted field-v2
    canonical event, subevent, team, and sorted tags. Reject all eight admitted
    but possession-ineligible pairs and any forged resolved state. Where a
    resolved possession count is claimed, close it against exact contributing
    Silver possession membership rather than presence of IDs alone.
  - >-
    Close W04DCR2-P1-003. Treat completion path plus zero-based ordinal as the
    unique physical source-row key, so a digest disagreement at the same
    location fails. Bind every Silver row to its exact relevant source
    reference or closed ordered source-reference set; derive action ordinal and
    match country partition from those selected references. Bare any()-by-
    ordinal and lineage-family-only evidence are insufficient.
  - >-
    Close W04DCR2-P1-004. Add the exact content-addressed identity dependency
    UUIDv5 rule from R20: UUIDv5(w04_dependency_namespace,
    "identity_bundle:" + identity_bundle_sha256). Validate the derived ID,
    digest grammar, exact accepted clocks, order, and lineage hash. The bundle
    digest is dynamic runtime evidence; do not hard-code a fabricated value.
  - >-
    Close W04DCM-P1-011. BronzeRejectedField is the shared R20 product for the
    complete accepted field-v2 registry, not a subevent-only type. Bind
    record_kind, exact JSON path, measured type, decision, reason, source row,
    field-v2 authority, rights, and lineage to the accepted 119-row registry
    surface without runtime file reads. Retain the R21 special strict
    action/$.subEventId reason matrix, permit absent canonical event evidence
    on its unknown-pair route, and reject admitted emitted pairs.
  - >-
    Close W04DCM-P1-012. SilverPlayerMatchFact must carry a closed, unique,
    ordered set of contributing SilverAction evidence and any SilverPossession
    evidence needed for resolved membership. Derive action_count,
    coordinate_known_action_count, and resolved_possession_action_count from
    that evidence, reconciling build, tenant, lineage, match, player and team.
    Gold continues to derive exactly the same three counts plus distinct
    match_count from selected facts. No fifth feature is permitted.
  - >-
    Close W04DCR2-P1-005. Derive all six Gold coverage dimensions by exact
    aggregation of the selected player-match facts. Sum authoritative integer
    numerators/denominators, propagate failed/authority-missing states and
    optional zero-denominator authority correctly, recompute exact decimal
    coverage, missing_dimensions, reasons, and coverage_overall, and reject
    every caller-supplied drift.
  - >-
    Close W04DCR2-P1-006. Derive non-ready applicability reason_codes as the
    exact sorted unique union of the applicable coverage evidence reasons plus
    the frozen uncertainty reason when right-censored/uncertain. Compare both
    state and reasons at Silver fact and Gold boundaries; unrelated, missing,
    additional, or reordered reasons fail. Data-ready retains no reasons.
  - >-
    Close W04DCR2-P1-007. Every materialized Parquet LayerManifestEntry must
    have row_count >= 1 and size_bytes >= 1. Empty quarantine partitions remain
    represented by absence of a Parquet entry, never a zero-row/zero-byte file.
    Apply the direct-constructor matrix across Bronze, Silver, and Gold.
  - >-
    Preserve all R1/R2 closures. Add a named negative test for every reviewer
    and master probe, full admitted/ineligible possession matrices, duplicate
    physical locations, same ordinals on distinct paths, all seven source
    families and partition mutations, identity ID/digest substitutions,
    representative non-subevent PRESERVE_UNMAPPED/FORBIDDEN registry rows,
    action/fact/possession leakage, all six coverage dimensions, applicability
    reason drift, and zero materialization counts.
definition_of_done:
  - All nine R2/master finding families fail closed at each exported constructor.
  - Exact accepted authority/source/preimage bytes and digests remain unchanged.
  - Exactly four supported feature values remain and are evidence-derived.
  - Tests remain in-memory and create no product, manifest, receipt, or runtime file.
  - No architecture revision, serializer, dependency, provider access, or product write is introduced.
