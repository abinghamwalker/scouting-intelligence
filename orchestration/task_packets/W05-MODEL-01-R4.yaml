schema_version: 1
task_id: W05-MODEL-01
phase_id: W05
revision: R4
state: DISPATCHED
objective: >-
  Close the R3 representation, trust-pinning, temporal and adversarial-test defects
  without changing the frozen R3 geometry, global configuration semantics or scores.
depends_on:
