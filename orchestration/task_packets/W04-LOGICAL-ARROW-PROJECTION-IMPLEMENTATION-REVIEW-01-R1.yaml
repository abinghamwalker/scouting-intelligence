review_requirements:
  - Verify every fixed hash before analysis and stop on drift.
  - Read and inspect every line of both implementation modules and both tests.
  - >-
    Independently prove exact descriptor runtime typing and invariants, recursive
    metadata absence, descriptor-only schema construction and complete table/
    generated-schema equality without fixture/row/empty-sequence inference.
  - >-
    Independently reproduce all seven CanonicalJsonValue variants, present tagged
    null versus optional outer null, invalid UTF-8, nested duplicate keys,
    constants/float tokens, whitespace/key-order/escape/NFC/surrogate drift and
    strict typed/canonical byte-equality failures before any write.
  - >-
    Attack positional tuple name/order/position/type/nullability/arity drift and
    homogeneous list child/list-kind/fixed-size/cardinality drift, including empty
    and nonempty values sharing one descriptor schema.
  - >-
    Verify encoder and semantic-hash public signatures cannot accept caller
    schema, schema role, callback, Boolean, digest or equivalent-looking object.
    Verify every malformed family calls `pq.write_table` zero times.
  - >-
    Independently reconstruct the sole semantic preimage and exact identity
    physical/semantic golden vectors. Search source and tests for any second
    semantic domain, projection digest/preimage, unavailable-schema formula or
    placeholder accepted digest.
  - >-
    Audit the build adaptation: caller Arrow table/schema/descriptor authority is
    unrepresentable; logical Gold readback remains exact; closure fails with
    GoldSchemaAuthorityUnavailableError; the fixed H1 claim is explicitly
    rejected and cannot authorize any product.
  - >-
    Confirm no root descriptor, root schema, schema bundle, product byte, feature,
    population, dependency, provider access, publication, cloud/container/CI/
    deployment or Git-remote state was created.
  - >-
    Return PASS only with zero P0/P1/P2 findings. Otherwise write REWORK with exact
    reproduction. Do not repair or approve your own findings.
