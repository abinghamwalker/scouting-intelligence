phase_id: W06
revision: R1
state: DISPATCHED
objective: >-
  Independently review whether the R1 robustness/null/missing-population/applicability
  implementation actually performs each declared stress/control behavior and fails
  closed on exact governed-population deficits.
depends_on:
  - W06-EVAL-ROBUSTNESS-04-R1:IMPLEMENTED
