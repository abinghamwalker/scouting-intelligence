  - Mandatory return at reports/reviews/W06/returns/W06-EVAL-ROBUSTNESS-REVIEW-04-R5.md.
definition_of_done:
  - Exact numeric substitutions and the one-core/no-second-implementation requirement are independently adjudicated.
  - Any additional finding must change or permit drift in metric, interval, population, leakage, applicability or protected-decision evidence.
  - Review remains public-only and does not access protected expected outputs.
acceptance_checks:
  - uv run --no-sync pytest -p no:cacheprovider -q tests/contracts/test_w06_evaluation_contracts.py tests/unit/test_w06_evaluation_metrics.py tests/contracts/test_w06_robustness_contracts.py tests/unit/test_w06_robustness.py
