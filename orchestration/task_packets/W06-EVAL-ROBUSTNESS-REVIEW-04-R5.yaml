review_questions:
  - Do all three exact R4 numeric-child parents reject under normal construction?
  - Are comparison values produced and validated by one shared derivation with no live duplicate formula?
  - Are per-query, aggregate and interval values produced and validated by one shared derivation used by the general evaluation core and robustness owners?
