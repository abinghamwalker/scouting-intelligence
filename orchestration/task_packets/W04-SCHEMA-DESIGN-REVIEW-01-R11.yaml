objective: >-
  Independently review the complete standalone R18 schema and deterministic
  rebuild design, reproducing every corrected semantic-authority and retained
  launch/build closure, and issue PASS only if no P0-P2 defect remains.
depends_on:
  - W04-SCHEMA-DESIGN-01-R18:MASTER_ACCEPTED
assigned_role: independent_data_architecture_reviewer
risk: high
read_first:
  - AGENTS.md
  - reports/reviews/W04/wyscout-schema-design-R18.md
  - reports/reviews/W04/returns/W04-SCHEMA-DESIGN-01-R18.md
  - orchestration/task_packets/W04-SCHEMA-DESIGN-01-R18.yaml
  - orchestration/reviews/REVIEW-W04-SCHEMA-DESIGN-01-R18.yaml
  - reports/verification/W04/wyscout-schema-design-R18-master-verification.md
  - orchestration/reviews/REVIEW-W04-SCHEMA-DESIGN-01-R17.yaml
  - reports/verification/W04/wyscout-schema-design-R17-master-verification.md
  - reports/phase-gates/W04/source-schema-profile.md
