preregistered_configuration:
  configuration_id: w05-m0-baselines-v1
  configuration_version: v1
  deterministic_seed: 20260803
  weighted_cosine_weights: [2.0, 2.0, 2.0, 2.0, 1.0, 0.1]
  pca_component_count: 3
  role_aware_minimum_overlap: 0.75
  selected_model_family: role_aware_restriction
  comparison_k: 3
requirements:
  - >-
    Apply every R2 requirement not superseded by this exact construction. Preserve all
    accepted W04/W05 predecessor bytes and both R1/R2 returns. Build the candidate and
    query fixtures exactly from preregistered_construction; do not add discretionary
    values, labels, samples or alternative constructions.
  - >-
    Candidate rows use the existing exact synthetic feature-row shape with empty state
    overrides. An aerial value of zero is an admitted observed ZERO, not missing or
    suppressed. All other values are complete numeric VALUE states. Embed explicit
    football-language archetype and nuisance notices in the candidate fixture root.
  - >-
    Candidate and query fixture loaders must use exact-key, strict-scalar, canonical
    byte and self-digest validation. They must reproduce every expected FeatureValue,
    contextual role distribution, dependency lineage, peer group and query projection.
    Unknown keys, boolean-as-number, duplicates, reordered populations and claim/pin
    substitutions fail closed.
  - >-
    Extend the canonical M0 configuration to pin candidate/query fixture IDs and
    digests, their exact ordered population projection digests, the selected family,
    k, and the expected per-family numeric array-payload digests. Arrays depend only on
    the preregistered semantic settings, so these expected payload digests are computed
    before the configuration self-digest and do not form a cycle. Load the config as a
    normally validated typed authority with exact keys and a source-pinned accepted
    ID/version/digest; arbitrary self-re-signed mappings are not accepted.
  - >-
    Artifact candidate-universe JSON must carry and validate the exact fixture/query
    pins and ordered population projection bound by the accepted typed config. The
    manifest must use canonical exact model/index IDs and an artifact ID derived from
    all immutable family/config/population/array inputs. Runtime loading requires the
    accepted typed config, registry and taxonomy authorities and rejects re-signed
    model, manifest, array, candidate or config substitution.
  - >-
    Correct R1 implementation gaps while completing the packet: metadata controls use
    the metadata-control feature names/schema/matrix consistently; all other families
    use the six-feature schema; malformed admitted candidate rows fail rather than
    silently disappear; the runtime rejects a symlinked artifact root; loaded nested
    config/candidate state is immutable; and a caller cannot override the artifact's
    pinned role threshold during scoring.
  - >-
    Keep one runtime distance implementation. Every family returns a contribution
    vector aligned exactly to its manifest feature_names. PCA contributions must be
    deterministically projected to the original six feature positions, not returned
    as three unlabeled component terms. Distances, contribution bytes and UUID tie
    order must reproduce exactly after reload.
  - >-
    Canonical PCA orientation is lowest-index maximum-absolute pivot non-negative;
    tied components order by explained variance descending then canonical component
    bytes. Apply the same order/sign to components and index vectors. Direct tests must
    cover sign flips, tied variance and two independent fits.
  - >-
    Run exactly one R3 development comparison over all 18 ordered leave-one-out queries
    after fixture/config digests are frozen. Report all six exact precision@3 values
    and stable ranking digests. Do not search, adjust, retry, subset or degrade a
    control after observing the result. Stop if selected role-aware precision is not
    strictly greater than both metadata and raw Euclidean controls.
  - >-
    Materialize each family in bounded temporary tests and selected role-aware only at
    runs/w05/m0-baseline-v1 with exactly arrays.npz, manifest.json,
    configuration.json and candidate-universe.json. Use safe deterministic NPZ/JSON,
    allow_pickle=false, little-endian float64 C arrays, uint8 UUID rows, fixed ZIP
    metadata and immutable exact reload. Reject unsafe names/paths, object/pickle,
    extra/missing/duplicate entries and all dtype/shape/order/digest drift.
  - >-
    Retain and quote R1's negative scores and finite-search evidence in the R3 return.
    The positive R3 fact is only a deliberately constructed synthetic development
    readiness check. It is not validation, protected evidence, expert review,
    recruitment effectiveness, robustness, transfer, Wyscout or production evidence.
deliverables:
  - Exact canonical candidate/query fixtures and typed source-pinned M0 configuration.
  - Complete pure runtime scorer/loader and separate deterministic trainer/writer.
  - All six deterministic family artifacts in tests and selected role-aware local artifact.
  - Focused adversarial tests and complete R3 return with every exact identity/digest/score/limitation.
definition_of_done:
  - All six families fit, load, score and explain deterministically behind one interface.
  - The one no-retry R3 check strictly clears both controls and selected bytes reload exactly.
  - Authority and serialization substitutions fail closed with no production/W06 claim.
acceptance_checks:
  - uv run ruff format --check src/scouting/m0 src/scouting/modeling tests/unit/test_w05_m0_models.py
  - uv run ruff check src/scouting/m0 src/scouting/modeling tests/unit/test_w05_m0_models.py
  - uv run mypy src/scouting/m0 src/scouting/modeling
  - uv run pytest -q tests/unit/test_w05_m0_models.py tests/unit/test_w05_features.py tests/unit/test_w05_roles.py tests/contracts/test_w05_m0_contracts.py
  - uv run lint-imports
  - uv run python scripts/verify_local_only.py
stop_conditions:
  - Any accepted W04/W05 contract, registry, taxonomy or predecessor fixture byte would need to change.
  - The exact preregistered construction is ambiguous or cannot reproduce through accepted materializers.
  - The single preregistered R3 comparison does not strictly clear both controls.
  - Any retry, search, query subset, label-responsive change, learned behavior or control degradation would be required.
  - Any external/provider/dependency/destructive/out-of-scope action or path is required.
return_template: orchestration/templates/subagent_return.md
delegation: forbidden
git_operations: forbidden
self_approval: forbidden
