    Reconcile the exact six-key implemented-schema row, canonical ID/version
    ownership and earlier-only closure dependencies for all 23 roles. Identify any
    ambiguous dependency or schema-identity decision that would require user input.
  - >-
    Return the smallest producer packet boundary, owned paths and focused checks.
    Do not emit canonical schema bytes, compute or advertise accepted v2 content
    digests, materialize an aggregate, or edit implementation/tests.
