audit_requirements:
  - Verify every fixed hash before analysis and stop on drift.
  - >-
    Reconcile the exact ordered 23-root roster to the current owning runtime models
    and enumerate any missing model or serialization surface. Do not append roots.
  - >-
    Determine the minimal canonical schema-content shape that truthfully closes
    each root's complete field order, JSON types, literals/enums, nullability,
    nested definitions, tuple/list cardinality and order, grammars, and every
    model-validator cross-field rule without relying on symbol/code/serializer
    digests as schema content.
