    Specify how the same accepted root content must bind the concrete canonical
    Arrow field order, nested types, integer widths, nullability and metadata policy
    for every Parquet product root, especially GOLD_PLAYER_WINDOW, without defining
    a second schema authority or deriving schema from a single fixture row.
