requirements:
  - >-
    Work only from accepted R21 and the exact accepted field-v2 and possession-v1
    authorities. Do not use web/external football knowledge, provider-native
    possession claims, raw/name/label matching, or coerced selector values.
  - >-
    The decision bound_inputs object has exactly the five frozen keys above.
    The exact Section 3.2 possession-v1 acceptance record is carried separately
    as prior_authority; no v1 field input, design/preimage digest, or other
    binding may be added.
  - >-
    Copy all 36 v1 predicate rows, their exact order, actors, choices,
    attachments, tag sets, and rationales byte-semantically. Do not widen,
    guess, relabel, or rewrite any predicate.
  - >-
    Implement the closed CROSS_AUTHORITY contract in the authority and tests.
    It may consume only action_event_taxonomy_id,
    action_subevent_taxonomy_id, action_team_source_id, and action_tag_ids.
    Missing/mistyped selectors, booleans, missing exact pairs, missing required
    tags, present forbidden tags, and missing required canonical team all yield
    UNMAPPED. Raw fields, rejected evidence, names, labels, and coercion are
    forbidden.
  - >-
    The explicit output state is exactly ELIGIBLE_RESOLVED or
    INELIGIBLE_UNMAPPED. Strings such as "10" remain unmapped and must never
    match integer 10. A missing/mistyped action_tag_ids array is UNMAPPED; no
    empty default is synthesized.
  - >-
    Render strict canonical decision JSON with one LF and safe canonical YAML
    whose parsed five inputs, policies, predicates, prior_authority, and source
    equal the decision exactly; bind the decision physical bytes.
  - >-
    Build a progression-safe v2 contract that validates decision, candidate,
    exact v1 immutability, selector positive/negative cases, future exact review
    and acceptance when present, and blocks all later authority/product paths
    until valid progression. It must remain green after later review and
    acceptance artifacts appear.
  - >-
    Before Python, take a fresh shell-only complete pyc/__pycache__ inventory.
    Use only root uv with --locked --no-sync, set PYTHONDONTWRITEBYTECODE=1,
    invoke helper Python with -B, and reproduce the inventory byte-for-byte
    after the return. Do not sync, install, clean, or repair.
  - >-
    Use apply_patch with only the four exact absolute allowed paths. Change no
    fifth path. Do not run Git, delegate, self-approve, edit dependencies,
    access provider/network data, or begin review, acceptance, feature,
    cross-authority, Bronze, Silver, Gold, build, model, product, cloud,
    container, endpoint, hosted CI, or deployment work.
