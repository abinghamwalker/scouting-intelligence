    summary: >-
      The permanent contract test requires the exact future review and
      acceptance paths, plus every future Bronze path, to remain absent. A
      correct independent review therefore makes the focused and full suites
      fail immediately; the exact review and acceptance packets cannot repair
      the failure because R20 grants them no ownership of this test. Even if
      review absence were removed, a correct acceptance and later authorized
      Bronze construction would fail for the same reason. Replace the
      permanent absence assertion with a progression-safe authority-state
      validator: validate a review when present, validate an acceptance only
      when backed by a valid PASS review and unchanged candidate, and require
      Bronze/runtime outputs absent only while no valid acceptance exists.
