[project]
name = "scouting-intelligence"
version = "0.1.0"
description = "Local-only evidence foundation for scouting intelligence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
runtime = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "opentelemetry-sdk>=1.44,<2",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]
data = [
    "duckdb>=1.2,<2",
    "polars>=1.31,<2",
    "pyarrow>=20,<24",
]
model = [
    "scikit-learn>=1.6,<2",
]
orchestration = [
    "pyyaml>=6,<7",
]
test = [
    "httpx>=0.28,<1",
    "hypothesis>=6.130,<7",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
]
e2e = [
    "playwright>=1.50,<2",
]
lint-type = [
    "import-linter>=2.3,<3",
    "mypy>=1.15,<2",
    "ruff>=0.11,<1",
]
security = [
    "bandit>=1.8,<2",
    "detect-secrets>=1.5,<2",
    "pip-audit>=2.8,<3",
    "pip-licenses>=5,<6",
]

[tool.uv]
default-groups = ["test", "lint-type"]

[tool.uv.build-backend]
module-name = "scouting"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.importlinter]
root_packages = ["scouting"]

[[tool.importlinter.contracts]]
id = "scouting-current-layers"
name = "Current scouting modules follow the approved dependency direction"
type = "layers"
layers = [
    "scouting.web",
    "scouting.workflow",
    "scouting.operations | scouting.policy",
    "scouting.serving",
    "scouting.sources",
    "scouting.storage",
    "scouting.audit",
    "scouting.contracts",
]

[[tool.importlinter.contracts]]
id = "serving-cannot-import-provider-sources"
name = "Serving never imports provider adapters"
type = "forbidden"
source_modules = ["scouting.serving"]
forbidden_modules = ["scouting.sources"]

[[tool.importlinter.contracts]]
id = "workflow-policy-cannot-import-provider-sources"
name = "Workflow and policy never import provider adapters"
type = "forbidden"
source_modules = ["scouting.workflow", "scouting.policy"]
forbidden_modules = ["scouting.sources"]
